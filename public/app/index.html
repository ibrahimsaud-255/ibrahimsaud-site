<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مؤسسة حروف ودروس</title>
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حروف ودروس">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ibrahimsaud-255/ibrahimsaud-site/main/%D8%B4%D8%B9%D8%A7%D8%B1_%D8%A7%D9%95%D8%A8%D8%B1%D8%A7%D9%87%D9%8A%D9%85_%D8%B3%D8%B9%D9%88%D8%AF.png">
<link rel="manifest" href='data:application/manifest+json,{"name":"Ibrahim Saud System","short_name":"Ibrahim Saud","start_url":".","scope":".","display":"standalone","orientation":"portrait","background_color":"%230a0a0b","theme_color":"%230a0a0b","icons":[{"src":"https://raw.githubusercontent.com/ibrahimsaud-255/ibrahimsaud-site/main/%D8%B4%D8%B9%D8%A7%D8%B1_%D8%A7%D9%95%D8%A8%D8%B1%D8%A7%D9%87%D9%8A%D9%85_%D8%B3%D8%B9%D9%88%D8%AF.png","sizes":"any","type":"image/png","purpose":"any"}]}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<style>
  /* ===== خط ثمانية (Thmanyah) — خط النظام ===== */
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Light.woff2") format("woff2");font-weight:300;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
  @font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Black.woff2") format("woff2");font-weight:800 900;font-display:swap}
  @font-face{font-family:"Thmanyah Serif";src:url("/fonts/thmanyah/thmanyahserifdisplay-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Thmanyah Serif";src:url("/fonts/thmanyah/thmanyahserifdisplay-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
  @font-face{font-family:"Thmanyah Serif";src:url("/fonts/thmanyah/thmanyahserifdisplay-Black.woff2") format("woff2");font-weight:800 900;font-display:swap}
  :root{
    --bg:#0a0a0b; --panel:#141416; --panel2:#1d1d20; --panel3:#26262b; --line:#2c2c31;
    --ink:#f4f4f5; --muted:#9b9ba3; --gold:#f5a623; --gold2:#ffc24d; --goldsoft:rgba(245,166,35,.14);
    --good:#22c55e; --bad:#ef4444; --warn:#f59e0b; --info:#6366f1; --teal:#2dd4bf; --pink:#ec4899; --blue:#3b82f6;
    --radius:14px; --shadow:0 14px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:'Thmanyah Sans','Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wordmark,.hero-card h1,.desk-head h1,.page-head h1,.pd-title,.login-box .wordmark{font-family:'Thmanyah Serif','Thmanyah Sans',serif}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .hidden{display:none !important}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--ink);font-family:inherit;font-size:15px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
  /* إدخال أرقام أسلس: إخفاء أسهم الزيادة/النقصان المزعجة في كل الحقول */
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  .amt-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .amt-chips button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px}
  .amt-chips button:hover{border-color:var(--gold);color:var(--gold2)}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;transition:.15s}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1205}
  .btn-gold:hover{filter:brightness(1.08)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--gold)}
  .btn-sm{padding:7px 13px;font-size:13px;border-radius:8px}
  .wordmark{font-weight:900;letter-spacing:-.5px}
  .wordmark .w{color:#fff}.wordmark .g{color:var(--gold)}

  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:38px;box-shadow:var(--shadow);text-align:center}
  .login-box .wordmark{font-size:32px;margin-bottom:6px}
  .login-box p{color:var(--muted);margin:0 0 24px;font-size:14px}
  .field{margin-bottom:16px;text-align:right}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .lock-note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
  .pw-wrap{position:relative}
  .pw-wrap input{padding-left:62px}
  .pw-toggle{position:absolute;left:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:6px 8px}
  .pw-toggle:hover{color:var(--gold2)}
  .link-line{margin-top:16px;font-size:13px}
  .link-line button{background:none;border:none;color:var(--gold2);font-weight:700;font-size:13px;padding:2px 4px}
  .link-line button:hover{text-decoration:underline}
  .pw-meter{height:5px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
  .pw-meter > i{display:block;height:100%;width:0;transition:.25s}
  .pw-hint{font-size:11px;color:var(--muted);margin-top:5px;text-align:right}
  .btn:disabled{opacity:.55;filter:none;cursor:default}

  /* ===== CUSTOM SHELL (sidebar) — قائمة مرنة قابلة للطي والسحب ===== */
  .shell{display:grid;grid-template-columns:var(--sb-w,252px) 1fr;min-height:100vh;transition:grid-template-columns .22s cubic-bezier(.4,0,.2,1)}
  .shell.sb-resizing{transition:none;user-select:none;cursor:col-resize}
  .shell.sb-collapsed{grid-template-columns:0 1fr}
  .shell.sb-collapsed .sidebar{opacity:0;pointer-events:none;padding-left:0;padding-right:0;overflow:hidden}
  .sidebar{background:linear-gradient(180deg,rgba(22,22,25,.86),rgba(8,8,10,.94));backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border-left:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
  /* مقبض السحب لتكبير/تصغير القائمة */
  .sb-resizer{position:absolute;left:-4px;top:0;bottom:0;width:9px;cursor:col-resize;z-index:45;touch-action:none}
  .sb-resizer::before{content:"";position:absolute;left:3px;top:50%;transform:translateY(-50%);width:3px;height:42px;border-radius:3px;background:rgba(255,255,255,.14);transition:.16s}
  .sb-resizer:hover::before,.shell.sb-resizing .sb-resizer::before{background:var(--gold);height:88px;box-shadow:0 0 12px var(--gold)}
  .logo-area{padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .logo-area .wordmark{font-size:23px}
  .logo-area .tagline{color:var(--muted);font-size:12px;margin-top:3px;letter-spacing:.5px}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
  .nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer;border-right:3px solid transparent;transition:.12s}
  .nav a .nic{font-size:17px;width:22px;text-align:center;display:inline-flex;align-items:center;justify-content:center}
  .nav a .nic svg{width:19px;height:19px}
  .stat .ic svg{width:24px;height:24px}
  .quick button svg{width:16px;height:16px;vertical-align:-3px;margin-left:6px}
  .btn svg{width:15px;height:15px;vertical-align:-2px}
  .page-head h1 svg{width:22px;height:22px;vertical-align:-3px;margin-left:6px}
  .card h3 svg{width:18px;height:18px;vertical-align:-3px;margin-left:5px}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.active{background:var(--goldsoft);color:var(--gold2);border-right-color:var(--gold)}
  .nav-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:3px}
  .nav-foot a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer}
  .nav-foot a:hover{background:var(--panel2);color:var(--ink)}
  .nav-foot a .nic{width:22px;display:inline-flex;align-items:center;justify-content:center}
  .nav-foot a .nic svg{width:18px;height:18px}
  .content{display:flex;flex-direction:column;min-height:100vh;min-width:0}
  .content-top{height:60px;background:rgba(13,13,15,.72);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 24px;position:sticky;top:0;z-index:30}
  .ct-left{display:flex;align-items:center;gap:12px}
  .ct-title{font-weight:800;font-size:18px}
  .ct-date{color:var(--muted);font-size:13px}
  .menu-toggle{display:none;background:none;border:none;color:var(--ink);font-size:22px;cursor:pointer}
  .menu-toggle svg{width:22px;height:22px;vertical-align:-4px}
  /* زر طي/فتح القائمة (سطح المكتب) */
  .sb-btn{display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);color:var(--ink);border-radius:10px;width:38px;height:38px;cursor:pointer;transition:.15s}
  .sb-btn:hover{background:rgba(255,255,255,.13);border-color:var(--gold)}
  .sb-btn svg{width:19px;height:19px}
  @media(max-width:860px){.sb-btn{display:none}}
  /* زر زجاجي عام (هوية Liquid Glass) */
  .glass-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.16);color:var(--ink);border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);transition:.15s}
  .glass-btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);transform:translateY(-1px)}
  .glass-btn svg{width:16px;height:16px}
  /* branded home */
  .hero-card{background:linear-gradient(120deg,rgba(245,166,35,.18),rgba(245,166,35,.02));border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-bottom:24px}
  .hero-card h1{margin:0 0 4px;font-size:26px}
  .hero-card p{margin:0;color:var(--muted)}
  .quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
  .oauth-row{display:flex;gap:10px;margin-top:14px}
  .oauth-row button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#1a1205;border:none;border-radius:10px;padding:11px;font-weight:700;font-size:14px;cursor:pointer}
  .oauth-row button.apple{background:#111;color:#fff;border:1px solid var(--line)}
  .oauth-row button:hover{filter:brightness(.95)}
  .sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
  .sep:before,.sep:after{content:"";height:1px;background:var(--line);flex:1}
  .logo-upload{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .logo-upload img{height:54px;border-radius:8px;background:#000;padding:4px}
  .quick button{background:#000;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 15px;font-weight:700;font-size:14px;cursor:pointer;transition:.12s}
  .quick button:hover{border-color:var(--gold);color:var(--gold2)}
  @media(max-width:860px){
    .shell{grid-template-columns:1fr}
    .sidebar{position:fixed;right:0;top:0;width:252px;z-index:60;transform:translateX(105%);transition:transform .2s;box-shadow:var(--shadow)}
    .sidebar.open{transform:translateX(0)}
    .menu-toggle{display:block}
  }

  .main{padding:26px 34px;max-width:1500px;margin:0 auto;width:100%}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
  .page-head h1{margin:0;font-size:24px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:26px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
  .stat:after{content:"";position:absolute;top:-20px;left:-20px;width:80px;height:80px;border-radius:50%;background:var(--goldsoft)}
  .stat .v{font-size:28px;font-weight:800}
  .stat .l{color:var(--muted);font-size:14px;margin-top:4px}
  .stat .ic{font-size:22px;position:absolute;top:16px;left:16px;opacity:.8}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .card h3{margin-top:0}

  /* ===== LAUNCHPAD (شبكة التطبيقات — أيقونات Liquid Glass) ===== */
  .lp-wrap{margin-bottom:28px}
  .lp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .lp-head h2{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
  .lp-head h2 svg{width:20px;height:20px;color:var(--gold2)}
  .lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px}
  .lp-tile{display:flex;flex-direction:column;align-items:center;gap:9px;padding:6px 2px;border:none;background:none;cursor:pointer;text-align:center;color:inherit}
  .lp-ic{position:relative;overflow:hidden;width:62px;height:62px;border-radius:22px;display:grid;place-items:center;box-shadow:0 12px 26px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.14);transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s}
  .lp-ic::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55),inset 0 -12px 22px rgba(0,0,0,.28);pointer-events:none}
  .lp-ic::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(155deg,rgba(255,255,255,.5),rgba(255,255,255,.08) 36%,transparent 58%);pointer-events:none}
  .lp-ic svg{position:relative;z-index:1;width:28px;height:28px;color:#fff;stroke-width:2.1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
  .lp-tile:hover .lp-ic{transform:translateY(-5px) scale(1.06);box-shadow:0 18px 34px rgba(0,0,0,.58)}
  .lp-tile:active .lp-ic{transform:translateY(-1px) scale(1.0)}
  .lp-name{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.3}

  /* ===== سطح المكتب (صفحة التطبيقات المستقلة) ===== */
  .desk{padding-top:4px;min-height:calc(100vh - 120px)}
  .desk-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:30px}
  .desk-head h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.6px}
  .desk-head p{margin:5px 0 0;color:var(--muted);font-size:14px}
  .desk-grid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:30px 14px;max-width:1040px}
  .desk-grid .lp-ic{width:78px;height:78px;border-radius:24px}
  .desk-grid .lp-ic svg{width:35px;height:35px}
  .desk-grid .lp-name{font-size:13.5px;margin-top:1px}
  .desk-grid .lp-tile{gap:11px}
  /* خلفية الشاشة */
  .wp-chip{position:relative;height:64px;border-radius:12px;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:end center;padding-bottom:6px;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-bottom:16px}
  .wp-chip.img{background-size:cover;background-position:center}
  .wp-chip .wp-del{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:15px;line-height:1;display:grid;place-items:center;cursor:pointer;z-index:2;padding:0}
  .wp-chip .wp-del:hover{background:var(--bad)}
  .wp-sec-title{font-size:13px;font-weight:800;color:var(--muted);margin:4px 0 10px;display:flex;align-items:center;gap:7px}
  .wp-sec-title svg{width:16px;height:16px;color:var(--gold2)}
  /* أيقونات داخل الملاحظات والعناوين والوسوم */
  .badge-note svg{width:18px;height:18px;flex:0 0 auto;margin-top:2px;color:var(--gold2)}
  .inl{display:inline-flex;align-items:center;vertical-align:-3px}
  .inl svg{width:14px;height:14px}
  .ed-toolbar .btn svg{width:15px;height:15px;vertical-align:-2px}
  .slash .si svg{width:16px;height:16px}

  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
  th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
  th{background:var(--panel2);color:var(--muted);font-weight:700;font-size:13px}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  .pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
  .pill.draft,.pill.lead{background:rgba(155,155,163,.16);color:var(--muted)}
  .pill.sent,.pill.contacted{background:rgba(99,102,241,.16);color:#a5b4fc}
  .pill.quoted,.pill.scheduled{background:rgba(59,130,246,.16);color:#93c5fd}
  .pill.accepted,.pill.paid,.pill.done,.pill.won,.pill.sale{background:rgba(34,197,94,.16);color:#86efac}
  .pill.unpaid,.pill.progress,.pill.partial{background:rgba(245,158,11,.16);color:#fcd34d}
  .pill.rejected,.pill.lost,.pill.cancelled,.pill.cancel{background:rgba(239,68,68,.16);color:#fca5a5}
  /* Odoo-style status bar */
  .statusbar{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:hidden}
  .statusbar .st{flex:1;text-align:center;padding:9px 10px;font-size:13px;font-weight:700;color:var(--muted);border-radius:8px;white-space:nowrap;position:relative}
  .statusbar .st.done{color:var(--ink)}
  .statusbar .st.active{background:var(--gold);color:#1a1205}
  .doc-acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  /* FullCalendar — مطابقة الثيم الداكن */
  .fc{--fc-border-color:var(--line);--fc-page-bg-color:transparent;--fc-neutral-bg-color:var(--panel2);--fc-today-bg-color:rgba(245,166,35,.10);--fc-highlight-color:rgba(245,166,35,.12);--fc-now-indicator-color:var(--gold);color:var(--ink)}
  .fc a{color:inherit}
  .fc .fc-toolbar.fc-header-toolbar{flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .fc .fc-toolbar-title{font-size:18px;font-weight:800;color:var(--ink)}

function load(){let s;try{const r=localStorage.getItem(KEY);s=r?deepMerge(JSON.parse(JSON.stringify(def)),JSON.parse(r)):JSON.parse(JSON.stringify(def))}catch(e){s=JSON.parse(JSON.stringify(def))}
  if(!s.crmStages||!s.crmStages.length)s.crmStages=JSON.parse(JSON.stringify(def.crmStages));
  if(!s.projectStages||!s.projectStages.length)s.projectStages=JSON.parse(JSON.stringify(def.projectStages));
  (s.crm||[]).forEach(o=>{if(!o.stageKey)o.stageKey=o.stage||s.crmStages[0].key});
  (s.projects||[]).forEach(p=>{if(!p.stageKey){const m=s.projectStages.find(x=>x.label===p.stage);p.stageKey=p.status==='done'?'done':(m?m.key:s.projectStages[0].key)}});
  return s;}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=deepMerge(a[k]||{},b[k])}else a[k]=b[k]}return a}

/* ضغط الصورة وتصغيرها قبل الحفظ (حتى لا تتضخم بيانات الحساب) */
function wpCompress(file){return new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const MAX=1920;let{width:w,height:h}=img;if(w>MAX||h>MAX){const k=Math.min(MAX/w,MAX/h);w=Math.round(w*k);h=Math.round(h*k)}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    try{res(c.toDataURL('image/jpeg',0.82))}catch(e){res(r.result)}
  };img.onerror=rej;img.src=r.result};
  r.onerror=rej;r.readAsDataURL(file);
})}
async function wpUpload(input){
  const files=Array.from(input.files||[]);input.value='';if(!files.length)return;
  if(!S.settings.wallpapers)S.settings.wallpapers=[];
  wpMsg('جارٍ رفع ومعالجة الصور…');
  let lastId=null,ok=0;
  for(const f of files){
    if(!/^image\//.test(f.type))continue;
    if(f.size>12*1024*1024){wpMsg('تم تجاوز صورة كبيرة جداً (أكثر من 12MB).',true);continue}
    try{const data=await wpCompress(f);const id=uid();S.settings.wallpapers.push({id,name:(f.name||'خلفية').replace(/\.[^.]+$/,'').slice(0,28),value:data});lastId=id;ok++;}
    catch(e){wpMsg('تعذّرت معالجة إحدى الصور.',true)}
  }
  if(lastId){S.settings.wallpaper={type:'image',id:lastId,value:S.settings.wallpapers.find(x=>x.id===lastId).value};applyWallpaper();}
  save();wpRenderBody();wpMsg(ok?`تمت إضافة ${ok} خلفية وتطبيق الأخيرة ✓`:'لم تُضَف أي صورة.',!ok);
}

  if(savedW>=200&&savedW<=460)document.documentElement.style.setProperty('--sb-w',savedW+'px');
  if(localStorage.getItem('sb_collapsed')==='1'){sh.classList.add('sb-collapsed');const ic=document.querySelector('#sbToggle i');if(ic)ic.setAttribute('data-lucide','panel-right-open')}

  const h=document.createElement('div');h.className='sb-resizer';h.title='اسحب لتغيير عرض القائمة';sb.appendChild(h);
  let drag=false,startX=0,startW=0;
  h.addEventListener('pointerdown',e=>{drag=true;startX=e.clientX;startW=sb.getBoundingClientRect().width;sh.classList.add('sb-resizing');h.setPointerCapture(e.pointerId);e.preventDefault()});
  h.addEventListener('pointermove',e=>{if(!drag)return;const w=Math.max(200,Math.min(460,startW+(startX-e.clientX)));document.documentElement.style.setProperty('--sb-w',w+'px')});
  const end=()=>{if(!drag)return;drag=false;sh.classList.remove('sb-resizing');const w=Math.round(sb.getBoundingClientRect().width);try{localStorage.setItem('sb_w',w)}catch(e){}};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
}

let FOCUS={running:false,sinceBreak:0,breakUntil:0,iv:null,lastPrayer:''};

function localDay(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function focusSec(){return (S.focus&&S.focus.log&&S.focus.log[localDay()])||0}
function fmtMS(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function beep(times){if(S.focus&&S.focus.soundOn===false)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();let t=AC.currentTime;for(let i=0;i<(times||2);i++){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);o.start(t);o.stop(t+0.37);t+=0.45;}}catch(e){}}
function notifyMe(title,body){try{if(window.Notification){if(Notification.permission==='granted'){new Notification(title,{body})}else if(Notification.permission!=='denied'){Notification.requestPermission().then(p=>{if(p==='granted')new Notification(title,{body})})}}}catch(e){}}
function startFocus(){if(FOCUS.running)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}if(window.Notification&&Notification.permission==='default'){try{Notification.requestPermission()}catch(e){}}FOCUS.running=true;FOCUS.breakUntil=0;if(FOCUS.iv)clearInterval(FOCUS.iv);FOCUS.iv=setInterval(focusTick,1000);paintFocus();}
function pauseFocus(){FOCUS.running=false;if(FOCUS.iv){clearInterval(FOCUS.iv);FOCUS.iv=null}save();paintFocus();}
function resetFocusToday(){if(!confirm('تصفير ساعات تركيز اليوم؟'))return;if(!S.focus.log)S.focus.log={};S.focus.log[localDay()]=0;FOCUS.sinceBreak=0;FOCUS.breakUntil=0;save();paintFocus();}
function focusTick(){
  if(!S.focus.log)S.focus.log={};const k=localDay();
  if(FOCUS.breakUntil){if(Date.now()>=FOCUS.breakUntil){FOCUS.breakUntil=0;FOCUS.sinceBreak=0;beep(2);notifyMe('انتهى البريك ✅','يلا نكمّل تركيز 💪');}paintFocus();return;}
  S.focus.log[k]=(S.focus.log[k]||0)+1;FOCUS.sinceBreak++;
  if(S.focus.log[k]%15===0)save();
  const everySec=(S.focus.breakEveryMin||50)*60;
  if(FOCUS.sinceBreak>=everySec){FOCUS.breakUntil=Date.now()+(S.focus.breakLenMin||10)*60000;beep(3);notifyMe('🧘 وقت البريك',`خذ راحة ${S.focus.breakLenMin||10} دقائق ثم نكمّل.`);}

function paintFocus(){const el=document.getElementById('focusWidget');if(!el)return;el.innerHTML=focusInner();refreshIcons();}
function focusInner(){

  const hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60),ss=sec%60;const fmt=hh+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
  const goalH=Math.round(((S.focus.goalMin||180)/60)*10)/10;

  const everySec=(S.focus.breakEveryMin||50)*60;const toBreak=Math.max(0,everySec-FOCUS.sinceBreak);

  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">

    <div style="flex:1;min-width:200px">
      <div style="font-size:13px;color:var(--muted)">${inBreak?'<i class="inl" data-lucide="coffee"></i> وقت البريك':(done?'<i class="inl" data-lucide="party-popper"></i> أكملت هدف اليوم':'<i class="inl" data-lucide="timer"></i> تركيز اليوم')}</div>
      <div style="font-size:33px;font-weight:900;letter-spacing:1px">${inBreak?fmtMS(breakLeft):fmt}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">${inBreak?'استرح ثم نكمّل':(FOCUS.running?`البريك القادم بعد ${fmtMS(toBreak)}`:'اضغط «ابدأ» لتشغيل العدّاد الواعي')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">

/* ----- مواقيت الصلاة (Aladhan API) ----- */

/* ===== HELPERS ===== */
function lineTotal(it){return Number(it.qty||0)*Number(it.price||0)*(1-(Number(it.discount||0)/100))}
function docTotal(d){return (d.items||[]).reduce((a,it)=>a+lineTotal(it),0)}
function invVat(inv){return inv.vat?docTotal(inv)*(Number(inv.vatRate||0)/100):0}
function invTotal(inv){return docTotal(inv)+invVat(inv)}
function invPaid(inv){return (inv.payments||[]).reduce((a,p)=>a+Number(p.amount||0),0)}
function invDue(inv){return Math.max(0,invTotal(inv)-invPaid(inv))}
function syncInvStatus(inv){const paid=invPaid(inv),tot=invTotal(inv);if(paid<=0)inv.status='unpaid';else if(paid+0.009>=tot)inv.status='paid';else inv.status='partial';if(inv.status==='paid'&&!inv.paidDate)inv.paidDate=today();return inv.status}
const ST={draft:'عرض سعر',sent:'مُرسل للعميل',sale:'أمر بيع',accepted:'مقبول',rejected:'مرفوض',cancel:'ملغى',paid:'مدفوعة',partial:'مدفوعة جزئياً',unpaid:'غير مدفوعة',scheduled:'مجدول',done:'تم',cancelled:'ملغى'};
function pill(s){return `<span class="pill ${s}">${ST[s]||s}</span>`}

const DEFAULT_TASK_STAGES=[{key:'todo',label:'قيد الانتظار'},{key:'doing',label:'قيد التنفيذ'},{key:'review',label:'مراجعة'},{key:'done',label:'منجز'}];

function findOrCreateContact(name,type){name=(name||'').trim();if(!name)return '';let c=(S.contacts||[]).find(x=>(x.name||'').trim().toLowerCase()===name.toLowerCase());if(c)return c.id;c={id:uid(),name,type:type||'عميل',phone:'',email:'',company:'',vat:'',address:'',city:'',website:'',logo:'',notes:''};S.contacts.push(c);return c.id}
// اسم العميل للعرض: من الـ id المربوط، وإلا النص القديم (توافق)
function resolveClientName(rec){return contactName(rec.contactId)||rec.client||rec.clientName||rec.contact||'—'}

function contactsDatalist(){return `<datalist id="__contactsDL">${(S.contacts||[]).map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>`}

function clientItems(contactId){if(!contactId)return {appts:[],invoices:[],projects:[]};return {appts:S.appointments.filter(a=>a.contactId===contactId),invoices:S.invoices.filter(i=>i.contactId===contactId),projects:S.projects.filter(p=>p.contactId===contactId)}}
// ترحيل آمن: يحوّل الأسماء النصية القديمة لجهات اتصال مربوطة (idempotent)
function migrateData(){
  // ترحيل لمرّة واحدة: تحديث الاسم القديم إلى اسم المؤسسة المسجّل (قابل للتغيير من الإعدادات لاحقاً)
  if(S.settings && !S.settings.brandMigrated){
    if((S.settings.brand||'')==='إبراهيم سعود')S.settings.brand='مؤسسة حروف ودروس';
    if(S.settings.vat && (S.settings.vat.sellerName||'')==='إبراهيم سعود')S.settings.vat.sellerName='مؤسسة حروف ودروس';
    S.settings.brandMigrated=true;
  }
  (S.projects||[]).forEach(p=>{
    if(!p.taskStages||!p.taskStages.length)p.taskStages=JSON.parse(JSON.stringify(DEFAULT_TASK_STAGES));
    if(!p.contactId&&p.client)p.contactId=findOrCreateContact(p.client);
    (p.tasks||[]).forEach(t=>{if(!t.stageKey)t.stageKey=t.done?'done':p.taskStages[0].key;if(!Array.isArray(t.blocks))t.blocks=[]});
  });
  (S.appointments||[]).forEach(a=>{if(!a.contactId&&a.contact)a.contactId=findOrCreateContact(a.contact)});
  (S.invoices||[]).forEach(d=>{if(!d.contactId&&d.client)d.contactId=findOrCreateContact(d.client)});
  (S.sales||[]).forEach(d=>{if(!d.contactId&&d.client)d.contactId=findOrCreateContact(d.client)});
  (S.crm||[]).forEach(o=>{if(!o.contactId&&(o.clientName||o.client))o.contactId=findOrCreateContact(o.clientName||o.client)});
}

/* ===== GENERIC KANBAN ===== */
function renderKanban(cfg){

/* ===== غرفة المشروع (لوحة المالك) ===== */
const RBASE=location.origin+location.pathname.replace(/index\.html$/,'')+'r.html';
function roomLink(kind,token){return RBASE+'?'+(kind==='client'?'c':'ft')+'='+token}
function copyTxt(t){navigator.clipboard.writeText(t).then(()=>alert('تم النسخ:\n'+t)).catch(()=>prompt('انسخ:',t))}
async function loadRoomPanel(p){
  const el=document.getElementById('roomPanel');if(!el)return;
  const {data:rooms}=await sb.from('project_rooms').select('*').eq('project_id',p.id).limit(1);
  const room=rooms&&rooms[0];
  const {data:tasks}=await sb.from('tasks').select('*').eq('project_id',p.id);
  const ids=(tasks||[]).map(t=>t.id);let revs=[];
  if(ids.length){const {data:rv}=await sb.from('revisions').select('task_id,num,billable,status').in('task_id',ids);revs=rv||[]}
  if(document.getElementById('roomPanel')){document.getElementById('roomPanel').innerHTML=roomPanelHTML(p,room,tasks||[],revs);refreshIcons();}
}
function roomPanelHTML(p,room,tasks,revs){
  if(!room) return `<h3 style="margin-top:0"><i data-lucide="door-open"></i> غرفة المشروع</h3>
    <p style="color:var(--muted);font-size:13px">فعّل غرفة العميل: تشارك التسليمات وتستقبل الاعتمادات والتعديلات بعدّاد تكلفة، وتعطي الفريلانسر رابطاً يسلّم فيه نسخه وينفّذ التعديلات.</p>
    <button class="btn btn-gold" onclick="roomEnable('${p.id}')">تفعيل غرفة العميل</button>`;
  const cl=roomLink('client',room.client_token);
  const wa=room.client_phone?('https://wa.me/'+room.client_phone.replace(/[^0-9]/g,'')+'?text='+encodeURIComponent('غرفة مشروع «'+p.title+'» — تابع التسليمات واعتمدها من هنا:\n'+cl)):'';
  return `<h3 style="margin-top:0"><i data-lucide="door-open"></i> غرفة المشروع <button class="link-btn" onclick="roomSettings('${p.id}')"><i class="inl" data-lucide="settings"></i> إعدادات</button></h3>
    <div class="pd-meta" style="margin-top:0"><span><i class="inl" data-lucide="user"></i> ${esc(room.client_name||'—')}</span><span><i class="inl" data-lucide="package"></i> تعديلات مجانية: <b>${room.revisions_included}</b></span></div>
    <div class="linkrow" style="margin-top:10px">
      <button class="link-btn" onclick="copyTxt('${cl}')"><i class="inl" data-lucide="copy"></i> نسخ رابط العميل</button>
      <a class="link-btn" href="${cl}" target="_blank">فتح</a>
      ${wa?`<a class="link-btn" href="${wa}" target="_blank"><i class="inl" data-lucide="message-circle"></i> واتساب العميل</a>`:''}
      <button class="link-btn" onclick="addPodcastDeliverables('${p.id}')"><i class="inl" data-lucide="mic"></i> أضف مخرجات حلقة بودكاست</button>
    </div>
    <div style="margin-top:12px">
    ${tasks.length?tasks.map(t=>{
      const rs=revs.filter(r=>r.task_id===t.id);const used=rs.length;const pend=rs.filter(r=>r.status==='pending').length;
      const fl=(S.freelancers||[]).find(f=>f.id===t.freelancer_id);const flink=fl?roomLink('ft',fl.token):'';
      const cnt=used<=room.revisions_included?`<span class="kbadge">تعديلات ${used}/${room.revisions_included}</span>`:`<span class="kbadge" style="color:#fca5a5"><i class="inl" data-lucide="alert-triangle"></i> ${used} (${used-room.revisions_included} مدفوع)</span>`;
      return `<div style="border-top:1px solid var(--line);padding:9px 0">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
          <b><i class="inl" data-lucide="film"></i> ${esc(t.title)}</b>
          <span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${t.approved?'<span class="kbadge" style="color:#86efac"><i class="inl" data-lucide="check"></i> معتمد</span>':''}${pend?`<span class="kbadge" style="color:#fcd34d">${pend} تعديل معلّق</span>`:''}${cnt}</span>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">
          ${t.version_url?`<a href="${esc(t.version_url)}" target="_blank"><i class="inl" data-lucide="play"></i> المخرَج الحالي</a>`:'لا مخرَج بعد'}
          <button class="link-btn" onclick="setDeliverable('${p.id}','${t.id}')"><i class="inl" data-lucide="link"></i> ${t.version_url?'تعديل':'إضافة'} رابط المخرَج</button>
          ${fl?` · <i class="inl" data-lucide="user"></i> ${esc(fl.name)} <button class="link-btn" onclick="copyTxt('${flink}')"><i class="inl" data-lucide="copy"></i> رابط الفريلانسر</button>`:' · <i class="inl" data-lucide="alert-triangle"></i> بلا مسؤول (أسنده من المهمة)'}
        </div>
      </div>`;
    }).join(''):'<p style="color:var(--muted);font-size:13px">أضف مهاماً وأسندها لفريلانسرز، ثم تظهر هنا كتسليمات.</p>'}
    </div>`;
}
// مخرجات حلقة البودكاست القياسية — تُضاف كمهام/تسليمات للمشروع بضغطة
const PODCAST_DELIVERABLES=['🎬 الحلقة الكاملة (مونتاج)','✂️ ١٠ مقاطع قصيرة','🎨 تصاميم إنستقرام','🖼️ ثمبنيل يوتيوب','📣 إعلان الضيف + صورته'];
async function addPodcastDeliverables(pid){const p=S.projects.find(x=>x.id===pid);if(!p)return;
  if(!confirm('إضافة ٥ مخرجات حلقة بودكاست كتسليمات للمشروع؟ (الحلقة · الشورتس · تصاميم إنستقرام · الثمبنيل · إعلان الضيف)'))return;
  p.tasks=p.tasks||[];const st=(p.taskStages&&p.taskStages[0]?p.taskStages[0].key:'todo');
  PODCAST_DELIVERABLES.forEach(t=>p.tasks.push({id:uid(),title:t,stageKey:st,done:false,assignee:'',blocks:[]}));
  save();renderProjectDetail(p.id);await syncTasks();loadRoomPanel(p);
}
// المالك يضيف/يعدّل رابط المخرَج (Drive/يوتيوب) وعنوانه مباشرة — يظهر فوراً في رابط العميل
function setDeliverable(pid,taskId){
  const p=S.projects.find(x=>x.id===pid);const lt=p&&(p.tasks||[]).find(t=>t.id===taskId);
  sb.from('tasks').select('*').eq('id',taskId).limit(1).then(({data})=>{const dt=(data&&data[0])||{};
    openModal('مخرَج المشروع — رابط التسليم',`
      <div class="field"><label>عنوان المخرَج</label><input id="dl_title" value="${esc((lt&&lt.title)||dt.title||'')}"></div>
      <div class="field"><label>رابط المخرَج (Google Drive / يوتيوب / WeTransfer)</label><input id="dl_url" value="${esc(dt.version_url||'')}" placeholder="https://drive.google.com/..."></div>
      <div class="field"><label>ملاحظة مع التسليم (اختياري)</label><input id="dl_note" value="${esc(dt.version_note||'')}"></div>
      <div class="badge-note" style="margin-top:4px"><i data-lucide="link"></i> <div>هذا الرابط يظهر للعميل مباشرة في رابط الغرفة ليعتمده أو يطلب تعديلاً.</div></div>`,
    async()=>{const g=i=>document.getElementById(i).value;const title=g('dl_title').trim();const url=g('dl_url').trim();const note=g('dl_note').trim();
      if(lt&&title&&title!==lt.title){lt.title=title;save();await syncTasks();}
      const {error}=await sb.from('tasks').update({version_url:url,version_note:note,title:title||dt.title}).eq('id',taskId);
      if(error){alert('تعذّر الحفظ: '+error.message);return}
      closeModal();const pp=S.projects.find(x=>x.id===pid);if(pp)loadRoomPanel(pp);});
  });
}
async function roomEnable(pid){const p=S.projects.find(x=>x.id===pid);if(!p)return;
  await syncTasks();
  const {error}=await sb.from('project_rooms').insert({project_id:p.id,project_title:p.title,client_name:resolveClientName(p),revisions_included:2,owner:USER.id});
  if(error){alert('تعذّر التفعيل: '+error.message);return}
  loadRoomPanel(p);
}
function roomSettings(pid){const p=S.projects.find(x=>x.id===pid);if(!p)return;
  sb.from('project_rooms').select('*').eq('project_id',p.id).limit(1).then(({data})=>{const r=data&&data[0];if(!r)return;
    openModal('إعدادات غرفة العميل',`
      <div class="field"><label>اسم العميل</label><input id="rs_name" value="${esc(r.client_name||'')}"></div>
      <div class="row2"><div class="field"><label>جوال العميل (واتساب)</label><input id="rs_phone" value="${esc(r.client_phone||'')}" placeholder="9665xxxxxxxx"></div>
      <div class="field"><label>بريد العميل</label><input id="rs_email" type="email" value="${esc(r.client_email||'')}"></div></div>
      <div class="field"><label>عدد التعديلات المجانية ضمن الباقة</label><input id="rs_inc" type="number" value="${r.revisions_included}"></div>`,
      async()=>{const g=i=>document.getElementById(i).value;
        const {error}=await sb.from('project_rooms').update({client_name:g('rs_name').trim(),client_phone:g('rs_phone').trim(),client_email:g('rs_email').trim(),revisions_included:Number(g('rs_inc'))||0}).eq('id',r.id);
        if(error){alert('تعذّر الحفظ: '+error.message);return}closeModal();loadRoomPanel(p)});
  });
}

/* task drag & drop within project */
let TDRAG=null;
function tdstart(e,id){TDRAG=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.stopPropagation()}
function tdend(e){e.currentTarget.classList.remove('dragging')}
function tdover(e){e.preventDefault();e.currentTarget.classList.add('dragover')}
function tdleave(e){e.currentTarget.classList.remove('dragover')}
function tddrop(e,stageKey){e.preventDefault();e.currentTarget.classList.remove('dragover');const p=proj();if(p&&TDRAG){const t=(p.tasks||[]).find(x=>x.id===TDRAG);if(t&&t.stageKey!==stageKey){t.stageKey=stageKey;t.done=(stageKey==='done');save();syncTasks();renderProjectDetail(p.id)}}TDRAG=null}
function quickAddTask(stageKey){const p=proj();if(!p)return;openModal('مهمة جديدة',`
  <div class="field"><label>عنوان المهمة</label><input id="nt_title" placeholder="مثال: كتابة سكربت الحلقة" onkeydown="if(event.key==='Enter')document.getElementById('mSave').click()"></div>
  <div class="field"><label>المسؤول (اختياري)</label><select id="nt_as"><option value="">— لا أحد —</option>${(S.freelancers||[]).map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div>`,
  ()=>{const v=document.getElementById('nt_title').value.trim();if(!v){alert('أدخل عنوان المهمة');return}const as=document.getElementById('nt_as').value;p.tasks=p.tasks||[];p.tasks.push({id:uid(),title:v,stageKey,done:stageKey==='done',assignee:as,blocks:[]});save();syncTasks();closeModal();renderProjectDetail(p.id)});
  setTimeout(()=>{const n=document.getElementById('nt_title');if(n)n.focus()},50);
}
function taskStageEditor(id){const p=S.projects.find(x=>x.id===id);if(!p)return;
  let stages=JSON.parse(JSON.stringify(p.taskStages||DEFAULT_TASK_STAGES));
  function body(){return `<p style="color:var(--muted);font-size:13px;margin-top:0">مراحل المهام لهذا المشروع. المهام في مرحلة محذوفة تنتقل لأول مرحلة.</p>`+
    stages.map((s,i)=>`<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
      <input value="${esc(s.label)}" oninput="tsEdit(${i},this.value)" style="flex:1">
      <button class="link-btn" onclick="tsMove(${i},-1)">▲</button><button class="link-btn" onclick="tsMove(${i},1)">▼</button>
      <button class="link-btn del" onclick="tsDel(${i})">حذف</button></div>`).join('')+
    `<button class="btn btn-ghost btn-sm" onclick="tsAdd()">+ مرحلة جديدة</button>`}
  openModal('مراحل المهام',body(),()=>{if(!stages.length){alert('أضف مرحلة واحدة على الأقل');return}const keys=stages.map(s=>s.key);(p.tasks||[]).forEach(t=>{if(!keys.includes(t.stageKey))t.stageKey=keys[0]});p.taskStages=stages;save();closeModal();renderProjectDetail(id)});
  window.tsEdit=(i,v)=>{stages[i].label=v};
  window.tsAdd=()=>{stages.push({key:uid(),label:'مرحلة جديدة'});refresh()};
  window.tsDel=(i)=>{stages.splice(i,1);refresh()};
  window.tsMove=(i,d)=>{const j=i+d;if(j<0||j>=stages.length)return;[stages[i],stages[j]]=[stages[j],stages[i]];refresh()};
  function refresh(){document.querySelector('#modalRoot .modal-body').innerHTML=body()}
}

/* ===== NOTION-LITE TASK EDITOR ===== */
let CUR_TASK=null;
function curTask(){const p=proj();return p?(p.tasks||[]).find(x=>x.id===CUR_TASK):null}
function findBlock(id){const t=curTask();return t?(t.blocks||[]).find(b=>b.id===id):null}
function openTask(taskId){const p=proj();if(!p)return;const t=(p.tasks||[]).find(x=>x.id===taskId);if(!t)return;CUR_TASK=taskId;if(!Array.isArray(t.blocks))t.blocks=[];
  const asOpts=`<option value="">— لا مسؤول —</option>`+(S.freelancers||[]).map(f=>`<option value="${f.id}" ${t.assignee===f.id?'selected':''}>${esc(f.name)}</option>`).join('');
  const stOpts=(p.taskStages||DEFAULT_TASK_STAGES).map(s=>`<option value="${s.key}" ${t.stageKey===s.key?'selected':''}>${esc(s.label)}</option>`).join('');
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeTask()"><div class="modal task-modal">
    <div class="modal-head"><input id="t_title" value="${esc(t.title)}" style="font-size:18px;font-weight:800;border:none;background:transparent;padding:4px;width:auto;flex:1" oninput="taskTitle(this.value)"><button class="x" onclick="closeTask()">×</button></div>
    <div class="modal-body">
      <div class="row2" style="margin-bottom:14px">
        <div class="field"><label>المرحلة</label><select id="t_stage" onchange="taskStage(this.value)">${stOpts}</select></div>
        <div class="field"><label>المسؤول</label><select id="t_as" onchange="taskAssignee(this.value)">${asOpts}</select></div>
      </div>
      <div class="ed-toolbar">
        <button class="btn btn-ghost btn-sm" onclick="addBlock('text')"><i data-lucide="pilcrow"></i> نص</button>
        <button class="btn btn-ghost btn-sm" onclick="addBlock('heading')"><i data-lucide="heading"></i> عنوان</button>
        <button class="btn btn-ghost btn-sm" onclick="addBlock('script')"><i data-lucide="film"></i> سكربت</button>
        <button class="btn btn-ghost btn-sm" onclick="addBlock('todo')"><i data-lucide="square-check"></i> مهمة فرعية</button>
        <button class="btn btn-ghost btn-sm" onclick="pickImage()"><i data-lucide="image"></i> صورة</button>
        <button class="btn btn-ghost btn-sm" onclick="addBlock('divider')"><i data-lucide="minus"></i> فاصل</button>
        <span style="align-self:center;color:var(--muted);font-size:12px">أو اكتب «/» داخل أي سطر · للعريض Ctrl/⌘+B</span>
        <span id="upStatus" class="upbar"></span>
      </div>
      <div id="blocks">${t.blocks.map(b=>blockHTML(b)).join('')}</div>
      <button class="addtask" style="margin-top:10px" onclick="addBlock('text')">+ أضف سطراً</button>
      <input type="file" id="imgFile" accept="image/*" class="hidden" onchange="onImagePicked(event)">
      <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:12px"><button class="link-btn del" onclick="deleteTask()"><i class="inl" data-lucide="trash-2"></i> حذف المهمة</button></div>
    </div></div></div>`;
  refreshIcons();
}
function blockHTML(b){
  if(b.type==='heading')return blkWrap(b,`<div class="ce h" contenteditable data-bid="${b.id}" data-ph="عنوان" onkeydown="blockKey(event,'${b.id}')" oninput="onCe('${b.id}')">${b.html||''}</div>`);
  if(b.type==='script')return blkWrap(b,`<div class="lbl"><i class="inl" data-lucide="film"></i> سكربت الفيديو</div><div class="ce" contenteditable data-bid="${b.id}" data-ph="اكتب نص الفيديو…" onkeydown="blockKey(event,'${b.id}')" oninput="onCe('${b.id}')">${b.html||''}</div>`,'script');
  if(b.type==='todo')return blkWrap(b,`<input type="checkbox" ${b.done?'checked':''} onchange="todoToggle('${b.id}',this.checked)"><div class="ce txt ${b.done?'dn':''}" contenteditable data-bid="${b.id}" data-ph="مهمة فرعية…" onkeydown="blockKey(event,'${b.id}')" oninput="onCe('${b.id}')">${b.html||''}</div>`,'todo');
  if(b.type==='image')return blkWrap(b,`<img src="${esc(b.url)}" alt="">`,'img');
  if(b.type==='divider')return blkWrap(b,`<hr>`,'divider');
  return blkWrap(b,`<div class="ce txt" contenteditable data-bid="${b.id}" data-ph="اكتب… (أو «/» لأمر)" onkeydown="blockKey(event,'${b.id}')" oninput="onCe('${b.id}')">${b.html||''}</div>`);
}
function blkWrap(b,inner,cls){return `<div class="nb ${cls||''}" data-id="${b.id}"><button class="handle" onclick="blockMenu(event,'${b.id}')" title="خيارات">⋮</button><div class="bc">${inner}</div></div>`}
function onCe(id){const el=document.querySelector(`[data-bid="${id}"]`);const b=findBlock(id);if(el&&b){b.html=el.innerHTML;scheduleTaskSave()}}
function scheduleTaskSave(){clearTimeout(window.__tsv);window.__tsv=setTimeout(()=>{save();syncTasks()},700)}
function taskTitle(v){const t=curTask();if(t){t.title=v;scheduleTaskSave()}}
function taskStage(v){const t=curTask();if(t){t.stageKey=v;t.done=(v==='done');scheduleTaskSave()}}
function taskAssignee(v){const t=curTask();if(t){t.assignee=v;scheduleTaskSave()}}
function todoToggle(id,c){const b=findBlock(id);if(b){b.done=c;const el=document.querySelector(`[data-bid="${id}"]`);if(el)el.classList.toggle('dn',c);scheduleTaskSave()}}
function addBlock(type,afterId){const t=curTask();if(!t)return;const b={id:uid(),type};if(type==='todo')b.done=false;if(type!=='divider'&&type!=='image')b.html='';let idx=t.blocks.length;if(afterId){const i=t.blocks.findIndex(x=>x.id===afterId);if(i>=0)idx=i+1}t.blocks.splice(idx,0,b);scheduleTaskSave();rerenderBlocks((type==='divider'||type==='image')?null:b.id)}
function removeBlock(id){const t=curTask();if(!t)return;const i=t.blocks.findIndex(b=>b.id===id);if(i<0)return;t.blocks.splice(i,1);scheduleTaskSave();const prev=t.blocks[i-1];rerenderBlocks(prev&&prev.type!=='divider'&&prev.type!=='image'?prev.id:null)}
function rerenderBlocks(focusId){const t=curTask();const c=document.getElementById('blocks');if(!t||!c)return;c.innerHTML=t.blocks.map(b=>blockHTML(b)).join('');refreshIcons();if(focusId){const el=document.querySelector(`[data-bid="${focusId}"]`);if(el)placeCaretEnd(el)}}
function blockKey(e,id){
  if(e.key==='Enter'&&!e.shiftKey){const b=findBlock(id);if(b&&b.type!=='script'){e.preventDefault();closeSlash();addBlock('text',id)}}
  else if(e.key==='Backspace'){if(e.target&&e.target.textContent===''){e.preventDefault();removeBlock(id)}}
  else if(e.key==='Escape'){closeSlash()}
  else if(e.key==='/'){setTimeout(()=>{const el=document.querySelector(`[data-bid="${id}"]`);if(el&&el.textContent==='/')openSlash(id,el,false)},0)}
}
function placeCaretEnd(el){try{el.focus();const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
const SLASH=[{t:'text',i:'pilcrow',n:'نص',d:'فقرة عادية'},{t:'heading',i:'heading',n:'عنوان',d:'عنوان عريض'},{t:'script',i:'film',n:'سكربت',d:'نص الفيديو'},{t:'todo',i:'square-check',n:'مهمة فرعية',d:'بوكس تحقق'},{t:'image',i:'image',n:'صورة',d:'رفع صورة'},{t:'divider',i:'minus',n:'فاصل',d:'خط فاصل'}];
function openSlash(id,el,withDel){closeSlash();const r=el.getBoundingClientRect();const m=document.createElement('div');m.className='slash';m.id='slashMenu';m.style.top=(r.bottom+window.scrollY+4)+'px';m.style.right=Math.max(8,window.innerWidth-r.right)+'px';
  m.innerHTML=SLASH.map(s=>`<button onclick="applySlash('${id}','${s.t}')"><span class="si"><i data-lucide="${s.i}"></i></span><span>${s.n}<div class="sd">${esc(s.d)}</div></span></button>`).join('')+(withDel?`<button onclick="removeBlock('${id}');closeSlash()"><span class="si"><i data-lucide="trash-2"></i></span><span style="color:var(--bad)">حذف البلوك</span></button>`:'');
  document.body.appendChild(m);refreshIcons();setTimeout(()=>document.addEventListener('click',slashOutside),0)}
function slashOutside(e){if(!e.target.closest('#slashMenu')){closeSlash()}}
function closeSlash(){const m=document.getElementById('slashMenu');if(m)m.remove();document.removeEventListener('click',slashOutside)}
function blockMenu(e,id){e.stopPropagation();const el=e.currentTarget;openSlash(id,el,true)}
function applySlash(id,type){closeSlash();const t=curTask();const b=findBlock(id);if(!b||!t)return;
  if(type==='image'){b.type='text';b.html='';pickImageFor(id);return}
  if(type==='divider'){b.type='divider';delete b.html;scheduleTaskSave();rerenderBlocks(null);return}
  if(type==='todo'){b.type='todo';b.html='';b.done=false}else{b.type=type;b.html=''}
  scheduleTaskSave();rerenderBlocks(id);
}
function pickImage(){window.__imgTarget=null;document.getElementById('imgFile').click()}
function pickImageFor(id){window.__imgTarget=id;document.getElementById('imgFile').click()}
async function onImagePicked(e){const f=e.target.files[0];e.target.value='';if(!f)return;const t=curTask();if(!t)return;const st=document.getElementById('upStatus');if(st)st.textContent='جارٍ رفع الصورة…';
  try{const ext=(f.name.split('.').pop()||'png').toLowerCase();const path=`${USER.id}/${uid()}.${ext}`;
    const {error}=await sb.storage.from('task-images').upload(path,f,{upsert:false,contentType:f.type||'image/png'});if(error)throw error;
    const {data}=sb.storage.from('task-images').getPublicUrl(path);const url=data.publicUrl;
    const tgt=window.__imgTarget;if(tgt){const b=findBlock(tgt);if(b){b.type='image';b.url=url;delete b.html}}else{t.blocks.push({id:uid(),type:'image',url})}
    window.__imgTarget=null;if(st)st.textContent='✓ تم';setTimeout(()=>{if(st)st.textContent=''},1500);save();rerenderBlocks(null);
  }catch(err){if(st)st.textContent='';alert('تعذّر رفع الصورة: '+(err.message||err)+'\n\nتأكد من إنشاء bucket عام باسم «task-images» في Supabase → Storage.')}
}
function deleteTask(){const p=proj();const t=curTask();if(!p||!t)return;if(!confirm('حذف هذه المهمة؟'))return;p.tasks=p.tasks.filter(x=>x.id!==t.id);save();syncTasks();document.getElementById('modalRoot').innerHTML='';CUR_TASK=null;renderProjectDetail(p.id)}
function closeTask(){closeSlash();const t=curTask();if(t){document.querySelectorAll('#blocks [data-bid]').forEach(el=>{const b=(t.blocks||[]).find(x=>x.id===el.dataset.bid);if(b)b.html=el.innerHTML});const tt=document.getElementById('t_title');if(tt)t.title=tt.value}save();syncTasks();document.getElementById('modalRoot').innerHTML='';CUR_TASK=null;if(CUR_PROJ)renderProjectDetail(CUR_PROJ)}

/* ===== CONTACTS ===== */
function clientAvatar(c,size){size=size||44;const fs=Math.round(size*0.42);
  if(c.logo)return `<img src="${esc(c.logo)}" style="width:${size}px;height:${size}px;border-radius:12px;object-fit:contain;background:#000;border:1px solid var(--line)" onerror="this.style.display='none'">`;
  const initial=esc((c.name||'؟').trim().charAt(0));
  return `<div style="width:${size}px;height:${size}px;border-radius:12px;background:var(--goldsoft);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${fs}px;border:1px solid var(--line)">${initial}</div>`;}
function clientCredits(contactId){return (S.credits||[]).filter(c=>c.contactId===contactId)}
function clientBalance(contactId){const it=clientItems(contactId);const invoiced=it.invoices.reduce((a,i)=>a+invTotal(i),0);const paid=it.invoices.reduce((a,i)=>a+invPaid(i),0);const credited=clientCredits(contactId).reduce((a,c)=>a+invTotal(c),0);const due=Math.max(0,invoiced-paid-credited);return {invoiced,paid,credited,due,count:it.invoices.length,it};}
function renderContacts(){
  const cs=S.contacts.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>العملاء وجهات الاتصال</h1><button class="btn btn-gold" onclick="contactModal(null,renderContacts)">+ عميل جديد</button></div>
    ${!cs.length?emptyBox('user','لا يوجد عملاء بعد. أضف أول عميل ببياناته وشعاره.'):
    `<div class="grid">
    ${cs.map(c=>{const b=clientBalance(c.id);return `<div class="card" style="cursor:pointer;display:flex;flex-direction:column;gap:12px" onclick="openClient('${c.id}')">
      <div style="display:flex;align-items:center;gap:12px">${clientAvatar(c,48)}
        <div style="min-width:0;flex:1"><div style="font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div>
        <div style="color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.company||c.type||'عميل')}</div></div>
        <span class="pill ${c.type==='عميل محتمل'?'lead':(c.type==='مورد'?'contacted':'won')}">${esc(c.type||'عميل')}</span></div>
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-size:13px">
        <span style="color:var(--muted)">${b.count} فاتورة</span>
        ${b.due>0?`<span style="color:var(--warn);font-weight:700">مستحق ${money(b.due)}</span>`:`<span style="color:var(--good);font-weight:700">مسدّد بالكامل</span>`}</div>
    </div>`}).join('')}
    </div>`}`;
  refreshIcons();
}
function openClient(id){
  const c=S.contacts.find(x=>x.id===id);if(!c){renderContacts();return}
  const b=clientBalance(id);const it=b.it;const apptUp=it.appts.slice().sort((a,b)=>(a.datetime||'').localeCompare(b.datetime||''));
  const info=(lbl,val,href)=>val?`<div style="padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px"><span style="color:var(--muted)">${lbl}</span>${href?`<a href="${href}" target="_blank" style="color:var(--gold2);font-weight:600">${esc(val)}</a>`:`<span style="font-weight:600">${esc(val)}</span>`}</div>`:'';
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1><button class="link-btn" onclick="renderContacts()">← العملاء</button></h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="contactModal('${id}',()=>openClient('${id}'))"><i data-lucide="pencil"></i> تعديل البيانات</button>
        <button class="btn btn-ghost btn-sm" onclick="docModal('sale',null,'${esc(c.name).replace(/'/g,"\\'")}',()=>openClient('${id}'))">+ عرض سعر</button>
        <button class="btn btn-gold" onclick="docModal('invoice',null,'${esc(c.name).replace(/'/g,"\\'")}',()=>openClient('${id}'))">+ فاتورة</button></div></div>
    <div class="card" style="display:flex;align-items:center;gap:16px;margin-bottom:18px">
      ${clientAvatar(c,72)}
      <div style="flex:1;min-width:0"><div style="font-size:22px;font-weight:900">${esc(c.name)}</div>
      <div style="color:var(--muted)">${esc(c.company||'')} ${c.company&&c.type?'·':''} ${esc(c.type||'عميل')}</div></div></div>
    <div class="stats">
      <div class="stat"><span class="ic"><i data-lucide="receipt-text"></i></span><div class="v">${b.count}</div><div class="l">عدد الفواتير</div></div>
      <div class="stat"><span class="ic"><i data-lucide="layers"></i></span><div class="v">${money(b.invoiced)}</div><div class="l">إجمالي مفوتر</div></div>
      <div class="stat"><span class="ic"><i data-lucide="wallet"></i></span><div class="v">${money(b.paid)}</div><div class="l">المحصّل</div></div>
      <div class="stat"><span class="ic"><i data-lucide="hourglass"></i></span><div class="v" style="color:${b.due>0?'var(--warn)':'var(--good)'}">${money(b.due)}</div><div class="l">المستحق (Receivable)</div></div>
    </div>
    <div class="grid">
      <div class="card"><h3><i data-lucide="id-card"></i> بيانات العميل</h3>
        ${info('الجوال',c.phone,c.phone?'tel:'+esc(c.phone):'')}
        ${info('البريد',c.email,c.email?'mailto:'+esc(c.email):'')}
        ${info('الرقم الضريبي',c.vat)}
        ${info('الشركة/الجهة',c.company)}
        ${info('المدينة',c.city)}
        ${info('العنوان',c.address)}
        ${info('الموقع',c.website,c.website?(c.website.startsWith('http')?esc(c.website):'https://'+esc(c.website)):'')}
        ${c.notes?`<div style="padding-top:10px;color:var(--muted);font-size:13px"><i class="inl" data-lucide="sticky-note"></i> ${esc(c.notes)}</div>`:''}
        ${(!c.phone&&!c.email&&!c.vat&&!c.company&&!c.address)?'<p style="color:var(--muted)">لا توجد بيانات بعد — اضغط «تعديل البيانات».</p>':''}
      </div>
      <div class="card"><h3><i data-lucide="receipt-text"></i> الفواتير</h3>
        ${it.invoices.length?it.invoices.slice().reverse().map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">
          <span><button class="link-btn" onclick="printDoc('invoice','${d.id}')">طباعة</button> <button class="link-btn" onclick="docModal('invoice','${d.id}',null,()=>openClient('${id}'))">#${d.number}</button></span>
          <span>${money(invTotal(d))} ${pill(d.status)}</span></div>`).join(''):'<p style="color:var(--muted)">لا فواتير لهذا العميل بعد.</p>'}
      </div>
      <div class="card"><h3><i data-lucide="file-text"></i> عروض الأسعار</h3>
        ${it.invoices&&S.sales.filter(x=>x.contactId===id).length?S.sales.filter(x=>x.contactId===id).slice().reverse().map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">
          <span><button class="link-btn" onclick="toInvoice('${d.id}')">→ فاتورة</button> <button class="link-btn" onclick="docModal('sale','${d.id}',null,()=>openClient('${id}'))">#${d.number}</button></span>
          <span>${money(docTotal(d))} ${pill(d.status)}</span></div>`).join(''):'<p style="color:var(--muted)">لا عروض أسعار.</p>'}
      </div>
      <div class="card"><h3><i data-lucide="clapperboard"></i> المشاريع والمواعيد</h3>
        ${it.projects.length?it.projects.map(p=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><i class="inl" data-lucide="clapperboard"></i> ${esc(p.title)}</div>`).join(''):''}
        ${apptUp.length?apptUp.map(a=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><i class="inl" data-lucide="calendar-days"></i> ${esc(a.title)} — ${esc((a.datetime||'').replace('T',' '))}</div>`).join(''):''}
        ${(!it.projects.length&&!apptUp.length)?'<p style="color:var(--muted)">لا مشاريع أو مواعيد مرتبطة.</p>':''}
      </div>
    </div>`;

function toInvoice(saleId){const s=S.sales.find(x=>x.id===saleId);const ct=S.contacts.find(c=>c.id===s.contactId);const inv={id:uid(),number:++S.counters.invoice,client:s.client,contactId:s.contactId||'',clientVat:(ct&&ct.vat)||'',date:today(),items:JSON.parse(JSON.stringify(s.items)),notes:s.notes,status:'unpaid',vat:S.settings.vat.enabled,vatRate:S.settings.vat.rate,paidDate:''};S.invoices.push(inv);save();go('invoicing');alert('تم إنشاء فاتورة من عرض السعر ✓')}
function docModal(type,id,presetName,cb){
  const isInv=type==='invoice';const k=isInv?'invoices':'sales';
  let d=id?JSON.parse(JSON.stringify(S[k].find(x=>x.id===id))):
    {id:'',number:S.counters[type]+1,client:'',clientVat:'',date:today(),expiry:'',salesperson:S.settings.salesperson||'',items:[{desc:'',qty:1,price:0,discount:0}],notes:'',status:isInv?'unpaid':'draft',vat:S.settings.vat.enabled,vatRate:S.settings.vat.rate,paidDate:'',payments:[]};

    ${isInv?`<div class="field"><label>الرقم الضريبي للعميل (اختياري — B2B)</label><input id="d_cvat" value="${esc(d.clientVat)}"></div>`:''}
    <div class="field"><label>البنود</label>
    <table class="items-tbl"><thead><tr><th>الوصف</th><th style="width:54px">كمية</th><th style="width:88px">السعر</th><th style="width:56px">خصم%</th><th style="width:90px">المجموع</th><th></th></tr></thead><tbody id="itemsBody">
    ${d.items.map((it,i)=>`<tr><td><input data-i="${i}" data-f="desc" value="${esc(it.desc)}" placeholder="عنوان الخدمة"></td>
    <td><input data-i="${i}" data-f="qty" type="number" inputmode="decimal" min="0" value="${it.qty}" onfocus="this.select()"></td>
    <td><input data-i="${i}" data-f="price" type="number" inputmode="decimal" min="0" value="${it.price}" onfocus="this.select()"></td>
    <td><input data-i="${i}" data-f="discount" type="number" inputmode="decimal" min="0" max="100" value="${it.discount||0}" onfocus="this.select()"></td>

    <td><button class="link-btn del" onclick="rmItem(${i})">×</button></td></tr>
    <tr><td colspan="6" style="padding-top:0;padding-bottom:8px"><input data-i="${i}" data-f="details" value="${esc(it.details||'')}" placeholder="↳ تفاصيل تحت الخدمة (اختياري)…" style="font-size:13px;color:var(--muted);background:transparent;border:none;border-bottom:1px dashed var(--line);border-radius:0;padding:5px 4px"></td></tr>`).join('')}
    </tbody></table><button class="link-btn" onclick="addItem()">+ بند</button>
    ${(S.products&&S.products.length)?`<span style="color:var(--muted);font-size:12px;margin:0 8px">أضف من المنتجات:</span><select onchange="if(this.value){addProduct(this.value);this.value=''}" style="width:auto;display:inline-block;padding:7px 10px"><option value="">— اختر منتجاً —</option>${S.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${money(p.price)})</option>`).join('')}</select>`:''}</div>
    <div class="row2"><div class="field"><label>الحالة</label><select id="d_status">${statuses.map(s=>`<option value="${s}" ${d.status===s?'selected':''}>${ST[s]||s}</option>`).join('')}</select></div>

    <div class="field"><label>ملاحظات</label><textarea id="d_notes" rows="2">${esc(d.notes)}</textarea></div>

  openModal(`${id?'تعديل':'جديد'} — ${isInv?'فاتورة':'عرض سعر'} #${d.number}`,body(),()=>{collect();d.contactId=findOrCreateContact(d.client);const ct=S.contacts.find(c=>c.id===d.contactId);if(ct&&ct.vat&&!d.clientVat)d.clientVat=ct.vat;if(d.status==='paid'&&!d.paidDate)d.paidDate=today();S.counters[type]=Math.max(S.counters[type],d.number);if(id){const idx=S[k].findIndex(x=>x.id===id);S[k][idx]=d}else{d.id=uid();S[k].push(d)}save();closeModal();(cb||(()=>renderDocs(type)))()});
  window.addItem=()=>{collect();d.items.push({desc:'',qty:1,price:0,discount:0});refresh()};
  window.addProduct=pid=>{collect();const p=(S.products||[]).find(x=>x.id===pid);if(!p)return;const line={desc:p.name,qty:1,price:Number(p.price||0),discount:0,details:p.desc||''};if(d.items.length===1&&!d.items[0].desc)d.items[0]=line;else d.items.push(line);refresh()};
  window.rmItem=i=>{collect();d.items.splice(i,1);if(!d.items.length)d.items.push({desc:'',qty:1,price:0,discount:0});refresh()};
  window.toggleVat=v=>{collect();d.vat=v==='1';refresh()};
  function collect(){const g=i=>document.getElementById(i);if(g('d_client')){d.client=g('d_client').value;d.date=g('d_date').value;d.status=g('d_status').value;d.notes=g('d_notes').value;d.vat=g('d_vat').value==='1';if(g('d_cvat'))d.clientVat=g('d_cvat').value;if(g('d_sp'))d.salesperson=g('d_sp').value;if(g('d_expiry'))d.expiry=g('d_expiry').value}document.querySelectorAll('#itemsBody input').forEach(inp=>{const i=+inp.dataset.i,f=inp.dataset.f;if(d.items[i])d.items[i][f]=inp.value})}
  function refresh(){document.querySelector('#modalRoot .modal-body').innerHTML=body()}
  setTimeout(()=>{document.querySelector('#modalRoot .modal-body').addEventListener('input',e=>{const t=e.target;if(t.closest('#itemsBody')){const f=t.dataset.f;if(f==='qty'||f==='price'||f==='discount'){collect();refresh()}else if(f){const i=+t.dataset.i;if(d.items[i])d.items[i][f]=t.value}}})},0);
}

/* ===== ZATCA QR ===== */
function tlv(tag,val){const b=new TextEncoder().encode(val);return [tag,b.length,...b]}
function zatcaBase64(seller,vatNo,iso,total,vat){const bytes=[...tlv(1,seller),...tlv(2,vatNo),...tlv(3,iso),...tlv(4,total),...tlv(5,vat)];let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function qrImg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createImgTag(4,8)}catch(e){return '<div style="font-size:9px;word-break:break-all;max-width:130px">'+esc(text)+'</div>'}}

      <div style="text-align:left">${qrBlock}<div style="margin-top:6px"><div style="font-size:22px;font-weight:800">${isInv?(d.vat?'فاتورة ضريبية':'فاتورة'):isCredit?'إشعار دائن':'عرض سعر'}</div><div>رقم: ${esc(isInv?(s.invPrefix||'INV-'):isCredit?'CN-':(s.salePrefix||'S'))}${String(d.number).padStart(5,'0')}</div><div>التاريخ: ${d.date}</div></div></div>

      ${ct.email?`<div style="color:#475569;font-size:13px">${esc(ct.email)}${ct.phone?' | '+esc(ct.phone):''}</div>`:(ct.phone?`<div style="color:#475569;font-size:13px">${esc(ct.phone)}</div>`:'')}
      ${cvat?`<div style="color:#475569;font-size:13px"><b>الرقم الضريبي:</b> ${esc(cvat)}</div>`:''}</div>

/* ===== SEND (WhatsApp / Email / Copy) ===== */
function _docFind(type,id){return (type==='invoice'?S.invoices:type==='credit'?S.credits:S.sales).find(x=>x.id===id)}
function docText(type,id){const isInv=type==='invoice';const d=_docFind(type,id);if(!d)return'';const s=S.settings;const pfx=isInv?(s.invPrefix||'INV-'):(s.salePrefix||'S');const lines=(d.items||[]).map(it=>`• ${it.desc} ×${it.qty} = ${money(lineTotal(it))} ${s.currency}`).join('\n');const title=isInv?'فاتورة':'عرض سعر';return `${title} ${pfx}${String(d.number).padStart(5,'0')} — ${s.brand}\nالعميل: ${resolveClientName(d)}\nالتاريخ: ${d.date}\n${lines}\nالإجمالي: ${money(invTotal(d))} ${s.currency}${isInv&&invDue(d)>0?`\nالمتبقي: ${money(invDue(d))} ${s.currency}`:''}\n\n${isInv?(s.terms||''):'بانتظار موافقتكم على العرض، وشاكرين لكم.'}`;}
function sendWhatsApp(type,id){const d=_docFind(type,id);const ct=S.contacts.find(c=>c.id===(d&&d.contactId));const phone=((ct&&ct.phone)||'').replace(/[^0-9]/g,'');window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(docText(type,id)),'_blank');}
function sendEmail(type,id){const d=_docFind(type,id);const ct=S.contacts.find(c=>c.id===(d&&d.contactId));const subj=encodeURIComponent((type==='invoice'?'فاتورة':'عرض سعر')+' من '+S.settings.brand);window.location.href='mailto:'+((ct&&ct.email)||'')+'?subject='+subj+'&body='+encodeURIComponent(docText(type,id));}
function copyDocText(type,id){const t=docText(type,id);if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>alert('تم نسخ نص المستند — الصقه أينما تريد ✓'),()=>alert(t))}else alert(t);}

/* ===== CREDIT NOTES (إشعارات دائنة / مرتجعات) ===== */
function creditFromInvoice(invId){const inv=S.invoices.find(x=>x.id===invId);if(!inv)return;const reason=prompt('سبب إشعار الدائن / المرتجع:','مرتجع كامل للفاتورة');if(reason===null)return;
  const cn={id:uid(),number:++S.counters.credit,invoiceId:invId,invNumber:inv.number,client:inv.client,contactId:inv.contactId||'',clientVat:inv.clientVat||'',date:today(),items:JSON.parse(JSON.stringify(inv.items)),notes:reason,vat:inv.vat,vatRate:inv.vatRate};
  if(!S.credits)S.credits=[];S.credits.push(cn);save();openCredit(cn.id);}
function openCredit(id){const cn=(S.credits||[]).find(x=>x.id===id);if(!cn){go('invoicing');return}const s=S.settings;const ct=S.contacts.find(c=>c.id===cn.contactId)||{};const total=invTotal(cn);
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1><button class="link-btn" onclick="go('invoicing')">← الفوترة</button> إشعار دائن CN-${String(cn.number).padStart(5,'0')}</h1></div>
    <div class="doc-acts">
      <button class="btn btn-ghost" onclick="printDoc('credit','${id}')"><i data-lucide="printer"></i> طباعة / PDF</button>
      <button class="btn btn-ghost" style="color:var(--bad)" onclick="delItem('credits','${id}',()=>go('invoicing'))">حذف</button></div>
    <div class="card">
      <div style="margin-bottom:10px;color:var(--muted)">مرتجع للفاتورة رقم <b>${esc(s.invPrefix||'INV-')}${String(cn.invNumber).padStart(5,'0')}</b> · العميل: <b>${esc(resolveClientName(cn))}</b>${ct.vat?` · الرقم الضريبي: ${esc(ct.vat)}`:''}</div>
      <table><thead><tr><th>الوصف</th><th>كمية</th><th>السعر</th><th>المجموع</th></tr></thead><tbody>
      ${(cn.items||[]).map(it=>`<tr><td>${esc(it.desc)}</td><td>${it.qty}</td><td>${money(it.price)}</td><td>${money(lineTotal(it))}</td></tr>`).join('')}
      </tbody></table>
      <div class="totals" style="margin-top:14px"><div class="line grand"><span>إجمالي الإشعار الدائن</span><span>${money(total)} ${esc(s.currency)}</span></div></div>
      ${cn.notes?`<div style="margin-top:12px;color:var(--muted)"><i class="inl" data-lucide="sticky-note"></i> ${esc(cn.notes)}</div>`:''}
    </div>`;
  refreshIcons();
}

/* ===== DOCUMENT FORM (Odoo-style status flow) ===== */
function docStages(type){return type==='invoice'?[{k:'unpaid',l:'غير مدفوعة'},{k:'partial',l:'مدفوعة جزئياً'},{k:'paid',l:'مدفوعة'}]:[{k:'draft',l:'عرض سعر'},{k:'sent',l:'مُرسل'},{k:'sale',l:'أمر بيع'}];}
function setDocStatus(type,id,status){const k=type==='invoice'?'invoices':'sales';const d=S[k].find(x=>x.id===id);if(!d)return;d.status=status;save();openDoc(type,id);}
function openDoc(type,id){
  const isInv=type==='invoice';const k=isInv?'invoices':'sales';const d=S[k].find(x=>x.id===id);if(!d){renderDocs(type);return}
  const s=S.settings;const ct=S.contacts.find(c=>c.id===d.contactId)||{};
  const sub=docTotal(d);const tax=invVat(d);const total=invTotal(d);
  const gross=(d.items||[]).reduce((a,it)=>a+Number(it.qty||0)*Number(it.price||0),0);const discTotal=gross-sub;
  const paid=invPaid(d);const due=invDue(d);
  const stages=docStages(type);const curIdx=stages.findIndex(x=>x.k===d.status);const cancelled=d.status==='cancel';
  const prefix=isInv?(s.invPrefix||'INV-'):(s.salePrefix||'S');
  const bar=cancelled?`<div class="statusbar"><div class="st active" style="background:var(--bad);color:#fff">ملغى</div></div>`:
    `<div class="statusbar">${stages.map((st,i)=>`<div class="st ${i===curIdx?'active':(i<curIdx?'done':'')}">${st.l}</div>`).join('')}</div>`;
  let acts=[];
  if(!isInv){
    if(!cancelled){
      if(d.status==='draft')acts.push(`<button class="btn btn-gold" onclick="setDocStatus('sale','${id}','sent')"><i data-lucide="send"></i> إرسال للعميل</button>`);
      if(d.status==='draft'||d.status==='sent')acts.push(`<button class="btn btn-gold" onclick="setDocStatus('sale','${id}','sale')"><i data-lucide="check-check"></i> تأكيد أمر البيع</button>`);
      if(d.status==='sale')acts.push(`<button class="btn btn-gold" onclick="toInvoice('${id}')"><i data-lucide="receipt-text"></i> إنشاء فاتورة</button>`);
    }
  }else{ if(due>0)acts.push(`<button class="btn btn-gold" onclick="paymentModal('${id}')"><i data-lucide="wallet"></i> تسجيل دفعة</button>`); }
  acts.push(`<button class="btn btn-ghost" onclick="printDoc('${type}','${id}')"><i data-lucide="printer"></i> طباعة / PDF</button>`);
  acts.push(`<button class="btn btn-ghost" onclick="docModal('${type}','${id}',null,()=>openDoc('${type}','${id}'))"><i data-lucide="pencil"></i> تعديل</button>`);
  acts.push(`<button class="btn btn-ghost" onclick="sendWhatsApp('${type}','${id}')"><i data-lucide="message-circle"></i> واتساب</button>`);
  acts.push(`<button class="btn btn-ghost" onclick="sendEmail('${type}','${id}')"><i data-lucide="mail"></i> إيميل</button>`);
  acts.push(`<button class="btn btn-ghost" onclick="copyDocText('${type}','${id}')"><i data-lucide="copy"></i> نسخ النص</button>`);
  if(isInv)acts.push(`<button class="btn btn-ghost" onclick="creditFromInvoice('${id}')"><i data-lucide="rotate-ccw"></i> إشعار دائن</button>`);
  if(!isInv&&!cancelled)acts.push(`<button class="btn btn-ghost" style="color:var(--bad)" onclick="setDocStatus('${type}','${id}','cancel')">إلغاء</button>`);
  if(!isInv&&cancelled)acts.push(`<button class="btn btn-ghost" onclick="setDocStatus('${type}','${id}','draft')">↺ إرجاع لعرض سعر</button>`);
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1><button class="link-btn" onclick="renderDocs('${type}')">← ${isInv?'الفواتير':'المبيعات'}</button> ${esc(prefix)}${String(d.number).padStart(5,'0')}</h1></div>
    ${bar}
    <div class="doc-acts">${acts.join('')}</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:14px">
        <div><div style="color:var(--muted);font-size:13px">${isInv?'فاتورة إلى':'عرض سعر إلى'}</div>
          <div style="font-weight:800;font-size:17px">${d.contactId?`<button class="link-btn" style="font-size:17px;padding:0" onclick="openClient('${d.contactId}')">${esc(resolveClientName(d))}</button>`:esc(resolveClientName(d))}</div>
          ${ct.vat?`<div style="color:var(--muted);font-size:13px">الرقم الضريبي: ${esc(ct.vat)}</div>`:''}</div>
        <div style="text-align:left;font-size:13px;color:var(--muted)">
          <div>التاريخ: ${d.date||'—'}</div>
          ${!isInv&&d.expiry?`<div>صالح حتى: ${esc(d.expiry)}</div>`:''}
          ${d.salesperson?`<div>مندوب المبيعات: ${esc(d.salesperson)}</div>`:''}</div>
      </div>
      <table><thead><tr><th>الوصف</th><th>كمية</th><th>السعر</th><th>خصم</th><th>المجموع</th></tr></thead><tbody>
      ${(d.items||[]).map(it=>`<tr><td><b>${esc(it.desc)}</b>${it.details?`<div style="font-size:12px;color:var(--muted)">${esc(it.details)}</div>`:''}</td><td>${it.qty}</td><td>${money(it.price)}</td><td>${it.discount?it.discount+'%':'—'}</td><td>${money(lineTotal(it))}</td></tr>`).join('')}
      </tbody></table>
      <div class="totals" style="margin-top:14px">
        <div class="line"><span>المجموع الفرعي</span><span>${money(sub)} ${esc(s.currency)}</span></div>
        ${discTotal>0.001?`<div class="line"><span>إجمالي الخصم</span><span>- ${money(discTotal)} ${esc(s.currency)}</span></div>`:''}
        <div class="line"><span>ضريبة القيمة المضافة (${d.vat?d.vatRate:0}%)</span><span>${money(tax)} ${esc(s.currency)}</span></div>
        <div class="line grand"><span>الإجمالي</span><span>${money(total)} ${esc(s.currency)}</span></div>
        ${isInv&&paid>0?`<div class="line"><span>المدفوع</span><span style="color:var(--good)">${money(paid)} ${esc(s.currency)}</span></div>`:''}
        ${isInv&&due>0?`<div class="line"><span>المتبقي</span><span style="color:var(--warn);font-weight:800">${money(due)} ${esc(s.currency)}</span></div>`:''}
      </div>
      ${d.notes?`<div style="margin-top:14px;color:var(--muted)"><i class="inl" data-lucide="sticky-note"></i> ${esc(d.notes)}</div>`:''}
    </div>
    ${isInv&&d.payments&&d.payments.length?`<div class="card" style="margin-top:16px"><h3><i data-lucide="wallet"></i> سجل الدفعات</h3>
      ${d.payments.map((p,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(p.date)} · ${esc(p.method||'')}</span><span>${money(p.amount)} ${esc(s.currency)} <button class="link-btn del" onclick="rmPayment('${id}',${i})">×</button></span></div>`).join('')}</div>`:''}
    ${isInv?(()=>{const cns=(S.credits||[]).filter(c=>c.invoiceId===id);return cns.length?`<div class="card" style="margin-top:16px"><h3><i data-lucide="rotate-ccw"></i> إشعارات دائنة مرتبطة</h3>${cns.map(c=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><button class="link-btn" onclick="openCredit('${c.id}')">CN-${String(c.number).padStart(5,'0')}</button><span>${money(invTotal(c))} ${esc(s.currency)}</span></div>`).join('')}</div>`:''})():''}`;
  refreshIcons();
}
function paymentModal(invId){
  const inv=S.invoices.find(x=>x.id===invId);if(!inv)return;const due=invDue(inv);
  openModal('تسجيل دفعة',`
    <div class="badge-note"><i data-lucide="wallet"></i> <div>المتبقي على الفاتورة: <b>${money(due)} ${esc(S.settings.currency)}</b></div></div>
    <div class="row2"><div class="field"><label>المبلغ</label><input id="pa_amt" type="number" inputmode="decimal" value="${Number(due.toFixed(2))}">${amtChipsHTML('pa_amt',[500,1000,2500])}</div>
    <div class="field"><label>التاريخ</label><input id="pa_date" type="date" value="${today()}"></div></div>
    <div class="field"><label>طريقة الدفع</label><select id="pa_method"><option>تحويل بنكي</option><option>نقداً</option><option>مدى / بطاقة</option><option>STC Pay</option><option>أخرى</option></select></div>`,
  ()=>{const amt=Number(document.getElementById('pa_amt').value||0);if(amt<=0){alert('أدخل مبلغاً صحيحاً');return}if(!inv.payments)inv.payments=[];inv.payments.push({id:uid(),date:document.getElementById('pa_date').value,amount:amt,method:document.getElementById('pa_method').value});syncInvStatus(inv);save();closeModal();openDoc('invoice',invId)});
}
function rmPayment(invId,idx){const inv=S.invoices.find(x=>x.id===invId);if(!inv)return;if(!confirm('حذف هذه الدفعة؟'))return;inv.payments.splice(idx,1);syncInvStatus(inv);save();openDoc('invoice',invId)}

/* ===== APPOINTMENTS ===== */
function renderAppointments(){
  const list=S.appointments.slice().sort((a,b)=>(a.datetime||'').localeCompare(b.datetime||''));
  document.getElementById('main').innerHTML=`

function apptModal(id,presetDate){

    <div class="row2"><div class="field"><label>مع (العميل)</label>${clientFieldHTML('a_contact',resolveClientName(a))}</div>
    <div class="field"><label>الحالة</label><select id="a_status">${['scheduled','done','cancelled'].map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${ST[s]}</option>`).join('')}</select></div></div>
    <div class="field"><label>ملاحظات</label><textarea id="a_notes" rows="2">${esc(a.notes)}</textarea></div>`,
  ()=>{const g=i=>document.getElementById(i).value;a.title=g('a_title');a.datetime=g('a_dt');a.duration=g('a_dur');const cn=g('a_contact').trim();a.contactId=findOrCreateContact(cn);a.contact=cn;a.status=g('a_status');a.notes=g('a_notes');if(!a.title.trim()){alert('أدخل العنوان');return}if(id){const i=S.appointments.findIndex(x=>x.id===id);S.appointments[i]=a}else{a.id=uid();S.appointments.push(a)}save();closeModal();rerender()},id?()=>delItem('appointments',id,rerender):null);
}
function gcal(a){const st=new Date(a.datetime);const en=new Date(st.getTime()+(Number(a.duration)||60)*60000);const f=d=>d.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(a.title)}&dates=${f(st)}/${f(en)}&details=${encodeURIComponent(a.notes||'')}`}
function icsLocal(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00'}
function exportICS(id){
  const arr=id?S.appointments.filter(a=>a.id===id):S.appointments;
  if(!arr.length){alert('لا توجد مواعيد للتصدير');return}
  let L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//IbrahimSaud//Cowork//AR','CALSCALE:GREGORIAN'];
  arr.forEach(a=>{const st=new Date(a.datetime);const en=new Date(st.getTime()+(Number(a.duration)||60)*60000);
    L.push('BEGIN:VEVENT','UID:'+a.id+'@ibrahimsaud','DTSTAMP:'+icsLocal(new Date()),'DTSTART:'+icsLocal(st),'DTEND:'+icsLocal(en),'SUMMARY:'+(a.title||'موعد'));
    if(a.notes)L.push('DESCRIPTION:'+a.notes.replace(/\n/g,'\\n'));if(a.contact)L.push('LOCATION:'+a.contact);L.push('END:VEVENT')});
  L.push('END:VCALENDAR');
  const b=new Blob([L.join('\r\n')],{type:'text/calendar'});const aa=document.createElement('a');aa.href=URL.createObjectURL(b);aa.download=(id?'موعد':'مواعيد')+'-'+today()+'.ics';aa.click();
}
