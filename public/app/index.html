<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>نظام إبراهيم سعود</title>
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="إبراهيم سعود">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ibrahimsaud-255/ibrahimsaud-site/main/%D8%B4%D8%B9%D8%A7%D8%B1_%D8%A7%D9%95%D8%A8%D8%B1%D8%A7%D9%87%D9%8A%D9%85_%D8%B3%D8%B9%D9%88%D8%AF.png">
<link rel="manifest" href='data:application/manifest+json,{"name":"Ibrahim Saud System","short_name":"Ibrahim Saud","start_url":".","scope":".","display":"standalone","orientation":"portrait","background_color":"%230a0a0b","theme_color":"%230a0a0b","icons":[{"src":"https://raw.githubusercontent.com/ibrahimsaud-255/ibrahimsaud-site/main/%D8%B4%D8%B9%D8%A7%D8%B1_%D8%A7%D9%95%D8%A8%D8%B1%D8%A7%D9%87%D9%8A%D9%85_%D8%B3%D8%B9%D9%88%D8%AF.png","sizes":"any","type":"image/png","purpose":"any"}]}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --bg:#0a0a0b; --panel:#141416; --panel2:#1d1d20; --panel3:#26262b; --line:#2c2c31;
    --ink:#f4f4f5; --muted:#9b9ba3; --gold:#f5a623; --gold2:#ffc24d; --goldsoft:rgba(245,166,35,.14);
    --good:#22c55e; --bad:#ef4444; --warn:#f59e0b; --info:#6366f1; --teal:#2dd4bf; --pink:#ec4899; --blue:#3b82f6;
    --radius:14px; --shadow:0 14px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .hidden{display:none !important}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--ink);font-family:inherit;font-size:15px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;transition:.15s}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1205}
  .btn-gold:hover{filter:brightness(1.08)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--gold)}
  .btn-sm{padding:7px 13px;font-size:13px;border-radius:8px}
  .wordmark{font-weight:900;letter-spacing:-.5px}
  .wordmark .w{color:#fff}.wordmark .g{color:var(--gold)}

  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:38px;box-shadow:var(--shadow);text-align:center}
  .login-box .wordmark{font-size:32px;margin-bottom:6px}
  .login-box p{color:var(--muted);margin:0 0 24px;font-size:14px}
  .field{margin-bottom:16px;text-align:right}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .lock-note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
  .pw-wrap{position:relative}
  .pw-wrap input{padding-left:62px}
  .pw-toggle{position:absolute;left:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:6px 8px}
  .pw-toggle:hover{color:var(--gold2)}
  .link-line{margin-top:16px;font-size:13px}
  .link-line button{background:none;border:none;color:var(--gold2);font-weight:700;font-size:13px;padding:2px 4px}
  .link-line button:hover{text-decoration:underline}
  .pw-meter{height:5px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
  .pw-meter > i{display:block;height:100%;width:0;transition:.25s}
  .pw-hint{font-size:11px;color:var(--muted);margin-top:5px;text-align:right}
  .btn:disabled{opacity:.55;filter:none;cursor:default}

  /* ===== CUSTOM SHELL (sidebar) ===== */
  .shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
  .sidebar{background:#000;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
  .logo-area{padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .logo-area .wordmark{font-size:23px}
  .logo-area .tagline{color:var(--muted);font-size:12px;margin-top:3px;letter-spacing:.5px}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
  .nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer;border-right:3px solid transparent;transition:.12s}
  .nav a .nic{font-size:17px;width:22px;text-align:center;display:inline-flex;align-items:center;justify-content:center}
  .nav a .nic svg{width:19px;height:19px}
  .stat .ic svg{width:24px;height:24px}
  .quick button svg{width:16px;height:16px;vertical-align:-3px;margin-left:6px}
  .page-head h1 svg{width:22px;height:22px;vertical-align:-3px;margin-left:6px}
  .card h3 svg{width:18px;height:18px;vertical-align:-3px;margin-left:5px}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.active{background:var(--goldsoft);color:var(--gold2);border-right-color:var(--gold)}
  .nav-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:3px}
  .nav-foot a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer}
  .nav-foot a:hover{background:var(--panel2);color:var(--ink)}
  .content{display:flex;flex-direction:column;min-height:100vh;min-width:0}
  .content-top{height:60px;background:#0d0d0f;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 24px;position:sticky;top:0;z-index:30}
  .ct-left{display:flex;align-items:center;gap:12px}
  .ct-title{font-weight:800;font-size:18px}
  .ct-date{color:var(--muted);font-size:13px}
  .menu-toggle{display:none;background:none;border:none;color:var(--ink);font-size:22px;cursor:pointer}
  /* branded home */
  .hero-card{background:linear-gradient(120deg,rgba(245,166,35,.18),rgba(245,166,35,.02));border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-bottom:24px}
  .hero-card h1{margin:0 0 4px;font-size:26px}
  .hero-card p{margin:0;color:var(--muted)}
  .quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
  .oauth-row{display:flex;gap:10px;margin-top:14px}
  .oauth-row button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#1a1205;border:none;border-radius:10px;padding:11px;font-weight:700;font-size:14px;cursor:pointer}
  .oauth-row button.apple{background:#111;color:#fff;border:1px solid var(--line)}
  .oauth-row button:hover{filter:brightness(.95)}
  .sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
  .sep:before,.sep:after{content:"";height:1px;background:var(--line);flex:1}
  .logo-upload{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .logo-upload img{height:54px;border-radius:8px;background:#000;padding:4px}
  .quick button{background:#000;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 15px;font-weight:700;font-size:14px;cursor:pointer;transition:.12s}
  .quick button:hover{border-color:var(--gold);color:var(--gold2)}
  @media(max-width:860px){
    .shell{grid-template-columns:1fr}
    .sidebar{position:fixed;right:0;top:0;width:252px;z-index:60;transform:translateX(105%);transition:transform .2s;box-shadow:var(--shadow)}
    .sidebar.open{transform:translateX(0)}
    .menu-toggle{display:block}
  }

  .main{padding:26px 34px;max-width:1500px;margin:0 auto;width:100%}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
  .page-head h1{margin:0;font-size:24px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:26px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
  .stat:after{content:"";position:absolute;top:-20px;left:-20px;width:80px;height:80px;border-radius:50%;background:var(--goldsoft)}
  .stat .v{font-size:28px;font-weight:800}
  .stat .l{color:var(--muted);font-size:14px;margin-top:4px}
  .stat .ic{font-size:22px;position:absolute;top:16px;left:16px;opacity:.8}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .card h3{margin-top:0}

  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
  th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
  th{background:var(--panel2);color:var(--muted);font-weight:700;font-size:13px}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  .pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
  .pill.draft,.pill.lead{background:rgba(155,155,163,.16);color:var(--muted)}
  .pill.sent,.pill.contacted{background:rgba(99,102,241,.16);color:#a5b4fc}
  .pill.quoted,.pill.scheduled{background:rgba(59,130,246,.16);color:#93c5fd}
  .pill.accepted,.pill.paid,.pill.done,.pill.won{background:rgba(34,197,94,.16);color:#86efac}
  .pill.unpaid,.pill.progress{background:rgba(245,158,11,.16);color:#fcd34d}
  .pill.rejected,.pill.lost,.pill.cancelled{background:rgba(239,68,68,.16);color:#fca5a5}
  .kbadge{background:var(--panel3);color:var(--muted);border-radius:20px;font-size:12px;font-weight:700;padding:2px 9px}
  .empty{text-align:center;padding:48px 20px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius)}
  .empty .big{font-size:44px;margin-bottom:8px}
  .link-btn{background:none;border:none;color:var(--gold);font-weight:700;font-size:13px;padding:4px 7px}
  .link-btn.del{color:var(--bad)}
  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
  .badge-note{background:var(--goldsoft);border:1px solid var(--line);color:var(--gold2);border-radius:12px;padding:13px 16px;font-size:14px;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start}

  .kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
  .kcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px;min-width:250px;transition:.15s}
  .kcol.dragover{border-color:var(--gold);background:var(--panel2)}
  .kcol h4{margin:0 0 12px;display:flex;justify-content:space-between;font-size:14px;align-items:center;gap:6px}
  .kitem{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:grab}
  .kitem:hover{border-color:var(--gold)}
  .kitem.dragging{opacity:.4}
  .kitem .t{font-weight:700;margin-bottom:4px}
  .kitem .m{font-size:12px;color:var(--muted)}
  .kitem .val{color:var(--gold);font-weight:800;margin-top:6px}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;color:var(--muted);font-size:13px;font-weight:700;padding:6px}
  .cal-cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:96px;padding:7px;font-size:13px;cursor:pointer;transition:.12s}
  .cal-cell:hover{border-color:var(--gold)}
  .cal-cell.other{opacity:.4}
  .cal-cell.today{border-color:var(--gold)}
  .cal-cell .d{font-weight:700;color:var(--muted);margin-bottom:4px}
  .cal-ev{background:var(--goldsoft);color:var(--gold2);border-radius:6px;padding:2px 6px;font-size:11px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .cal-ev.inv{background:rgba(34,197,94,.16);color:#86efac}

  .task-line{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .task-line:last-child{border:none}
  .task-line input[type=checkbox]{width:auto}
  .task-line .done{text-decoration:line-through;color:var(--muted)}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60;padding:18px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:660px;max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
  .modal-head h3{margin:0}
  .modal-body{padding:22px}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;position:sticky;bottom:0;background:var(--panel);flex-wrap:wrap}
  .x{background:none;border:none;color:var(--muted);font-size:24px;line-height:1}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .items-tbl input{padding:8px}.items-tbl td{padding:5px}
  .items-tbl input[type=number]::-webkit-inner-spin-button,.items-tbl input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .items-tbl input[type=number]{-moz-appearance:textfield;text-align:center}
  .totals{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .totals .line{display:flex;justify-content:space-between;padding:4px 0}
  .totals .grand{font-size:19px;font-weight:800;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;color:var(--gold)}
  @media(max-width:760px){
    .row2,.row3{grid-template-columns:1fr}
    .main{padding:16px}
    table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
    .content-top{padding:0 14px}
    .page-head h1{font-size:21px}
    .hero-card{padding:20px}
    .stat .v{font-size:24px}
    .modal-foot{flex-wrap:wrap}
    .btn{padding:12px 16px}
    .quick button{flex:1;min-width:120px}
  }

  /* ===== PROJECT DETAIL + TASK BOARD ===== */
  .pd-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .pd-title{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800}
  .pd-meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:6px}
  .pd-meta b{color:var(--ink)}
  .linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .ktask{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;cursor:grab}
  .ktask:hover{border-color:var(--gold)}
  .ktask.dragging{opacity:.4}
  .ktask .tt{font-weight:700;font-size:14px;margin-bottom:5px}
  .ktask .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
  .kcol .addtask{width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:8px;font-size:13px;margin-top:2px}
  .kcol .addtask:hover{border-color:var(--gold);color:var(--gold2)}

  /* ===== NOTION-LITE EDITOR ===== */
  .nb{position:relative;display:flex;gap:6px;align-items:flex-start;padding:1px 0}
  .nb .handle{opacity:0;flex:0 0 22px;color:var(--muted);background:none;border:none;font-size:15px;cursor:pointer;padding:4px 0;line-height:1.2}
  .nb:hover .handle{opacity:1}
  .nb .bc{flex:1;min-width:0}
  .ce{outline:none;border-radius:6px;padding:4px 6px;min-height:1.6em;line-height:1.7}
  .ce:empty:before{content:attr(data-ph);color:var(--muted);pointer-events:none}
  .ce.h{font-size:21px;font-weight:800;padding-top:6px}
  .ce.txt{font-size:15px}
  .nb.script .bc{background:#0e0e10;border:1px solid var(--line);border-right:3px solid var(--gold);border-radius:10px;padding:6px 10px}
  .nb.script .lbl{font-size:11px;color:var(--gold2);font-weight:700;margin:2px 4px}
  .nb.script .ce{font-family:'Tajawal',monospace;white-space:pre-wrap}
  .nb.todo .bc{display:flex;gap:9px;align-items:flex-start}
  .nb.todo input[type=checkbox]{width:auto;margin-top:9px}
  .nb.todo .ce.dn{text-decoration:line-through;color:var(--muted)}
  .nb.img img{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}
  .nb.divider hr{border:none;border-top:1px solid var(--line);margin:10px 0;width:100%}
  .nb-img-cap{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
  .slash{position:absolute;z-index:80;background:var(--panel3);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;width:230px;max-height:280px;overflow:auto}
  .slash button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:var(--ink);padding:9px 10px;border-radius:8px;font-size:14px;text-align:right}
  .slash button:hover,.slash button.sel{background:var(--goldsoft);color:var(--gold2)}
  .slash .si{width:26px;text-align:center;font-size:16px}
  .slash .sd{font-size:11px;color:var(--muted)}
  .ed-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;position:sticky;top:0;background:var(--panel);padding-bottom:8px;z-index:5}
  .task-modal{max-width:780px}
  .upbar{font-size:12px;color:var(--gold2)}
</style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-box">
    <img src="https://raw.githubusercontent.com/ibrahimsaud-255/ibrahimsaud-site/main/%D8%B4%D8%B9%D8%A7%D8%B1_%D8%A7%D9%95%D8%A8%D8%B1%D8%A7%D9%87%D9%8A%D9%85_%D8%B3%D8%B9%D9%88%D8%AF.png" alt="إبراهيم سعود" style="max-width:210px;width:72%;display:block;margin:0 auto 12px;border-radius:12px" onerror="this.style.display='none'">
    <p>نظام إدارة الأعمال — دخول المالك</p>
    <div class="field"><label>البريد الإلكتروني</label><input type="email" id="em" placeholder="you@email.com" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>كلمة المرور</label><div class="pw-wrap"><input type="password" id="pw" placeholder="••••••••" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')doLogin()"><button type="button" class="pw-toggle" onclick="togglePw('pw',this)">إظهار</button></div></div>
    <button id="btnLogin" class="btn btn-gold" style="width:100%" onclick="doLogin()">دخول</button>
    <button id="btnSignup" class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="doSignup()">إنشاء حساب جديد (أول مرة)</button>
    <div class="link-line"><button type="button" onclick="doForgot()">نسيت كلمة المرور؟</button></div>
    <div id="loginErr" class="lock-note" style="color:var(--bad)"></div>
    <div id="loginMsg" class="lock-note"></div>
  </div>
</div>

<div id="resetView" class="login-wrap hidden">
  <div class="login-box">

/* ===== STATE ===== */
const KEY='ibsaud_erp_v1';
const def={
  settings:{brand:'إبراهيم سعود',owner:'إبراهيم سعود',email:'ibrahimsaud25@gmail.com',phone:'966504895213',
    currency:'ر.س',password:'admin',logo:'',invPrefix:'INV-',terms:'شكراً لتعاملكم. تُسدَّد الفاتورة خلال 14 يوماً.',bankName:'',iban:'',

let S=load();
function load(){let s;try{const r=localStorage.getItem(KEY);s=r?deepMerge(JSON.parse(JSON.stringify(def)),JSON.parse(r)):JSON.parse(JSON.stringify(def))}catch(e){s=JSON.parse(JSON.stringify(def))}
  if(!s.crmStages||!s.crmStages.length)s.crmStages=JSON.parse(JSON.stringify(def.crmStages));
  if(!s.projectStages||!s.projectStages.length)s.projectStages=JSON.parse(JSON.stringify(def.projectStages));

  return s;}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=deepMerge(a[k]||{},b[k])}else a[k]=b[k]}return a}

const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+S.settings.currency;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== AUTH (Supabase) ===== */
const LOGO='https://raw.githubusercontent.com/ibrahimsaud-255/ibrahimsaud-site/main/%D8%B4%D8%B9%D8%A7%D8%B1_%D8%A7%D9%95%D8%A8%D8%B1%D8%A7%D9%87%D9%8A%D9%85_%D8%B3%D8%B9%D9%88%D8%AF.png';
let RECOVERY_MODE=false;
function lerr(m){document.getElementById('loginErr').textContent=m||''}
function lmsg(m){document.getElementById('loginMsg').textContent=m||''}
function rerr(m){document.getElementById('resetErr').textContent=m||''}
function rmsg(m){document.getElementById('resetMsg').textContent=m||''}
function busy(id,on){const b=document.getElementById(id);if(b)b.disabled=!!on}
function togglePw(id,btn){const el=document.getElementById(id);if(!el)return;const show=el.type==='password';el.type=show?'text':'password';btn.textContent=show?'إخفاء':'إظهار'}
function authMsg(m){return /invalid login/i.test(m)?'البريد أو كلمة المرور غير صحيحة. إن كنت تستخدم التعبئة التلقائية في الجوال فقد تكون كلمة مرور قديمة — امسح الحقل واكتبها يدويًا، أو اضغط «نسيت كلمة المرور؟».':/email not confirmed/i.test(m)?'لم تُؤكَّد بريدك بعد — افتح رسالة التأكيد التي وصلتك واضغط الرابط ثم عُد للدخول.':/rate|too many|seconds/i.test(m)?'محاولات كثيرة — انتظر قليلًا ثم أعد المحاولة.':m}
async function doLogin(){const em=document.getElementById('em').value.trim().toLowerCase();const pw=document.getElementById('pw').value.trim();if(!em||!pw){lerr('اكتب البريد وكلمة المرور.');return}lerr('');busy('btnLogin',true);lmsg('جارٍ الدخول...');const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});busy('btnLogin',false);if(error){lmsg('');lerr('تعذّر الدخول: '+authMsg(error.message));return}lmsg('');await enterApp(data.user)}
async function doSignup(){const em=document.getElementById('em').value.trim().toLowerCase();const pw=document.getElementById('pw').value.trim();if(!em){lerr('اكتب بريدك الإلكتروني.');return}if(pw.length<8){lerr('كلمة المرور يجب أن تكون 8 أحرف على الأقل.');return}lerr('');busy('btnSignup',true);lmsg('جارٍ إنشاء الحساب...');const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});busy('btnSignup',false);if(error){lmsg('');lerr('تعذّر الإنشاء: '+authMsg(error.message));return}if(data.session){lmsg('');await enterApp(data.user)}else{lmsg('تم الإنشاء ✓ تحقّق من بريدك لتأكيد الحساب ثم اضغط دخول.')}}
async function doForgot(){const em=document.getElementById('em').value.trim().toLowerCase();if(!em){lerr('اكتب بريدك في الخانة أعلاه أولًا ثم اضغط «نسيت كلمة المرور؟».');return}lerr('');busy('btnLogin',true);lmsg('جارٍ إرسال رابط الاستعادة...');const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});busy('btnLogin',false);if(error&&/rate|too many|seconds/i.test(error.message)){lmsg('');lerr('محاولات كثيرة — انتظر دقيقة ثم أعد المحاولة.');return}lmsg('إن كان هذا البريد مسجّلًا فستصلك رسالة فيها رابط لإعادة تعيين كلمة المرور. افتح الرابط من نفس الجهاز، وتحقّق من صندوق «الرسائل غير المرغوبة» أيضًا.')}
function showReset(){document.getElementById('loginView').classList.add('hidden');document.getElementById('appShell').classList.add('hidden');document.getElementById('resetView').classList.remove('hidden');const f=document.getElementById('np1');if(f)f.focus()}
function pwStrength(){const v=document.getElementById('np1').value;let s=0;if(v.length>=8)s++;if(v.length>=12)s++;if(/[0-9]/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;if(/[A-Z]/.test(v)&&/[a-z]/.test(v))s++;const bar=document.getElementById('pwBar');const col=s<=1?'var(--bad)':s<=2?'var(--warn)':s<=3?'var(--gold)':'var(--good)';bar.style.width=Math.min(100,s*22)+'%';bar.style.background=col;document.getElementById('pwHint').textContent=v.length<8?'قصيرة جدًا — 8 أحرف على الأقل.':s<=2?'ضعيفة — أضف أرقامًا ورموزًا وحروفًا كبيرة.':s<=3?'متوسطة — يمكن تقويتها أكثر.':'قوية ✓'}
async function doSetNewPassword(){const p1=document.getElementById('np1').value;const p2=document.getElementById('np2').value;rerr('');if(p1.length<8){rerr('كلمة المرور يجب أن تكون 8 أحرف على الأقل.');return}if(p1!==p2){rerr('كلمتا المرور غير متطابقتين.');return}busy('btnReset',true);rmsg('جارٍ الحفظ...');const {data,error}=await sb.auth.updateUser({password:p1});busy('btnReset',false);if(error){rmsg('');rerr('تعذّر الحفظ: '+authMsg(error.message)+' — قد يكون الرابط منتهيًا، اطلب رابطًا جديدًا.');return}rmsg('تم تحديث كلمة المرور ✓');RECOVERY_MODE=false;history.replaceState(null,'',location.origin+location.pathname);document.getElementById('resetView').classList.add('hidden');await enterApp(data.user)}
const ADMIN_EMAIL='ibrahimsaud25@gmail.com';
async function enterApp(user){if(USER&&user&&USER.id===user.id)return;if(!user.email||user.email.toLowerCase()!==ADMIN_EMAIL){await sb.auth.signOut();lmsg('');lerr('هذا النظام مخصّص لحساب المدير فقط ('+ADMIN_EMAIL+'). الفريلانسرز يدخلون عبر روابطهم الخاصة.');return}USER=user;lmsg('جارٍ تحميل بياناتك...');try{await loadCloud();await loadFreelancers();migrateData();save()}catch(e){lerr('تعذّر تحميل البيانات: '+e.message);lmsg('');return}lmsg('');document.getElementById('loginView').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden');renderNav();applyBranding();const dt=document.getElementById('ctDate');if(dt)dt.textContent=new Date().toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'});go('home')}
async function logout(){await sb.auth.signOut();USER=null;STATE_ID=null;document.getElementById('appShell').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden')}
async function oauth(provider){lerr('');lmsg('جارٍ التحويل إلى '+(provider==='google'?'Google':'Apple')+'…');const {error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+location.pathname}});if(error){lmsg('');lerr('تعذّر: '+error.message+' — تأكد من تفعيل المزوّد في Supabase.')}}
async function loadCloud(){const {data:rows,error}=await sb.from('app_state').select('*').limit(1);if(error)throw error;if(rows&&rows.length){STATE_ID=rows[0].id;const d=rows[0].data||{};S=deepMerge(JSON.parse(JSON.stringify(def)),d);if(!S.crmStages||!S.crmStages.length)S.crmStages=JSON.parse(JSON.stringify(def.crmStages));if(!S.projectStages||!S.projectStages.length)S.projectStages=JSON.parse(JSON.stringify(def.projectStages));(S.crm||[]).forEach(o=>{if(!o.stageKey)o.stageKey=o.stage||S.crmStages[0].key});(S.projects||[]).forEach(p=>{if(!p.stageKey)p.stageKey=S.projectStages[0].key})}else{const {freelancers,...rest}=S;const {data:ins,error:e2}=await sb.from('app_state').insert({data:rest,owner:USER.id}).select('id').single();if(e2)throw e2;STATE_ID=ins.id}}
async function loadFreelancers(){const {data}=await sb.from('freelancers').select('*').order('created_at');S.freelancers=data||[]}
function flName(id){const f=(S.freelancers||[]).find(x=>x.id===id);return f?f.name:''}

/* ===== TASK SYNC (for freelancer links) ===== */
async function syncTasks(){if(!USER)return;try{const rows=[];S.projects.forEach(p=>{(p.tasks||[]).forEach(t=>{if(t.assignee&&t.id){rows.push({owner:USER.id,client_id:t.id,project_title:p.title,title:t.title,stage:(S.projectStages.find(s=>s.key===p.stageKey)||{}).label||'',freelancer_id:t.assignee})}})});if(rows.length)await sb.from('tasks').upsert(rows,{onConflict:'owner,client_id'});const keep=rows.map(r=>r.client_id);const {data:ex}=await sb.from('tasks').select('id,client_id');const toDel=(ex||[]).filter(r=>!keep.includes(r.client_id)).map(r=>r.id);if(toDel.length)await sb.from('tasks').delete().in('id',toDel)}catch(e){console.warn('syncTasks',e)}}

/* ===== TEAM (freelancers) ===== */
function renderTeam(){
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>الفريق (الفريلانسرز)</h1><button class="btn btn-gold" onclick="flAdd()">+ فريلانسر</button></div>
    <div class="badge-note">🔗 <div>أضف فريلانسر ثم انسخ رابطه الخاص وأرسله له. يفتح الرابط ويرى <b>مهامه فقط</b> دون أي بيانات أخرى، ويقدر يضيفه كاختصار في جواله. أسند المهام له من «المشروع».</div></div>
    ${!S.freelancers.length?emptyBox('👥','لا يوجد فريلانسرز بعد. أضف أول عضو.'):
    `<table><thead><tr><th>الاسم</th><th>البريد</th><th>الرابط الخاص</th><th></th></tr></thead><tbody>
    ${S.freelancers.map(f=>`<tr><td><span style="font-size:18px">${f.icon||'🎬'}</span> ${esc(f.name)}</td><td>${esc(f.email||'—')}</td>
    <td style="white-space:nowrap"><button class="link-btn" onclick="flCopy('${f.token}')">📋 نسخ الرابط</button> <a class="link-btn" href="${flLink(f.token)}" target="_blank">فتح</a></td>
    <td><button class="link-btn del" onclick="flDel('${f.id}')">حذف</button></td></tr>`).join('')}
    </tbody></table>`}`;
}
function flCopy(token){const u=flLink(token);navigator.clipboard.writeText(u).then(()=>alert('تم نسخ الرابط:\n'+u)).catch(()=>prompt('انسخ الرابط:',u))}
function flAdd(){openModal('فريلانسر جديد',`
  <div class="row2"><div class="field"><label>الاسم</label><input id="f_name" placeholder="مثلاً: محمد"></div>
  <div class="field"><label>الأيقونة (تصير أيقونة تطبيقه)</label><input id="f_icon" value="🎬" maxlength="2" style="text-align:center;font-size:22px"></div></div>
  <div style="margin:-4px 0 12px;display:flex;gap:4px;flex-wrap:wrap">${['🎬','🎥','✂️','📸','🎙️','🚁','✍️','🎨','💻','📱'].map(e=>`<button type="button" class="link-btn" style="font-size:22px;padding:2px 6px" onclick="document.getElementById('f_icon').value='${e}'">${e}</button>`).join('')}</div>
  <div class="field"><label>البريد (للإشعارات لاحقاً)</label><input id="f_email" type="email"></div>`,
  async()=>{const name=document.getElementById('f_name').value.trim();const icon=document.getElementById('f_icon').value.trim()||'🎬';const email=document.getElementById('f_email').value.trim();if(!name){alert('أدخل الاسم');return}const {data,error}=await sb.from('freelancers').insert({name,icon,email,owner:USER.id}).select().single();if(error){alert('خطأ: '+error.message);return}S.freelancers.push(data);closeModal();renderTeam()})}
async function flDel(id){if(!confirm('حذف الفريلانسر؟'))return;await sb.from('freelancers').delete().eq('id',id);S.freelancers=S.freelancers.filter(f=>f.id!==id);renderTeam()}

async function renderAntar(){
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1><i data-lucide="sparkles"></i> عنتر — مساعدك</h1></div>
    <div class="badge-note"><i data-lucide="mic"></i> <div>قل «يا Siri، عنتر» وأملِ مهمتك، أو اكتبها هنا — تظهر في الوارد. (ذكاء عنتر الكامل: فهم الجُمل والجدولة والرد، يُفعّل عند ربط مفتاح Groq.)</div></div>
    <div class="card" style="margin-bottom:16px"><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="antarInput" placeholder="اكتب مهمة لعنتر…" onkeydown="if(event.key==='Enter')antarQuickAdd()" style="flex:1;min-width:160px"><button class="btn btn-gold" onclick="antarQuickAdd()"><i data-lucide="plus"></i> إضافة</button></div></div>
    <div id="antarList"><p style="color:var(--muted)">جارٍ التحميل…</p></div>`;
  refreshIcons();antarLoad();
}
async function antarLoad(){
  const el=document.getElementById('antarList');if(!el)return;
  const {data,error}=await sb.from('antar_inbox').select('*').eq('done',false).order('scheduled_for',{ascending:true,nullsFirst:false}).order('created_at',{ascending:false});
  if(error){el.innerHTML=emptyBox('alert-triangle','تعذّر التحميل: '+error.message);refreshIcons();return}
  if(!data||!data.length){el.innerHTML=emptyBox('sparkles','الوارد فارغ. أضف مهمة أو قل «يا عنتر».');refreshIcons();return}
  const tk=today();
  el.innerHTML='<table><thead><tr><th>المهمة</th><th>التاريخ</th><th></th></tr></thead><tbody>'+data.map(t=>{
    let dchip='<span style="color:var(--muted)">—</span>';
    if(t.scheduled_for){const sd=t.scheduled_for;const cls=sd<tk?'unpaid':(sd===tk?'progress':'scheduled');const lbl=sd===tk?'اليوم':(sd<tk?'متأخر · '+sd:sd);dchip=`<span class="pill ${cls}">${lbl}</span>`}
    return `<tr><td>${esc(t.text)}</td><td>${dchip}</td><td style="white-space:nowrap"><button class="link-btn" onclick="antarDone('${t.id}')">✓ تم</button><button class="link-btn del" onclick="antarDel('${t.id}')">حذف</button></td></tr>`;}).join('')+'</tbody></table>';
}
async function antarQuickAdd(){const i=document.getElementById('antarInput');const v=i.value.trim();if(!v)return;await sb.from('antar_inbox').insert({text:v});i.value='';antarLoad()}
async function antarDone(id){await sb.from('antar_inbox').update({done:true}).eq('id',id);antarLoad()}
async function antarDel(id){if(!confirm('حذف؟'))return;await sb.from('antar_inbox').delete().eq('id',id);antarLoad()}

  document.getElementById('loginView').classList.add('hidden');document.getElementById('appShell').classList.add('hidden');
  const v=document.getElementById('flView');v.classList.remove('hidden');
  v.innerHTML='<div style="padding:50px;text-align:center;color:var(--muted)">جارٍ التحميل…</div>';
  const {data:fl,error:e1}=await sb.rpc('get_freelancer',{p_token:token});
  if(e1||!fl||!fl.length){v.innerHTML='<div style="padding:60px 20px;text-align:center"><div style="font-size:42px">🔒</div><p>رابط غير صالح أو منتهٍ.</p></div>';return}
  const name=fl[0].name||''; const ic=fl[0].icon||'🎬';

/* ===== HELPERS ===== */
function docTotal(d){return (d.items||[]).reduce((a,it)=>a+(Number(it.qty||0)*Number(it.price||0)),0)}
function invVat(inv){return inv.vat?docTotal(inv)*(Number(inv.vatRate||0)/100):0}
function invTotal(inv){return docTotal(inv)+invVat(inv)}
const ST={draft:'مسودة',sent:'مُرسل',accepted:'مقبول',rejected:'مرفوض',paid:'مدفوعة',unpaid:'غير مدفوعة',scheduled:'مجدول',done:'تم',cancelled:'ملغى'};
function pill(s){return `<span class="pill ${s}">${ST[s]||s}</span>`}
function miniList(arr,fn,empty){if(!arr.length)return `<p style="color:var(--muted)">${empty}</p>`;return arr.map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">${fn(x)}</div>`).join('')}
function contactName(id){const c=S.contacts.find(c=>c.id===id);return c?c.name:''}
/* ===== UNIFIED CLIENT LINKING (single source = contacts) ===== */
const DEFAULT_TASK_STAGES=[{key:'todo',label:'قيد الانتظار'},{key:'doing',label:'قيد التنفيذ'},{key:'review',label:'مراجعة'},{key:'done',label:'منجز'}];
// يجد جهة الاتصال بالاسم (دون حساسية حالة) أو ينشئها مرة واحدة، ويرجّع id
function findOrCreateContact(name,type){name=(name||'').trim();if(!name)return '';let c=(S.contacts||[]).find(x=>(x.name||'').trim().toLowerCase()===name.toLowerCase());if(c)return c.id;c={id:uid(),name,type:type||'عميل',phone:'',email:'',company:'',notes:''};S.contacts.push(c);return c.id}
// اسم العميل للعرض: من الـ id المربوط، وإلا النص القديم (توافق)
function resolveClientName(rec){return contactName(rec.contactId)||rec.client||rec.clientName||rec.contact||'—'}
// قائمة datalist للإكمال التلقائي (تُضمَّن داخل المودال)
function contactsDatalist(){return `<datalist id="__contactsDL">${(S.contacts||[]).map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>`}
// حقل عميل ذكي: يبحث في المسجّلين ويقبل اسماً جديداً (يُسجّل عند الحفظ)
function clientFieldHTML(idAttr,current){return `<input id="${idAttr}" list="__contactsDL" value="${esc(current==='—'?'':current||'')}" placeholder="ابحث باسم عميل أو أضف جديد" autocomplete="off">`+contactsDatalist()}
// روابط عناصر العميل (مواعيد/فواتير/مشاريع) عبر contactId
function clientItems(contactId){if(!contactId)return {appts:[],invoices:[],projects:[]};return {appts:S.appointments.filter(a=>a.contactId===contactId),invoices:S.invoices.filter(i=>i.contactId===contactId),projects:S.projects.filter(p=>p.contactId===contactId)}}
// ترحيل آمن: يحوّل الأسماء النصية القديمة لجهات اتصال مربوطة (idempotent)
function migrateData(){
  (S.projects||[]).forEach(p=>{
    if(!p.taskStages||!p.taskStages.length)p.taskStages=JSON.parse(JSON.stringify(DEFAULT_TASK_STAGES));
    if(!p.contactId&&p.client)p.contactId=findOrCreateContact(p.client);
    (p.tasks||[]).forEach(t=>{if(!t.stageKey)t.stageKey=t.done?'done':p.taskStages[0].key;if(!Array.isArray(t.blocks))t.blocks=[]});
  });
  (S.appointments||[]).forEach(a=>{if(!a.contactId&&a.contact)a.contactId=findOrCreateContact(a.contact)});
  (S.invoices||[]).forEach(d=>{if(!d.contactId&&d.client)d.contactId=findOrCreateContact(d.client)});
  (S.sales||[]).forEach(d=>{if(!d.contactId&&d.client)d.contactId=findOrCreateContact(d.client)});
  (S.crm||[]).forEach(o=>{if(!o.contactId&&(o.clientName||o.client))o.contactId=findOrCreateContact(o.clientName||o.client)});
}
function emptyBox(ic,txt){return `<div class="empty"><div class="big">${ic}</div>${txt}</div>`}
function delItem(coll,id,cb){if(!confirm('تأكيد الحذف؟'))return;S[coll]=S[coll].filter(x=>x.id!==id);save();closeModal();cb&&cb()}

/* ===== DRAG & DROP (kanban) ===== */
let DRAG=null;
function dstart(e,coll,id){DRAG={coll,id};e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move'}
function dend(e){e.currentTarget.classList.remove('dragging')}
function dover(e){e.preventDefault();e.currentTarget.classList.add('dragover')}
function dleave(e){e.currentTarget.classList.remove('dragover')}
function ddrop(e,coll,stageKey){e.preventDefault();e.currentTarget.classList.remove('dragover');if(DRAG&&DRAG.coll===coll){const it=S[coll].find(x=>x.id===DRAG.id);if(it&&it.stageKey!==stageKey){it.stageKey=stageKey;save();if(coll==='projects')syncTasks();rerender()}}DRAG=null}

/* ===== STAGE EDITOR ===== */
function stageEditor(stagesKey,coll){
  let stages=JSON.parse(JSON.stringify(S[stagesKey]));
  function body(){return `<p style="color:var(--muted);font-size:13px;margin-top:0">أضف أو احذف أو رتّب المراحل. البطاقات في المرحلة المحذوفة تنتقل لأول مرحلة.</p>`+
    stages.map((s,i)=>`<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
      <input value="${esc(s.label)}" oninput="stEdit(${i},this.value)" style="flex:1">
      <button class="link-btn" onclick="stMove(${i},-1)">▲</button><button class="link-btn" onclick="stMove(${i},1)">▼</button>
      <button class="link-btn del" onclick="stDel(${i})">حذف</button></div>`).join('')+
    `<button class="btn btn-ghost btn-sm" onclick="stAdd()">+ مرحلة جديدة</button>`}
  openModal('تعديل المراحل',body(),()=>{if(!stages.length){alert('أضف مرحلة واحدة على الأقل');return}const keys=stages.map(s=>s.key);S[coll].forEach(it=>{if(!keys.includes(it.stageKey))it.stageKey=keys[0]});S[stagesKey]=stages;save();closeModal();rerender()});
  window.stEdit=(i,v)=>{stages[i].label=v};
  window.stAdd=()=>{stages.push({key:uid(),label:'مرحلة جديدة'});refresh()};
  window.stDel=(i)=>{stages.splice(i,1);refresh()};
  window.stMove=(i,d)=>{const j=i+d;if(j<0||j>=stages.length)return;[stages[i],stages[j]]=[stages[j],stages[i]];refresh()};
  function refresh(){document.querySelector('#modalRoot .modal-body').innerHTML=body()}
}

/* ===== GENERIC KANBAN ===== */
function renderKanban(cfg){
  const stages=S[cfg.stagesKey];
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>${cfg.title}</h1><div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="stageEditor('${cfg.stagesKey}','${cfg.coll}')">⚙ تعديل المراحل</button>
      <button class="btn btn-gold" onclick="${cfg.onAdd}">+ ${cfg.addLabel}</button></div></div>
    ${cfg.note||''}
    ${!S[cfg.coll].length?emptyBox(cfg.emptyIcon,cfg.emptyText):
    `<div class="kanban">${stages.map(st=>{
      const items=S[cfg.coll].filter(it=>it.stageKey===st.key);
      const sum=cfg.valueField?items.reduce((a,it)=>a+Number(it[cfg.valueField]||0),0):null;
      return `<div class="kcol" ondragover="dover(event)" ondragleave="dleave(event)" ondrop="ddrop(event,'${cfg.coll}','${st.key}')">
        <h4><span>${esc(st.label)}</span><span class="kbadge">${items.length}</span></h4>
        ${sum!=null?`<div style="font-size:12px;color:var(--gold);margin-bottom:8px">${money(sum)}</div>`:''}
        ${items.map(it=>`<div class="kitem" draggable="true" ondragstart="dstart(event,'${cfg.coll}','${it.id}')" ondragend="dend(event)" onclick="${cfg.onOpen}('${it.id}')">${cfg.card(it)}</div>`).join('')||'<p style="color:var(--muted);font-size:12px">اسحب بطاقة هنا</p>'}
      </div>`}).join('')}</div>`}`;
}

/* task drag & drop within project */
let TDRAG=null;
function tdstart(e,id){TDRAG=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.stopPropagation()}
function tdend(e){e.currentTarget.classList.remove('dragging')}
function tdover(e){e.preventDefault();e.currentTarget.classList.add('dragover')}
function tdleave(e){e.currentTarget.classList.remove('dragover')}
function tddrop(e,stageKey){e.preventDefault();e.currentTarget.classList.remove('dragover');const p=proj();if(p&&TDRAG){const t=(p.tasks||[]).find(x=>x.id===TDRAG);if(t&&t.stageKey!==stageKey){t.stageKey=stageKey;t.done=(stageKey==='done');save();syncTasks();renderProjectDetail(p.id)}}TDRAG=null}
function quickAddTask(stageKey){const p=proj();if(!p)return;openModal('مهمة جديدة',`
  <div class="field"><label>عنوان المهمة</label><input id="nt_title" placeholder="مثال: كتابة سكربت الحلقة" onkeydown="if(event.key==='Enter')document.getElementById('mSave').click()"></div>
  <div class="field"><label>المسؤول (اختياري)</label><select id="nt_as"><option value="">— لا أحد —</option>${(S.freelancers||[]).map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div>`,
  ()=>{const v=document.getElementById('nt_title').value.trim();if(!v){alert('أدخل عنوان المهمة');return}const as=document.getElementById('nt_as').value;p.tasks=p.tasks||[];p.tasks.push({id:uid(),title:v,stageKey,done:stageKey==='done',assignee:as,blocks:[]});save();syncTasks();closeModal();renderProjectDetail(p.id)});
  setTimeout(()=>{const n=document.getElementById('nt_title');if(n)n.focus()},50);
}
function taskStageEditor(id){const p=S.projects.find(x=>x.id===id);if(!p)return;
  let stages=JSON.parse(JSON.stringify(p.taskStages||DEFAULT_TASK_STAGES));
  function body(){return `<p style="color:var(--muted);font-size:13px;margin-top:0">مراحل المهام لهذا المشروع. المهام في مرحلة محذوفة تنتقل لأول مرحلة.</p>`+
    stages.map((s,i)=>`<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
      <input value="${esc(s.label)}" oninput="tsEdit(${i},this.value)" style="flex:1">
      <button class="link-btn" onclick="tsMove(${i},-1)">▲</button><button class="link-btn" onclick="tsMove(${i},1)">▼</button>
      <button class="link-btn del" onclick="tsDel(${i})">حذف</button></div>`).join('')+
    `<button class="btn btn-ghost btn-sm" onclick="tsAdd()">+ مرحلة جديدة</button>`}
  openModal('مراحل المهام',body(),()=>{if(!stages.length){alert('أضف مرحلة واحدة على الأقل');return}const keys=stages.map(s=>s.key);(p.tasks||[]).forEach(t=>{if(!keys.includes(t.stageKey))t.stageKey=keys[0]});p.taskStages=stages;save();closeModal();renderProjectDetail(id)});
  window.tsEdit=(i,v)=>{stages[i].label=v};
  window.tsAdd=()=>{stages.push({key:uid(),label:'مرحلة جديدة'});refresh()};
  window.tsDel=(i)=>{stages.splice(i,1);refresh()};
  window.tsMove=(i,d)=>{const j=i+d;if(j<0||j>=stages.length)return;[stages[i],stages[j]]=[stages[j],stages[i]];refresh()};
  function refresh(){document.querySelector('#modalRoot .modal-body').innerHTML=body()}
}

let CUR_TASK=null;
function curTask(){const p=proj();return p?(p.tasks||[]).find(x=>x.id===CUR_TASK):null}
function findBlock(id){const t=curTask();return t?(t.blocks||[]).find(b=>b.id===id):null}
function openTask(taskId){const p=proj();if(!p)return;const t=(p.tasks||[]).find(x=>x.id===taskId);if(!t)return;CUR_TASK=taskId;if(!Array.isArray(t.blocks))t.blocks=[];

  const stOpts=(p.taskStages||DEFAULT_TASK_STAGES).map(s=>`<option value="${s.key}" ${t.stageKey===s.key?'selected':''}>${esc(s.label)}</option>`).join('');
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeTask()"><div class="modal task-modal">
    <div class="modal-head"><input id="t_title" value="${esc(t.title)}" style="font-size:18px;font-weight:800;border:none;background:transparent;padding:4px;width:auto;flex:1" oninput="taskTitle(this.value)"><button class="x" onclick="closeTask()">×</button></div>
    <div class="modal-body">
      <div class="row2" style="margin-bottom:14px">
        <div class="field"><label>المرحلة</label><select id="t_stage" onchange="taskStage(this.value)">${stOpts}</select></div>
        <div class="field"><label>المسؤول</label><select id="t_as" onchange="taskAssignee(this.value)">${asOpts}</select></div>
      </div>
      <div class="ed-toolbar">
        <button class="btn btn-ghost btn-sm" onclick="addBlock('text')">¶ نص</button>
        <button class="btn btn-ghost btn-sm" onclick="addBlock('heading')">H عنوان</button>
        <button class="btn btn-ghost btn-sm" onclick="addBlock('script')">🎬 سكربت</button>
        <button class="btn btn-ghost btn-sm" onclick="addBlock('todo')">☑ مهمة فرعية</button>
        <button class="btn btn-ghost btn-sm" onclick="pickImage()">🖼️ صورة</button>
        <button class="btn btn-ghost btn-sm" onclick="addBlock('divider')">— فاصل</button>
        <span style="align-self:center;color:var(--muted);font-size:12px">أو اكتب «/» داخل أي سطر · للعريض Ctrl/⌘+B</span>
        <span id="upStatus" class="upbar"></span>
      </div>
      <div id="blocks">${t.blocks.map(b=>blockHTML(b)).join('')}</div>
      <button class="addtask" style="margin-top:10px" onclick="addBlock('text')">+ أضف سطراً</button>
      <input type="file" id="imgFile" accept="image/*" class="hidden" onchange="onImagePicked(event)">
      <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:12px"><button class="link-btn del" onclick="deleteTask()">🗑 حذف المهمة</button></div>
    </div></div></div>`;
}
function blockHTML(b){
  if(b.type==='heading')return blkWrap(b,`<div class="ce h" contenteditable data-bid="${b.id}" data-ph="عنوان" onkeydown="blockKey(event,'${b.id}')" oninput="onCe('${b.id}')">${b.html||''}</div>`);
  if(b.type==='script')return blkWrap(b,`<div class="lbl">🎬 سكربت الفيديو</div><div class="ce" contenteditable data-bid="${b.id}" data-ph="اكتب نص الفيديو…" onkeydown="blockKey(event,'${b.id}')" oninput="onCe('${b.id}')">${b.html||''}</div>`,'script');
  if(b.type==='todo')return blkWrap(b,`<input type="checkbox" ${b.done?'checked':''} onchange="todoToggle('${b.id}',this.checked)"><div class="ce txt ${b.done?'dn':''}" contenteditable data-bid="${b.id}" data-ph="مهمة فرعية…" onkeydown="blockKey(event,'${b.id}')" oninput="onCe('${b.id}')">${b.html||''}</div>`,'todo');
  if(b.type==='image')return blkWrap(b,`<img src="${esc(b.url)}" alt="">`,'img');
  if(b.type==='divider')return blkWrap(b,`<hr>`,'divider');
  return blkWrap(b,`<div class="ce txt" contenteditable data-bid="${b.id}" data-ph="اكتب… (أو «/» لأمر)" onkeydown="blockKey(event,'${b.id}')" oninput="onCe('${b.id}')">${b.html||''}</div>`);
}
function blkWrap(b,inner,cls){return `<div class="nb ${cls||''}" data-id="${b.id}"><button class="handle" onclick="blockMenu(event,'${b.id}')" title="خيارات">⋮</button><div class="bc">${inner}</div></div>`}
function onCe(id){const el=document.querySelector(`[data-bid="${id}"]`);const b=findBlock(id);if(el&&b){b.html=el.innerHTML;scheduleTaskSave()}}
function scheduleTaskSave(){clearTimeout(window.__tsv);window.__tsv=setTimeout(()=>{save();syncTasks()},700)}
function taskTitle(v){const t=curTask();if(t){t.title=v;scheduleTaskSave()}}
function taskStage(v){const t=curTask();if(t){t.stageKey=v;t.done=(v==='done');scheduleTaskSave()}}
function taskAssignee(v){const t=curTask();if(t){t.assignee=v;scheduleTaskSave()}}
function todoToggle(id,c){const b=findBlock(id);if(b){b.done=c;const el=document.querySelector(`[data-bid="${id}"]`);if(el)el.classList.toggle('dn',c);scheduleTaskSave()}}
function addBlock(type,afterId){const t=curTask();if(!t)return;const b={id:uid(),type};if(type==='todo')b.done=false;if(type!=='divider'&&type!=='image')b.html='';let idx=t.blocks.length;if(afterId){const i=t.blocks.findIndex(x=>x.id===afterId);if(i>=0)idx=i+1}t.blocks.splice(idx,0,b);scheduleTaskSave();rerenderBlocks((type==='divider'||type==='image')?null:b.id)}
function removeBlock(id){const t=curTask();if(!t)return;const i=t.blocks.findIndex(b=>b.id===id);if(i<0)return;t.blocks.splice(i,1);scheduleTaskSave();const prev=t.blocks[i-1];rerenderBlocks(prev&&prev.type!=='divider'&&prev.type!=='image'?prev.id:null)}
function rerenderBlocks(focusId){const t=curTask();const c=document.getElementById('blocks');if(!t||!c)return;c.innerHTML=t.blocks.map(b=>blockHTML(b)).join('');if(focusId){const el=document.querySelector(`[data-bid="${focusId}"]`);if(el)placeCaretEnd(el)}}
function blockKey(e,id){
  if(e.key==='Enter'&&!e.shiftKey){const b=findBlock(id);if(b&&b.type!=='script'){e.preventDefault();closeSlash();addBlock('text',id)}}
  else if(e.key==='Backspace'){if(e.target&&e.target.textContent===''){e.preventDefault();removeBlock(id)}}
  else if(e.key==='Escape'){closeSlash()}
  else if(e.key==='/'){setTimeout(()=>{const el=document.querySelector(`[data-bid="${id}"]`);if(el&&el.textContent==='/')openSlash(id,el,false)},0)}
}
function placeCaretEnd(el){try{el.focus();const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
const SLASH=[{t:'text',i:'¶',n:'نص',d:'فقرة عادية'},{t:'heading',i:'H',n:'عنوان',d:'عنوان عريض'},{t:'script',i:'🎬',n:'سكربت',d:'نص الفيديو'},{t:'todo',i:'☑',n:'مهمة فرعية',d:'بوكس تحقق'},{t:'image',i:'🖼️',n:'صورة',d:'رفع صورة'},{t:'divider',i:'—',n:'فاصل',d:'خط فاصل'}];
function openSlash(id,el,withDel){closeSlash();const r=el.getBoundingClientRect();const m=document.createElement('div');m.className='slash';m.id='slashMenu';m.style.top=(r.bottom+window.scrollY+4)+'px';m.style.right=Math.max(8,window.innerWidth-r.right)+'px';
  m.innerHTML=SLASH.map(s=>`<button onclick="applySlash('${id}','${s.t}')"><span class="si">${s.i}</span><span>${s.n}<div class="sd">${esc(s.d)}</div></span></button>`).join('')+(withDel?`<button onclick="removeBlock('${id}');closeSlash()"><span class="si">🗑</span><span style="color:var(--bad)">حذف البلوك</span></button>`:'');
  document.body.appendChild(m);setTimeout(()=>document.addEventListener('click',slashOutside),0)}
function slashOutside(e){if(!e.target.closest('#slashMenu')){closeSlash()}}
function closeSlash(){const m=document.getElementById('slashMenu');if(m)m.remove();document.removeEventListener('click',slashOutside)}
function blockMenu(e,id){e.stopPropagation();const el=e.currentTarget;openSlash(id,el,true)}
function applySlash(id,type){closeSlash();const t=curTask();const b=findBlock(id);if(!b||!t)return;
  if(type==='image'){b.type='text';b.html='';pickImageFor(id);return}
  if(type==='divider'){b.type='divider';delete b.html;scheduleTaskSave();rerenderBlocks(null);return}
  if(type==='todo'){b.type='todo';b.html='';b.done=false}else{b.type=type;b.html=''}
  scheduleTaskSave();rerenderBlocks(id);
}
function pickImage(){window.__imgTarget=null;document.getElementById('imgFile').click()}
function pickImageFor(id){window.__imgTarget=id;document.getElementById('imgFile').click()}
async function onImagePicked(e){const f=e.target.files[0];e.target.value='';if(!f)return;const t=curTask();if(!t)return;const st=document.getElementById('upStatus');if(st)st.textContent='⏳ جارٍ رفع الصورة…';
  try{const ext=(f.name.split('.').pop()||'png').toLowerCase();const path=`${USER.id}/${uid()}.${ext}`;
    const {error}=await sb.storage.from('task-images').upload(path,f,{upsert:false,contentType:f.type||'image/png'});if(error)throw error;
    const {data}=sb.storage.from('task-images').getPublicUrl(path);const url=data.publicUrl;
    const tgt=window.__imgTarget;if(tgt){const b=findBlock(tgt);if(b){b.type='image';b.url=url;delete b.html}}else{t.blocks.push({id:uid(),type:'image',url})}
    window.__imgTarget=null;if(st)st.textContent='✓ تم';setTimeout(()=>{if(st)st.textContent=''},1500);save();rerenderBlocks(null);
  }catch(err){if(st)st.textContent='';alert('تعذّر رفع الصورة: '+(err.message||err)+'\n\nتأكد من إنشاء bucket عام باسم «task-images» في Supabase → Storage.')}
}
function deleteTask(){const p=proj();const t=curTask();if(!p||!t)return;if(!confirm('حذف هذه المهمة؟'))return;p.tasks=p.tasks.filter(x=>x.id!==t.id);save();syncTasks();document.getElementById('modalRoot').innerHTML='';CUR_TASK=null;renderProjectDetail(p.id)}
function closeTask(){closeSlash();const t=curTask();if(t){document.querySelectorAll('#blocks [data-bid]').forEach(el=>{const b=(t.blocks||[]).find(x=>x.id===el.dataset.bid);if(b)b.html=el.innerHTML});const tt=document.getElementById('t_title');if(tt)t.title=tt.value}save();syncTasks();document.getElementById('modalRoot').innerHTML='';CUR_TASK=null;if(CUR_PROJ)renderProjectDetail(CUR_PROJ)}

  function body(){const sub=docTotal(d);const tax=d.vat?sub*(Number(d.vatRate||0)/100):0;
    return `<div class="row2"><div class="field"><label>العميل</label>${clientFieldHTML('d_client',resolveClientName(d))}</div>

/* ===== ZATCA QR ===== */
function tlv(tag,val){const b=new TextEncoder().encode(val);return [tag,b.length,...b]}
function zatcaBase64(seller,vatNo,iso,total,vat){const bytes=[...tlv(1,seller),...tlv(2,vatNo),...tlv(3,iso),...tlv(4,total),...tlv(5,vat)];let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function qrImg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createImgTag(4,8)}catch(e){return '<div style="font-size:9px;word-break:break-all;max-width:130px">'+esc(text)+'</div>'}}

function gcal(a){const st=new Date(a.datetime);const en=new Date(st.getTime()+(Number(a.duration)||60)*60000);const f=d=>d.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(a.title)}&dates=${f(st)}/${f(en)}&details=${encodeURIComponent(a.notes||'')}`}
function icsLocal(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00'}
function exportICS(id){
  const arr=id?S.appointments.filter(a=>a.id===id):S.appointments;
  if(!arr.length){alert('لا توجد مواعيد للتصدير');return}
  let L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//IbrahimSaud//Cowork//AR','CALSCALE:GREGORIAN'];
  arr.forEach(a=>{const st=new Date(a.datetime);const en=new Date(st.getTime()+(Number(a.duration)||60)*60000);
    L.push('BEGIN:VEVENT','UID:'+a.id+'@ibrahimsaud','DTSTAMP:'+icsLocal(new Date()),'DTSTART:'+icsLocal(st),'DTEND:'+icsLocal(en),'SUMMARY:'+(a.title||'موعد'));
    if(a.notes)L.push('DESCRIPTION:'+a.notes.replace(/\n/g,'\\n'));if(a.contact)L.push('LOCATION:'+a.contact);L.push('END:VEVENT')});
  L.push('END:VCALENDAR');
  const b=new Blob([L.join('\r\n')],{type:'text/calendar'});const aa=document.createElement('a');aa.href=URL.createObjectURL(b);aa.download=(id?'موعد':'مواعيد')+'-'+today()+'.ics';aa.click();
}

/* ===== CALENDAR (interactive) ===== */
let calRef=new Date();
function renderCalendar(){
  const y=calRef.getFullYear(),m=calRef.getMonth();
  const first=new Date(y,m,1);const start=new Date(first);start.setDate(1-first.getDay());
  const dows=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  const evs={};
  S.appointments.forEach(a=>{const k=(a.datetime||'').slice(0,10);(evs[k]=evs[k]||[]).push({t:a.title,c:'',click:`apptModal('${a.id}')`})});
  S.invoices.forEach(i=>{if(i.status==='unpaid'){(evs[i.date]=evs[i.date]||[]).push({t:'فاتورة #'+i.number,c:'inv',click:`docModal('invoice','${i.id}')`})}});
  let cells='';const tk=today();
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const other=d.getMonth()!==m;
    const ev=(evs[k]||[]).slice(0,3).map(e=>`<div class="cal-ev ${e.c}" onclick="event.stopPropagation();${e.click}">${esc(e.t)}</div>`).join('');
    const more=(evs[k]||[]).length>3?`<div style="font-size:10px;color:var(--muted)">+${(evs[k]||[]).length-3}</div>`:'';
    cells+=`<div class="cal-cell ${other?'other':''} ${k===tk?'today':''}" onclick="apptModal(null,'${k}')"><div class="d">${d.getDate()}</div>${ev}${more}</div>`;}
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>التقويم</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="exportICS()">📥 تصدير .ics</button><button class="btn btn-gold" onclick="apptModal()">+ موعد</button></div></div>
    <div class="badge-note">🗓️ <div>اضغط على أي يوم لإضافة موعد، واضغط على أي حدث لتعديله. صدّر .ics لاستيراد المواعيد في تقويم Apple/Google على جوالك.</div></div>
    <div class="cal-head"><button class="btn btn-ghost btn-sm" onclick="calMove(-1)">‹ السابق</button>
    <h3 style="margin:0">${calRef.toLocaleDateString('ar',{month:'long',year:'numeric'})}</h3>
    <button class="btn btn-ghost btn-sm" onclick="calMove(1)">التالي ›</button></div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
}
function calMove(n){calRef.setMonth(calRef.getMonth()+n);renderCalendar()}

  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>الإعدادات</h1><button class="btn btn-gold" onclick="saveSettings()"><i data-lucide="save"></i> حفظ الإعدادات</button></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px;align-items:start">

      <div class="card"><h3 style="margin-top:0"><i data-lucide="image"></i> الشعار والهوية</h3>
        <div class="logo-upload"><img id="logoPrev" src="${s.logo||LOGO}" onerror="this.style.display='none'"><div><button class="btn btn-ghost btn-sm" onclick="document.getElementById('logoFile').click()"><i data-lucide="upload"></i> رفع شعار</button><div style="color:var(--muted);font-size:12px;margin-top:6px">يظهر في القائمة والفواتير</div></div></div>
        <input type="file" id="logoFile" accept="image/*" class="hidden" onchange="uploadLogo(event)">
      </div>

      <div class="card"><h3 style="margin-top:0"><i data-lucide="building-2"></i> معلومات المؤسسة</h3>
        <div class="row2"><div class="field"><label>اسم المؤسسة</label><input id="s_brand" value="${esc(s.brand)}"></div><div class="field"><label>اسم المالك</label><input id="s_owner" value="${esc(s.owner)}"></div></div>
        <div class="row2"><div class="field"><label>البريد</label><input id="s_email" value="${esc(s.email)}"></div><div class="field"><label>الجوال</label><input id="s_phone" value="${esc(s.phone)}"></div></div>
        <div class="field"><label>العملة</label><input id="s_curr" value="${esc(s.currency)}"></div>
      </div>

      <div class="card"><h3 style="margin-top:0"><i data-lucide="receipt-text"></i> إعدادات الفواتير</h3>
        <div class="row2"><div class="field"><label>بادئة رقم الفاتورة</label><input id="s_prefix" value="${esc(s.invPrefix)}" placeholder="INV-"></div><div class="field"><label>الآيبان (IBAN)</label><input id="s_iban" value="${esc(s.iban)}"></div></div>
        <div class="field"><label>اسم البنك</label><input id="s_bank" value="${esc(s.bankName)}"></div>
        <div class="field"><label>الشروط/الملاحظات الافتراضية</label><textarea id="s_terms" rows="2">${esc(s.terms)}</textarea></div>
      </div>

      <div class="card"><h3 style="margin-top:0"><i data-lucide="badge-percent"></i> الضريبة وزاتكا</h3>
        <div class="badge-note"><i data-lucide="info"></i> <div>تظهر بيانات الضريبة ورمز QR في الفواتير. المرحلة الثانية لزاتكا تتطلب التسجيل وإصدار شهادة.</div></div>
        <div class="row2"><div class="field"><label>تفعيل الضريبة افتراضياً</label><select id="v_en"><option value="0" ${!v.enabled?'selected':''}>مغلقة</option><option value="1" ${v.enabled?'selected':''}>مفعّلة</option></select></div><div class="field"><label>نسبة الضريبة %</label><input type="number" id="v_rate" value="${v.rate}"></div></div>
        <div class="row2"><div class="field"><label>اسم البائع</label><input id="v_seller" value="${esc(v.sellerName)}"></div><div class="field"><label>الرقم الضريبي</label><input id="v_num" value="${esc(v.number)}"></div></div>
        <div class="row2"><div class="field"><label>السجل التجاري</label><input id="v_cr" value="${esc(v.cr)}"></div><div class="field"><label>العنوان</label><input id="v_addr" value="${esc(v.address)}"></div></div>
      </div>

      <div class="card"><h3 style="margin-top:0"><i data-lucide="shield-check"></i> الحساب والنسخ الاحتياطي</h3>
        <div class="field"><label>الحساب الحالي</label><input value="${esc((USER&&USER.email)||'')}" disabled></div>
        <div class="badge-note"><i data-lucide="cloud-check"></i> <div>بياناتك تُحفظ وتُزامن تلقائياً في السحابة (Supabase) لحظياً — لا حاجة لنسخ يدوي. تقدر أيضاً تنزّل نسخة JSON احتياطية.</div></div>
        <div class="toolbar"><button class="btn btn-ghost btn-sm" onclick="exportData()"><i data-lucide="download"></i> تنزيل نسخة JSON</button>
        <button class="btn btn-ghost btn-sm" onclick="logout()"><i data-lucide="log-out"></i> تسجيل الخروج</button></div>
      </div>

    </div>`;
  refreshIcons();
}
function uploadLogo(e){const f=e.target.files[0];if(!f)return;if(f.size>1500000){alert('حجم الصورة كبير (أقل من 1.5MB)');return}const r=new FileReader();r.onload=()=>{S.settings.logo=r.result;save();applyBranding();const p=document.getElementById('logoPrev');if(p){p.src=r.result;p.style.display='block'}alert('تم تحديث الشعار ✓')};r.readAsDataURL(f)}
function saveSettings(){const g=i=>document.getElementById(i).value;Object.assign(S.settings,{brand:g('s_brand'),owner:g('s_owner'),email:g('s_email'),phone:g('s_phone'),currency:g('s_curr'),invPrefix:g('s_prefix'),iban:g('s_iban'),bankName:g('s_bank'),terms:g('s_terms')});S.settings.vat={enabled:g('v_en')==='1',rate:Number(g('v_rate')),sellerName:g('v_seller'),number:g('v_num'),cr:g('v_cr'),address:g('v_addr')};save();applyBranding();alert('تم الحفظ ✓')}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-'+today()+'.json';a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(KEY,r.result);S=load();save();alert('تم الاستيراد ✓');go('settings')}catch(x){alert('ملف غير صالح')}};r.readAsText(f)}
function resetData(){if(confirm('مسح جميع البيانات نهائياً؟')){localStorage.removeItem(KEY);S=load();save();go('home')}}

/* ===== MODAL ===== */
function openModal(title,bodyHtml,onSave,onDelete){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-head"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot"><button class="btn btn-gold" id="mSave">حفظ</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
    ${onDelete?'<button class="btn btn-ghost" style="color:var(--bad);margin-right:auto" id="mDel">حذف</button>':''}</div></div></div>`;
  document.getElementById('mSave').onclick=onSave;if(onDelete)document.getElementById('mDel').onclick=onDelete;refreshIcons();
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function applyBranding(){const sl=document.querySelector('.logo-area img');if(sl)sl.src=S.settings.logo||LOGO}

sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){RECOVERY_MODE=true;showReset();return}
  if(event==='SIGNED_OUT'){USER=null;STATE_ID=null}
});
async function bootstrap(){
  const params=new URLSearchParams(location.search);
  const ft=params.get('ft');
  if(ft){return renderFreelancer(ft)}
  if(RECOVERY_MODE||/[#?&]type=recovery/.test(location.hash)||/[?&]type=recovery/.test(location.search)){RECOVERY_MODE=true;showReset();return}
  try{const {data}=await sb.auth.getSession();if(data&&data.session&&!RECOVERY_MODE){await enterApp(data.session.user);return}}catch(e){}
  const em=document.getElementById('em');if(em)em.focus();
}
bootstrap();
</script>
</body>
</html>
