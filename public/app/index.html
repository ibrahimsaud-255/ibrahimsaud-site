<style>
  :root{
    --bg:#0a0a0b; --panel:#141416; --panel2:#1d1d20; --panel3:#26262b; --line:#2c2c31;
    --ink:#f4f4f5; --muted:#9b9ba3; --gold:#f5a623; --gold2:#ffc24d; --goldsoft:rgba(245,166,35,.14);
    --good:#22c55e; --bad:#ef4444; --warn:#f59e0b; --info:#6366f1; --teal:#2dd4bf; --pink:#ec4899; --blue:#3b82f6;
    --radius:14px; --shadow:0 14px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .hidden{display:none !important}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--ink);font-family:inherit;font-size:15px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
  .btn{border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;transition:.15s}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1205}
  .btn-gold:hover{filter:brightness(1.08)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--gold)}
  .btn-sm{padding:7px 13px;font-size:13px;border-radius:8px}
  .wordmark{font-weight:900;letter-spacing:-.5px}
  .wordmark .w{color:#fff}.wordmark .g{color:var(--gold)}

  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:38px;box-shadow:var(--shadow);text-align:center}
  .login-box .wordmark{font-size:32px;margin-bottom:6px}
  .login-box p{color:var(--muted);margin:0 0 24px;font-size:14px}
  .field{margin-bottom:16px;text-align:right}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .lock-note{font-size:12px;color:var(--muted);margin-top:14px}

  /* ===== CUSTOM SHELL (sidebar) ===== */
  .shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
  .sidebar{background:#000;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
  .logo-area{padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .logo-area .wordmark{font-size:23px}
  .logo-area .tagline{color:var(--muted);font-size:12px;margin-top:3px;letter-spacing:.5px}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
  .nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer;border-right:3px solid transparent;transition:.12s}
  .nav a .nic{font-size:17px;width:22px;text-align:center;display:inline-flex;align-items:center;justify-content:center}
  .nav a .nic svg{width:19px;height:19px}
  .stat .ic svg{width:24px;height:24px}
  .quick button svg{width:16px;height:16px;vertical-align:-3px;margin-left:6px}
  .page-head h1 svg{width:22px;height:22px;vertical-align:-3px;margin-left:6px}
  .card h3 svg{width:18px;height:18px;vertical-align:-3px;margin-left:5px}
  .nav a:hover{background:var(--panel2);color:var(--ink)}
  .nav a.active{background:var(--goldsoft);color:var(--gold2);border-right-color:var(--gold)}
  .nav-foot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:3px}
  .nav-foot a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer}
  .nav-foot a:hover{background:var(--panel2);color:var(--ink)}
  .content{display:flex;flex-direction:column;min-height:100vh;min-width:0}
  .content-top{height:60px;background:#0d0d0f;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 24px;position:sticky;top:0;z-index:30}
  .ct-left{display:flex;align-items:center;gap:12px}
  .ct-title{font-weight:800;font-size:18px}
  .ct-date{color:var(--muted);font-size:13px}
  .menu-toggle{display:none;background:none;border:none;color:var(--ink);font-size:22px;cursor:pointer}
  /* branded home */
  .hero-card{background:linear-gradient(120deg,rgba(245,166,35,.18),rgba(245,166,35,.02));border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin-bottom:24px}
  .hero-card h1{margin:0 0 4px;font-size:26px}
  .hero-card p{margin:0;color:var(--muted)}
  .quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
  .oauth-row{display:flex;gap:10px;margin-top:14px}
  .oauth-row button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#1a1205;border:none;border-radius:10px;padding:11px;font-weight:700;font-size:14px;cursor:pointer}
  .oauth-row button.apple{background:#111;color:#fff;border:1px solid var(--line)}
  .oauth-row button:hover{filter:brightness(.95)}
  .sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
  .sep:before,.sep:after{content:"";height:1px;background:var(--line);flex:1}
  .logo-upload{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .logo-upload img{height:54px;border-radius:8px;background:#000;padding:4px}
  .quick button{background:#000;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 15px;font-weight:700;font-size:14px;cursor:pointer;transition:.12s}
  .quick button:hover{border-color:var(--gold);color:var(--gold2)}
  @media(max-width:860px){
    .shell{grid-template-columns:1fr}
    .sidebar{position:fixed;right:0;top:0;width:252px;z-index:60;transform:translateX(105%);transition:transform .2s;box-shadow:var(--shadow)}
    .sidebar.open{transform:translateX(0)}
    .menu-toggle{display:block}
  }

  .main{padding:26px 34px;max-width:1500px;margin:0 auto;width:100%}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
  .page-head h1{margin:0;font-size:24px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:26px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
  .stat:after{content:"";position:absolute;top:-20px;left:-20px;width:80px;height:80px;border-radius:50%;background:var(--goldsoft)}
  .stat .v{font-size:28px;font-weight:800}
  .stat .l{color:var(--muted);font-size:14px;margin-top:4px}
  .stat .ic{font-size:22px;position:absolute;top:16px;left:16px;opacity:.8}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .card h3{margin-top:0}

  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
  th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
  th{background:var(--panel2);color:var(--muted);font-weight:700;font-size:13px}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  .pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
  .pill.draft,.pill.lead{background:rgba(155,155,163,.16);color:var(--muted)}
  .pill.sent,.pill.contacted{background:rgba(99,102,241,.16);color:#a5b4fc}
  .pill.quoted,.pill.scheduled{background:rgba(59,130,246,.16);color:#93c5fd}
  .pill.accepted,.pill.paid,.pill.done,.pill.won{background:rgba(34,197,94,.16);color:#86efac}
  .pill.unpaid,.pill.progress{background:rgba(245,158,11,.16);color:#fcd34d}
  .pill.rejected,.pill.lost,.pill.cancelled{background:rgba(239,68,68,.16);color:#fca5a5}
  .kbadge{background:var(--panel3);color:var(--muted);border-radius:20px;font-size:12px;font-weight:700;padding:2px 9px}
  .empty{text-align:center;padding:48px 20px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius)}
  .empty .big{font-size:44px;margin-bottom:8px}
  .link-btn{background:none;border:none;color:var(--gold);font-weight:700;font-size:13px;padding:4px 7px}
  .link-btn.del{color:var(--bad)}
  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
  .badge-note{background:var(--goldsoft);border:1px solid var(--line);color:var(--gold2);border-radius:12px;padding:13px 16px;font-size:14px;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start}

  .kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
  .kcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px;min-width:250px;transition:.15s}
  .kcol.dragover{border-color:var(--gold);background:var(--panel2)}
  .kcol h4{margin:0 0 12px;display:flex;justify-content:space-between;font-size:14px;align-items:center;gap:6px}
  .kitem{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:grab}
  .kitem:hover{border-color:var(--gold)}
  .kitem.dragging{opacity:.4}
  .kitem .t{font-weight:700;margin-bottom:4px}
  .kitem .m{font-size:12px;color:var(--muted)}
  .kitem .val{color:var(--gold);font-weight:800;margin-top:6px}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;color:var(--muted);font-size:13px;font-weight:700;padding:6px}
  .cal-cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:96px;padding:7px;font-size:13px;cursor:pointer;transition:.12s}
  .cal-cell:hover{border-color:var(--gold)}
  .cal-cell.other{opacity:.4}
  .cal-cell.today{border-color:var(--gold)}
  .cal-cell .d{font-weight:700;color:var(--muted);margin-bottom:4px}
  .cal-ev{background:var(--goldsoft);color:var(--gold2);border-radius:6px;padding:2px 6px;font-size:11px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .cal-ev.inv{background:rgba(34,197,94,.16);color:#86efac}

  .task-line{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .task-line:last-child{border:none}
  .task-line input[type=checkbox]{width:auto}
  .task-line .done{text-decoration:line-through;color:var(--muted)}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60;padding:18px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:660px;max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
  .modal-head h3{margin:0}
  .modal-body{padding:22px}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;position:sticky;bottom:0;background:var(--panel);flex-wrap:wrap}
  .x{background:none;border:none;color:var(--muted);font-size:24px;line-height:1}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .items-tbl input{padding:8px}.items-tbl td{padding:5px}
  .totals{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .totals .line{display:flex;justify-content:space-between;padding:4px 0}
  .totals .grand{font-size:19px;font-weight:800;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;color:var(--gold)}
  @media(max-width:760px){
    .row2,.row3{grid-template-columns:1fr}
    .main{padding:16px}
    table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
    .content-top{padding:0 14px}
    .page-head h1{font-size:21px}
    .hero-card{padding:20px}
    .stat .v{font-size:24px}
    .modal-foot{flex-wrap:wrap}
    .btn{padding:12px 16px}
    .quick button{flex:1;min-width:120px}
  }
</style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-box">
    <img src="https://raw.githubusercontent.com/ibrahimsaud-255/ibrahimsaud-site/main/%D8%B4%D8%B9%D8%A7%D8%B1_%D8%A7%D9%95%D8%A8%D8%B1%D8%A7%D9%87%D9%8A%D9%85_%D8%B3%D8%B9%D9%88%D8%AF.png" alt="إبراهيم سعود" style="max-width:210px;width:72%;display:block;margin:0 auto 12px;border-radius:12px" onerror="this.style.display='none'">

</div>

<script>
/* ===== SUPABASE (cloud) ===== */
const SUPA_URL='https://rrerwhhxrjyzmnnjsfev.supabase.co';
const SUPA_KEY='sb_publishable_T-ka4hy2LVRjUuf0wUH9yA_g4Emxm13';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
let STATE_ID=null, USER=null, saveTimer=null;

/* ===== STATE ===== */
const KEY='ibsaud_erp_v1';
const def={
  settings:{brand:'إبراهيم سعود',owner:'إبراهيم سعود',email:'ibrahimsaud25@gmail.com',phone:'966504895213',
    currency:'ر.س',password:'admin',logo:'',invPrefix:'INV-',terms:'شكراً لتعاملكم. تُسدَّد الفاتورة خلال 14 يوماً.',bankName:'',iban:'',
    vat:{enabled:false,rate:15,number:'',sellerName:'إبراهيم سعود',address:'الرياض، السعودية',cr:''}},
  contacts:[],crm:[],sales:[],invoices:[],projects:[],appointments:[],freelancers:[],
  crmStages:[{key:'lead',label:'عميل محتمل'},{key:'contacted',label:'تم التواصل'},{key:'quoted',label:'عرض مُرسل'},{key:'won',label:'فوز'},{key:'lost',label:'خسارة'}],
  projectStages:[{key:'s1',label:'نفهم منتجك'},{key:'s2',label:'نكتب القصة'},{key:'s3',label:'نصوّر وننتج'},{key:'s4',label:'نسلّم ونطلق'},{key:'done',label:'منجز'}],
  counters:{sale:1000,invoice:1000}
};
let S=load();
function load(){let s;try{const r=localStorage.getItem(KEY);s=r?deepMerge(JSON.parse(JSON.stringify(def)),JSON.parse(r)):JSON.parse(JSON.stringify(def))}catch(e){s=JSON.parse(JSON.stringify(def))}
  if(!s.crmStages||!s.crmStages.length)s.crmStages=JSON.parse(JSON.stringify(def.crmStages));
  if(!s.projectStages||!s.projectStages.length)s.projectStages=JSON.parse(JSON.stringify(def.projectStages));
  (s.crm||[]).forEach(o=>{if(!o.stageKey)o.stageKey=o.stage||s.crmStages[0].key});
  (s.projects||[]).forEach(p=>{if(!p.stageKey){const m=s.projectStages.find(x=>x.label===p.stage);p.stageKey=p.status==='done'?'done':(m?m.key:s.projectStages[0].key)}});
  return s;}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=deepMerge(a[k]||{},b[k])}else a[k]=b[k]}return a}
function save(){localStorage.setItem(KEY,JSON.stringify(S));scheduleCloudSave()}
function scheduleCloudSave(){if(!USER)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveCloud,800)}
async function saveCloud(){if(!USER||!STATE_ID)return;try{const{freelancers,...rest}=S;await sb.from('app_state').update({data:rest,updated_at:new Date().toISOString()}).eq('id',STATE_ID);const d=document.getElementById('syncDot');if(d){d.style.color='var(--good)';d.title='تمت المزامنة';}}catch(e){const d=document.getElementById('syncDot');if(d){d.style.color='var(--bad)';d.title='تعذّرت المزامنة'}}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+S.settings.currency;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== AUTH (Supabase) ===== */

/* ===== HELPERS ===== */
function docTotal(d){return (d.items||[]).reduce((a,it)=>a+(Number(it.qty||0)*Number(it.price||0)),0)}
function invVat(inv){return inv.vat?docTotal(inv)*(Number(inv.vatRate||0)/100):0}
function invTotal(inv){return docTotal(inv)+invVat(inv)}
const ST={draft:'مسودة',sent:'مُرسل',accepted:'مقبول',rejected:'مرفوض',paid:'مدفوعة',unpaid:'غير مدفوعة',scheduled:'مجدول',done:'تم',cancelled:'ملغى'};
function pill(s){return `<span class="pill ${s}">${ST[s]||s}</span>`}
function miniList(arr,fn,empty){if(!arr.length)return `<p style="color:var(--muted)">${empty}</p>`;return arr.map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)">${fn(x)}</div>`).join('')}
function contactName(id){const c=S.contacts.find(c=>c.id===id);return c?c.name:''}
function emptyBox(ic,txt){return `<div class="empty"><div class="big">${ic}</div>${txt}</div>`}
function delItem(coll,id,cb){if(!confirm('تأكيد الحذف؟'))return;S[coll]=S[coll].filter(x=>x.id!==id);save();closeModal();cb&&cb()}

/* ===== DRAG & DROP (kanban) ===== */
let DRAG=null;
function dstart(e,coll,id){DRAG={coll,id};e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move'}
function dend(e){e.currentTarget.classList.remove('dragging')}
function dover(e){e.preventDefault();e.currentTarget.classList.add('dragover')}
function dleave(e){e.currentTarget.classList.remove('dragover')}
function ddrop(e,coll,stageKey){e.preventDefault();e.currentTarget.classList.remove('dragover');if(DRAG&&DRAG.coll===coll){const it=S[coll].find(x=>x.id===DRAG.id);if(it&&it.stageKey!==stageKey){it.stageKey=stageKey;save();if(coll==='projects')syncTasks();rerender()}}DRAG=null}

/* ===== STAGE EDITOR ===== */
function stageEditor(stagesKey,coll){
  let stages=JSON.parse(JSON.stringify(S[stagesKey]));
  function body(){return `<p style="color:var(--muted);font-size:13px;margin-top:0">أضف أو احذف أو رتّب المراحل. البطاقات في المرحلة المحذوفة تنتقل لأول مرحلة.</p>`+
    stages.map((s,i)=>`<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
      <input value="${esc(s.label)}" oninput="stEdit(${i},this.value)" style="flex:1">
      <button class="link-btn" onclick="stMove(${i},-1)">▲</button><button class="link-btn" onclick="stMove(${i},1)">▼</button>
      <button class="link-btn del" onclick="stDel(${i})">حذف</button></div>`).join('')+
    `<button class="btn btn-ghost btn-sm" onclick="stAdd()">+ مرحلة جديدة</button>`}
  openModal('تعديل المراحل',body(),()=>{if(!stages.length){alert('أضف مرحلة واحدة على الأقل');return}const keys=stages.map(s=>s.key);S[coll].forEach(it=>{if(!keys.includes(it.stageKey))it.stageKey=keys[0]});S[stagesKey]=stages;save();closeModal();rerender()});
  window.stEdit=(i,v)=>{stages[i].label=v};
  window.stAdd=()=>{stages.push({key:uid(),label:'مرحلة جديدة'});refresh()};
  window.stDel=(i)=>{stages.splice(i,1);refresh()};
  window.stMove=(i,d)=>{const j=i+d;if(j<0||j>=stages.length)return;[stages[i],stages[j]]=[stages[j],stages[i]];refresh()};
  function refresh(){document.querySelector('#modalRoot .modal-body').innerHTML=body()}
}

/* ===== GENERIC KANBAN ===== */
function renderKanban(cfg){
  const stages=S[cfg.stagesKey];
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>${cfg.title}</h1><div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="stageEditor('${cfg.stagesKey}','${cfg.coll}')">⚙ تعديل المراحل</button>
      <button class="btn btn-gold" onclick="${cfg.onAdd}">+ ${cfg.addLabel}</button></div></div>
    ${cfg.note||''}
    ${!S[cfg.coll].length?emptyBox(cfg.emptyIcon,cfg.emptyText):
    `<div class="kanban">${stages.map(st=>{
      const items=S[cfg.coll].filter(it=>it.stageKey===st.key);
      const sum=cfg.valueField?items.reduce((a,it)=>a+Number(it[cfg.valueField]||0),0):null;
      return `<div class="kcol" ondragover="dover(event)" ondragleave="dleave(event)" ondrop="ddrop(event,'${cfg.coll}','${st.key}')">
        <h4><span>${esc(st.label)}</span><span class="kbadge">${items.length}</span></h4>
        ${sum!=null?`<div style="font-size:12px;color:var(--gold);margin-bottom:8px">${money(sum)}</div>`:''}
        ${items.map(it=>`<div class="kitem" draggable="true" ondragstart="dstart(event,'${cfg.coll}','${it.id}')" ondragend="dend(event)" onclick="${cfg.onOpen}('${it.id}')">${cfg.card(it)}</div>`).join('')||'<p style="color:var(--muted);font-size:12px">اسحب بطاقة هنا</p>'}
      </div>`}).join('')}</div>`}`;
}

/* ===== ZATCA QR ===== */
function tlv(tag,val){const b=new TextEncoder().encode(val);return [tag,b.length,...b]}
function zatcaBase64(seller,vatNo,iso,total,vat){const bytes=[...tlv(1,seller),...tlv(2,vatNo),...tlv(3,iso),...tlv(4,total),...tlv(5,vat)];let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function qrImg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createImgTag(4,8)}catch(e){return '<div style="font-size:9px;word-break:break-all;max-width:130px">'+esc(text)+'</div>'}}

  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>المواعيد</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="exportICS()">📥 تصدير الكل .ics</button><button class="btn btn-gold" onclick="apptModal()">+ موعد</button></div></div>
    <div class="badge-note">📲 <div>اضغط «.ics» أو «Google» لكل موعد لإضافته إلى تقويم جوالك (Apple / Google). المزامنة اللحظية ثنائية الاتجاه تحتاج نسخة قاعدة البيانات (خطوة لاحقة).</div></div>
    ${!list.length?emptyBox('📆','لا توجد مواعيد بعد.'):
    `<table><thead><tr><th>الموعد</th><th>العنوان</th><th>مع</th><th>المدة</th><th>الحالة</th><th>التقويم</th><th></th></tr></thead><tbody>
    ${list.map(a=>`<tr><td>${(a.datetime||'').replace('T',' ')}</td><td>${esc(a.title)}</td><td>${esc(a.contact||'—')}</td><td>${esc(a.duration||'')} د</td><td>${pill(a.status||'scheduled')}</td>
    <td style="white-space:nowrap"><a class="link-btn" href="${gcal(a)}" target="_blank">Google</a><button class="link-btn" onclick="exportICS('${a.id}')">.ics</button></td>
    <td style="white-space:nowrap"><button class="link-btn" onclick="apptModal('${a.id}')">تعديل</button><button class="link-btn del" onclick="delItem('appointments','${a.id}',renderAppointments)">حذف</button></td></tr>`).join('')}
    </tbody></table>`}`;
}
function apptModal(id,presetDate){
  let a=id?{...S.appointments.find(x=>x.id===id)}:{id:'',title:'',contact:'',datetime:(presetDate?presetDate+'T10:00':new Date().toISOString().slice(0,16)),duration:60,status:'scheduled',notes:''};
  openModal(id?'تعديل موعد':'موعد جديد',`
    <div class="field"><label>العنوان</label><input id="a_title" value="${esc(a.title)}" placeholder="مثال: تصوير في موقع العميل"></div>
    <div class="row2"><div class="field"><label>التاريخ والوقت</label><input type="datetime-local" id="a_dt" value="${a.datetime}"></div>
    <div class="field"><label>المدة (دقائق)</label><input type="number" id="a_dur" value="${a.duration}"></div></div>
    <div class="row2"><div class="field"><label>مع (العميل)</label><input id="a_contact" value="${esc(a.contact)}"></div>
    <div class="field"><label>الحالة</label><select id="a_status">${['scheduled','done','cancelled'].map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${ST[s]}</option>`).join('')}</select></div></div>
    <div class="field"><label>ملاحظات</label><textarea id="a_notes" rows="2">${esc(a.notes)}</textarea></div>`,
  ()=>{const g=i=>document.getElementById(i).value;a.title=g('a_title');a.datetime=g('a_dt');a.duration=g('a_dur');a.contact=g('a_contact');a.status=g('a_status');a.notes=g('a_notes');if(!a.title.trim()){alert('أدخل العنوان');return}if(id){const i=S.appointments.findIndex(x=>x.id===id);S.appointments[i]=a}else{a.id=uid();S.appointments.push(a)}save();closeModal();rerender()},id?()=>delItem('appointments',id,rerender):null);
}
function gcal(a){const st=new Date(a.datetime);const en=new Date(st.getTime()+(Number(a.duration)||60)*60000);const f=d=>d.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(a.title)}&dates=${f(st)}/${f(en)}&details=${encodeURIComponent(a.notes||'')}`}
function icsLocal(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00'}
function exportICS(id){
  const arr=id?S.appointments.filter(a=>a.id===id):S.appointments;
  if(!arr.length){alert('لا توجد مواعيد للتصدير');return}
  let L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//IbrahimSaud//Cowork//AR','CALSCALE:GREGORIAN'];
  arr.forEach(a=>{const st=new Date(a.datetime);const en=new Date(st.getTime()+(Number(a.duration)||60)*60000);
    L.push('BEGIN:VEVENT','UID:'+a.id+'@ibrahimsaud','DTSTAMP:'+icsLocal(new Date()),'DTSTART:'+icsLocal(st),'DTEND:'+icsLocal(en),'SUMMARY:'+(a.title||'موعد'));
    if(a.notes)L.push('DESCRIPTION:'+a.notes.replace(/\n/g,'\\n'));if(a.contact)L.push('LOCATION:'+a.contact);L.push('END:VEVENT')});
  L.push('END:VCALENDAR');
  const b=new Blob([L.join('\r\n')],{type:'text/calendar'});const aa=document.createElement('a');aa.href=URL.createObjectURL(b);aa.download=(id?'موعد':'مواعيد')+'-'+today()+'.ics';aa.click();
}

/* ===== CALENDAR (interactive) ===== */
let calRef=new Date();
function renderCalendar(){
  const y=calRef.getFullYear(),m=calRef.getMonth();
  const first=new Date(y,m,1);const start=new Date(first);start.setDate(1-first.getDay());
  const dows=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  const evs={};
  S.appointments.forEach(a=>{const k=(a.datetime||'').slice(0,10);(evs[k]=evs[k]||[]).push({t:a.title,c:'',click:`apptModal('${a.id}')`})});
  S.invoices.forEach(i=>{if(i.status==='unpaid'){(evs[i.date]=evs[i.date]||[]).push({t:'فاتورة #'+i.number,c:'inv',click:`docModal('invoice','${i.id}')`})}});
  let cells='';const tk=today();
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const other=d.getMonth()!==m;
    const ev=(evs[k]||[]).slice(0,3).map(e=>`<div class="cal-ev ${e.c}" onclick="event.stopPropagation();${e.click}">${esc(e.t)}</div>`).join('');
    const more=(evs[k]||[]).length>3?`<div style="font-size:10px;color:var(--muted)">+${(evs[k]||[]).length-3}</div>`:'';
    cells+=`<div class="cal-cell ${other?'other':''} ${k===tk?'today':''}" onclick="apptModal(null,'${k}')"><div class="d">${d.getDate()}</div>${ev}${more}</div>`;}
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>التقويم</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="exportICS()">📥 تصدير .ics</button><button class="btn btn-gold" onclick="apptModal()">+ موعد</button></div></div>
    <div class="badge-note">🗓️ <div>اضغط على أي يوم لإضافة موعد، واضغط على أي حدث لتعديله. صدّر .ics لاستيراد المواعيد في تقويم Apple/Google على جوالك.</div></div>
    <div class="cal-head"><button class="btn btn-ghost btn-sm" onclick="calMove(-1)">‹ السابق</button>
    <h3 style="margin:0">${calRef.toLocaleDateString('ar',{month:'long',year:'numeric'})}</h3>
    <button class="btn btn-ghost btn-sm" onclick="calMove(1)">التالي ›</button></div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
}
function calMove(n){calRef.setMonth(calRef.getMonth()+n);renderCalendar()}

/* ===== DASHBOARDS ===== */
function renderDashboards(){
  const paid=S.invoices.filter(i=>i.status==='paid').reduce((a,i)=>a+invTotal(i),0);
  const due=S.invoices.filter(i=>i.status==='unpaid').reduce((a,i)=>a+invTotal(i),0);
  const pipe=S.crm.reduce((a,c)=>a+Number(c.value||0),0);
  const won=S.crm.filter(c=>c.stageKey==='won').length;
  const months=[];const now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:d.toISOString().slice(0,7),lbl:d.toLocaleDateString('ar',{month:'short'}),v:0})}
  S.invoices.filter(i=>i.status==='paid').forEach(i=>{const k=(i.paidDate||i.date||'').slice(0,7);const mm=months.find(x=>x.k===k);if(mm)mm.v+=invTotal(i)});
  const max=Math.max(1,...months.map(m=>m.v));
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>لوحات البيانات</h1><span style="color:var(--muted)">${today()}</span></div>
    <div class="stats">
      <div class="stat"><span class="ic"><i data-lucide="wallet"></i></span><div class="v">${money(paid)}</div><div class="l">إجمالي المحصّل</div></div>
      <div class="stat"><span class="ic"><i data-lucide="hourglass"></i></span><div class="v">${money(due)}</div><div class="l">مستحقات غير مدفوعة</div></div>
      <div class="stat"><span class="ic"><i data-lucide="target"></i></span><div class="v">${money(pipe)}</div><div class="l">قيمة الفرص</div></div>
      <div class="stat"><span class="ic"><i data-lucide="trophy"></i></span><div class="v">${won}</div><div class="l">صفقات مكسوبة</div></div>
    </div>
    <div class="grid">
      <div class="card" style="grid-column:span 2;min-width:300px"><h3>الإيرادات المحصّلة — آخر 6 أشهر</h3>
        <div style="display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px">
        ${months.map(m=>`<div style="flex:1;text-align:center"><div style="height:${Math.round(m.v/max*130)}px;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:7px 7px 0 0;min-height:3px"></div><div style="font-size:11px;color:var(--muted);margin-top:6px">${m.lbl}</div><div style="font-size:11px">${m.v?Math.round(m.v):''}</div></div>`).join('')}</div></div>
      <div class="card"><h3>آخر الفواتير</h3>${miniList(S.invoices.slice(-5).reverse(),i=>`${esc(i.client)} — ${money(invTotal(i))} ${pill(i.status)}`,'لا فواتير')}</div>
      <div class="card"><h3>مهام معلّقة</h3>${miniList(S.projects.flatMap(p=>(p.tasks||[]).filter(t=>!t.done).map(t=>esc(t.title))).slice(0,6),x=>x,'لا مهام')}</div>
      <div class="card"><h3>مواعيد قادمة</h3>${miniList(S.appointments.filter(a=>a.datetime>=new Date().toISOString()).sort((a,b)=>a.datetime.localeCompare(b.datetime)).slice(0,5),a=>`${esc(a.title)} — ${a.datetime.replace('T',' ')}`,'لا مواعيد')}</div>
    </div>`;
}

/* ===== SETTINGS ===== */
function renderSettings(){
  const s=S.settings;const v=s.vat;
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>الإعدادات</h1><button class="btn btn-gold" onclick="saveSettings()"><i data-lucide="save"></i> حفظ الإعدادات</button></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px;align-items:start">

      <div class="card"><h3 style="margin-top:0"><i data-lucide="image"></i> الشعار والهوية</h3>
        <div class="logo-upload"><img id="logoPrev" src="${s.logo||LOGO}" onerror="this.style.display='none'"><div><button class="btn btn-ghost btn-sm" onclick="document.getElementById('logoFile').click()"><i data-lucide="upload"></i> رفع شعار</button><div style="color:var(--muted);font-size:12px;margin-top:6px">يظهر في القائمة والفواتير</div></div></div>
        <input type="file" id="logoFile" accept="image/*" class="hidden" onchange="uploadLogo(event)">
      </div>

      <div class="card"><h3 style="margin-top:0"><i data-lucide="building-2"></i> معلومات المؤسسة</h3>
        <div class="row2"><div class="field"><label>اسم المؤسسة</label><input id="s_brand" value="${esc(s.brand)}"></div><div class="field"><label>اسم المالك</label><input id="s_owner" value="${esc(s.owner)}"></div></div>
        <div class="row2"><div class="field"><label>البريد</label><input id="s_email" value="${esc(s.email)}"></div><div class="field"><label>الجوال</label><input id="s_phone" value="${esc(s.phone)}"></div></div>
        <div class="field"><label>العملة</label><input id="s_curr" value="${esc(s.currency)}"></div>
      </div>

      <div class="card"><h3 style="margin-top:0"><i data-lucide="receipt-text"></i> إعدادات الفواتير</h3>
        <div class="row2"><div class="field"><label>بادئة رقم الفاتورة</label><input id="s_prefix" value="${esc(s.invPrefix)}" placeholder="INV-"></div><div class="field"><label>الآيبان (IBAN)</label><input id="s_iban" value="${esc(s.iban)}"></div></div>
        <div class="field"><label>اسم البنك</label><input id="s_bank" value="${esc(s.bankName)}"></div>
        <div class="field"><label>الشروط/الملاحظات الافتراضية</label><textarea id="s_terms" rows="2">${esc(s.terms)}</textarea></div>
      </div>

      <div class="card"><h3 style="margin-top:0"><i data-lucide="badge-percent"></i> الضريبة وزاتكا</h3>
        <div class="badge-note"><i data-lucide="info"></i> <div>تظهر بيانات الضريبة ورمز QR في الفواتير. المرحلة الثانية لزاتكا تتطلب التسجيل وإصدار شهادة.</div></div>
        <div class="row2"><div class="field"><label>تفعيل الضريبة افتراضياً</label><select id="v_en"><option value="0" ${!v.enabled?'selected':''}>مغلقة</option><option value="1" ${v.enabled?'selected':''}>مفعّلة</option></select></div><div class="field"><label>نسبة الضريبة %</label><input type="number" id="v_rate" value="${v.rate}"></div></div>
        <div class="row2"><div class="field"><label>اسم البائع</label><input id="v_seller" value="${esc(v.sellerName)}"></div><div class="field"><label>الرقم الضريبي</label><input id="v_num" value="${esc(v.number)}"></div></div>
        <div class="row2"><div class="field"><label>السجل التجاري</label><input id="v_cr" value="${esc(v.cr)}"></div><div class="field"><label>العنوان</label><input id="v_addr" value="${esc(v.address)}"></div></div>
      </div>

      <div class="card"><h3 style="margin-top:0"><i data-lucide="shield-check"></i> الحساب والنسخ الاحتياطي</h3>
        <div class="field"><label>الحساب الحالي</label><input value="${esc((USER&&USER.email)||'')}" disabled></div>
        <div class="badge-note"><i data-lucide="cloud-check"></i> <div>بياناتك تُحفظ وتُزامن تلقائياً في السحابة (Supabase) لحظياً — لا حاجة لنسخ يدوي. تقدر أيضاً تنزّل نسخة JSON احتياطية.</div></div>
        <div class="toolbar"><button class="btn btn-ghost btn-sm" onclick="exportData()"><i data-lucide="download"></i> تنزيل نسخة JSON</button>
        <button class="btn btn-ghost btn-sm" onclick="logout()"><i data-lucide="log-out"></i> تسجيل الخروج</button></div>
      </div>

    </div>`;
  refreshIcons();
}
function uploadLogo(e){const f=e.target.files[0];if(!f)return;if(f.size>1500000){alert('حجم الصورة كبير (أقل من 1.5MB)');return}const r=new FileReader();r.onload=()=>{S.settings.logo=r.result;save();applyBranding();const p=document.getElementById('logoPrev');if(p){p.src=r.result;p.style.display='block'}alert('تم تحديث الشعار ✓')};r.readAsDataURL(f)}
function saveSettings(){const g=i=>document.getElementById(i).value;Object.assign(S.settings,{brand:g('s_brand'),owner:g('s_owner'),email:g('s_email'),phone:g('s_phone'),currency:g('s_curr'),invPrefix:g('s_prefix'),iban:g('s_iban'),bankName:g('s_bank'),terms:g('s_terms')});S.settings.vat={enabled:g('v_en')==='1',rate:Number(g('v_rate')),sellerName:g('v_seller'),number:g('v_num'),cr:g('v_cr'),address:g('v_addr')};save();applyBranding();alert('تم الحفظ ✓')}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-'+today()+'.json';a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(KEY,r.result);S=load();save();alert('تم الاستيراد ✓');go('settings')}catch(x){alert('ملف غير صالح')}};r.readAsText(f)}
function resetData(){if(confirm('مسح جميع البيانات نهائياً؟')){localStorage.removeItem(KEY);S=load();save();go('home')}}

/* ===== MODAL ===== */
function openModal(title,bodyHtml,onSave,onDelete){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-head"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot"><button class="btn btn-gold" id="mSave">حفظ</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
    ${onDelete?'<button class="btn btn-ghost" style="color:var(--bad);margin-right:auto" id="mDel">حذف</button>':''}</div></div></div>`;
  document.getElementById('mSave').onclick=onSave;if(onDelete)document.getElementById('mDel').onclick=onDelete;refreshIcons();
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function applyBranding(){const sl=document.querySelector('.logo-area img');if(sl)sl.src=S.settings.logo||LOGO}

async function bootstrap(){
  const params=new URLSearchParams(location.search);
  const ft=params.get('ft');
  if(ft){return renderFreelancer(ft)}
  try{const {data}=await sb.auth.getSession();if(data&&data.session){await enterApp(data.session.user);return}}catch(e){}
  const em=document.getElementById('em');if(em)em.focus();
}
bootstrap();
</script>
</body>
