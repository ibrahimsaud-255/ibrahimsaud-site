// حفظ/جدولة/إرسال حملة من المحرّر — action: 'draft' | 'schedule' | 'now'
async function nlCompose(action){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const subject=g('nl_subject').trim();const raw=g('nl_html').trim();const cover=g('nl_cover').trim();const url=g('nl_url').trim();
  if(!subject||!raw){alert('اكتب العنوان والمحتوى، أو حمّل تدوينة');return}
  if(NL.campaigns===null){alert('جدول الحملات غير مفعّل. شغّل supabase/newsletter.sql في Supabase أولاً.');return}
  const st=document.getElementById('nl_status');
  const row={subject,content_html:nlToHtml(raw),cover_url:cover||null,cta_url:url||null};
  if(action==='schedule'){
    const w=g('nl_when').trim();if(!w){alert('اختر موعد الجدولة أولاً');return}
    const d=new Date(w);if(isNaN(d.getTime())){alert('موعد غير صالح');return}
    if(d.getTime()<Date.now()+30000){alert('اختر وقتاً في المستقبل');return}
    row.status='scheduled';row.scheduled_at=d.toISOString();
  }else if(action==='now'){
    const active=(NL.subs||[]).filter(s=>!s.unsubscribed).length;
    if(!confirm('إرسال «'+subject+'» الآن إلى '+active+' مشترك؟'))return;
    row.status='scheduled';row.scheduled_at=new Date().toISOString();
  }else{row.status='draft';row.scheduled_at=null;}
  if(st){st.className='msg';st.textContent='…جارٍ الحفظ'}
  try{
    let id=NL.editId;
    if(id){const {error}=await sb.from('newsletter_campaigns').update(row).eq('id',id);if(error)throw error;}
    else{const {data,error}=await sb.from('newsletter_campaigns').insert(row).select('id').single();if(error)throw error;id=data.id;}
    if(action==='now'){
      if(st){st.textContent='…جارٍ الإرسال'}
      const res=await nlSend({campaignId:id});
      if(st){st.className='msg ok';st.textContent=res.skipped?'الحملة أُرسلت مسبقاً':('تم الإرسال: '+(res.sent||0)+' ✓'+(res.failed?(' — فشل '+res.failed):''))}
    }else if(action==='schedule'){if(st){st.className='msg ok';st.textContent='تمت الجدولة ✓ ستُرسل تلقائياً في الموعد'}}
    else{if(st){st.className='msg ok';st.textContent='حُفظت كمسودّة ✓'}}
    nlClearCompose(true);
    setTimeout(()=>nlLoad(true),action==='now'?500:250);
  }catch(e){if(st){st.className='msg err';st.textContent='تعذّر: '+(e.message||e)}}
}
function nlClearCompose(keepStatus){NL.editId=null;const g=id=>document.getElementById(id);['nl_subject','nl_html','nl_cover','nl_url','nl_when'].forEach(k=>{if(g(k))g(k).value=''});if(!keepStatus)renderNewsletter();}
function nlEditCamp(id){NL.editId=id;renderNewsletter();try{document.getElementById('nl_subject').scrollIntoView({behavior:'smooth',block:'center'})}catch(_){}}
async function nlSendNow(id){const active=(NL.subs||[]).filter(s=>!s.unsubscribed).length;if(!confirm('إرسال هذه الحملة الآن إلى '+active+' مشترك؟'))return;try{const res=await nlSend({campaignId:id});alert(res.skipped?'الحملة أُرسلت أو أُلغيت مسبقاً':('تم الإرسال: '+(res.sent||0)+' ✓'+(res.failed?(' — فشل '+res.failed):'')));}catch(e){alert('تعذّر الإرسال: '+(e.message||e));}nlLoad(true);}
async function nlCancelCamp(id){if(!confirm('إلغاء جدولة هذه الحملة؟'))return;const {error}=await sb.from('newsletter_campaigns').update({status:'canceled'}).eq('id',id).in('status',['scheduled','draft']);if(error){alert('تعذّر الإلغاء: '+error.message);return}nlLoad(true);}
function nlDupCamp(id){const c=(NL.campaigns||[]).find(x=>x.id===id);if(!c)return;NL.editId=null;renderNewsletter();const g=i=>document.getElementById(i);if(g('nl_subject'))g('nl_subject').value=c.subject||'';if(g('nl_html'))g('nl_html').value=c.content_html||'';if(g('nl_cover'))g('nl_cover').value=c.cover_url||'';if(g('nl_url'))g('nl_url').value=c.cta_url||'';try{g('nl_subject').scrollIntoView({behavior:'smooth',block:'center'})}catch(_){}}
async function nlDelCamp(id){if(!confirm('حذف هذه الحملة نهائياً؟'))return;const {error}=await sb.from('newsletter_campaigns').delete().eq('id',id);if(error){alert('تعذّر الحذف: '+error.message);return}if(NL.editId===id)NL.editId=null;nlLoad(true);}
async function nlDelSub(id){if(!confirm('حذف هذا المشترك؟'))return;const {error}=await sb.from('subscribers').delete().eq('id',id);if(error){alert('تعذّر الحذف: '+error.message);return}await nlLoad(true);}

        <h4><span>${esc(st.label)}</span><span class="kbadge">${items.length}</span></h4>
        ${items.map(t=>`<div class="ktask" draggable="true" ondragstart="tdstart(event,'${t.id}')" ondragend="tdend(event)" onclick="openTask('${t.id}')">
          <div class="tt">${esc(t.title)}</div>
          <div class="meta">${(t.blocks&&t.blocks.length)?`<span class="kbadge"><i class="inl" data-lucide="file-text"></i> ${t.blocks.length}</span>`:''}${t.assignee?`<span class="kbadge" style="color:var(--gold);background:var(--goldsoft)"><i class="inl" data-lucide="user"></i> ${esc(flName(t.assignee))}</span>`:''}</div>
        </div>`).join('')}
        <button class="addtask" onclick="quickAddTask('${st.key}')">+ مهمة</button>
      </div>`}).join('')}
    </div>`;
  refreshIcons();loadRoomPanel(p);
}

/* ===== غرفة المشروع (لوحة المالك) ===== */
const RBASE=location.origin+location.pathname.replace(/index\.html$/,'')+'r.html';
function roomLink(kind,token){return RBASE+'?'+(kind==='client'?'c':'ft')+'='+token}
function copyTxt(t){navigator.clipboard.writeText(t).then(()=>alert('تم النسخ:\n'+t)).catch(()=>prompt('انسخ:',t))}
async function loadRoomPanel(p){
  const el=document.getElementById('roomPanel');if(!el)return;
  const {data:rooms}=await sb.from('project_rooms').select('*').eq('project_id',p.id).limit(1);
  const room=rooms&&rooms[0];
  const {data:tasks}=await sb.from('tasks').select('*').eq('project_id',p.id);
  const ids=(tasks||[]).map(t=>t.id);let revs=[];
  if(ids.length){const {data:rv}=await sb.from('revisions').select('task_id,num,billable,status').in('task_id',ids);revs=rv||[]}
  if(document.getElementById('roomPanel')){document.getElementById('roomPanel').innerHTML=roomPanelHTML(p,room,tasks||[],revs);refreshIcons();}
}

    <div class="pd-meta" style="margin-top:0"><span><i class="inl" data-lucide="user"></i> ${esc(room.client_name||'—')}</span><span><i class="inl" data-lucide="package"></i> تعديلات مجانية: <b>${room.revisions_included}</b></span></div>
    <div class="linkrow" style="margin-top:10px">

      <a class="link-btn" href="${cl}" target="_blank">فتح</a>

      <button class="link-btn" onclick="addPodcastDeliverables('${p.id}')"><i class="inl" data-lucide="mic"></i> أضف مخرجات حلقة بودكاست</button>
    </div>
    <div style="margin-top:12px">

        </div>

// مخرجات حلقة البودكاست القياسية — تُضاف كمهام/تسليمات للمشروع بضغطة
const PODCAST_DELIVERABLES=['الحلقة الكاملة (مونتاج)','١٠ مقاطع قصيرة','تصاميم إنستقرام','ثمبنيل يوتيوب','إعلان الضيف + صورته'];
async function addPodcastDeliverables(pid){const p=S.projects.find(x=>x.id===pid);if(!p)return;

// المالك يضيف/يعدّل رابط المخرَج (Drive/يوتيوب) وعنوانه مباشرة — يظهر فوراً في رابط العميل
function setDeliverable(pid,taskId){
  const p=S.projects.find(x=>x.id===pid);const lt=p&&(p.tasks||[]).find(t=>t.id===taskId);

      <div class="field"><label>رابط المخرَج (Google Drive / يوتيوب / WeTransfer)</label><input id="dl_url" value="${esc(dt.version_url||'')}" placeholder="https://drive.google.com/..."></div>
      <div class="field"><label>ملاحظة مع التسليم (اختياري)</label><input id="dl_note" value="${esc(dt.version_note||'')}"></div>
      <div class="badge-note" style="margin-top:4px"><i data-lucide="link"></i> <div>هذا الرابط يظهر للعميل مباشرة في رابط الغرفة ليعتمده أو يطلب تعديلاً.</div></div>`,
    async()=>{const g=i=>document.getElementById(i).value;const title=g('dl_title').trim();const url=g('dl_url').trim();const note=g('dl_note').trim();

async function roomEnable(pid){const p=S.projects.find(x=>x.id===pid);if(!p)return;

/* task drag & drop within project */
let TDRAG=null;
function tdstart(e,id){TDRAG=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.stopPropagation()}
function tdend(e){e.currentTarget.classList.remove('dragging')}
function tdover(e){e.preventDefault();e.currentTarget.classList.add('dragover')}
function tdleave(e){e.currentTarget.classList.remove('dragover')}
function tddrop(e,stageKey){e.preventDefault();e.currentTarget.classList.remove('dragover');const p=proj();if(p&&TDRAG){const t=(p.tasks||[]).find(x=>x.id===TDRAG);if(t&&t.stageKey!==stageKey){t.stageKey=stageKey;t.done=(stageKey==='done');save();syncTasks();renderProjectDetail(p.id)}}TDRAG=null}
function quickAddTask(stageKey){const p=proj();if(!p)return;openModal('مهمة جديدة',`
  <div class="field"><label>عنوان المهمة</label><input id="nt_title" placeholder="مثال: كتابة سكربت الحلقة" onkeydown="if(event.key==='Enter')document.getElementById('mSave').click()"></div>
  <div class="field"><label>المسؤول (اختياري)</label><select id="nt_as"><option value="">— لا أحد —</option>${(S.freelancers||[]).map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div>`,
  ()=>{const v=document.getElementById('nt_title').value.trim();if(!v){alert('أدخل عنوان المهمة');return}const as=document.getElementById('nt_as').value;p.tasks=p.tasks||[];p.tasks.push({id:uid(),title:v,stageKey,done:stageKey==='done',assignee:as,blocks:[]});save();syncTasks();closeModal();renderProjectDetail(p.id)});
  setTimeout(()=>{const n=document.getElementById('nt_title');if(n)n.focus()},50);
}
function taskStageEditor(id){const p=S.projects.find(x=>x.id===id);if(!p)return;
  let stages=JSON.parse(JSON.stringify(p.taskStages||DEFAULT_TASK_STAGES));
  function body(){return `<p style="color:var(--muted);font-size:13px;margin-top:0">مراحل المهام لهذا المشروع. المهام في مرحلة محذوفة تنتقل لأول مرحلة.</p>`+
    stages.map((s,i)=>`<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
      <input value="${esc(s.label)}" oninput="tsEdit(${i},this.value)" style="flex:1">
      <button class="link-btn" onclick="tsMove(${i},-1)">▲</button><button class="link-btn" onclick="tsMove(${i},1)">▼</button>
      <button class="link-btn del" onclick="tsDel(${i})">حذف</button></div>`).join('')+
    `<button class="btn btn-ghost btn-sm" onclick="tsAdd()">+ مرحلة جديدة</button>`}
  openModal('مراحل المهام',body(),()=>{if(!stages.length){alert('أضف مرحلة واحدة على الأقل');return}const keys=stages.map(s=>s.key);(p.tasks||[]).forEach(t=>{if(!keys.includes(t.stageKey))t.stageKey=keys[0]});p.taskStages=stages;save();closeModal();renderProjectDetail(id)});
  window.tsEdit=(i,v)=>{stages[i].label=v};
  window.tsAdd=()=>{stages.push({key:uid(),label:'مرحلة جديدة'});refresh()};
  window.tsDel=(i)=>{stages.splice(i,1);refresh()};
  window.tsMove=(i,d)=>{const j=i+d;if(j<0||j>=stages.length)return;[stages[i],stages[j]]=[stages[j],stages[i]];refresh()};
  function refresh(){document.querySelector('#modalRoot .modal-body').innerHTML=body()}
}

/* ===== NOTION-LITE TASK EDITOR ===== */
let CUR_TASK=null;
function curTask(){const p=proj();return p?(p.tasks||[]).find(x=>x.id===CUR_TASK):null}
function findBlock(id){const t=curTask();return t?(t.blocks||[]).find(b=>b.id===id):null}
function openTask(taskId){const p=proj();if(!p)return;const t=(p.tasks||[]).find(x=>x.id===taskId);if(!t)return;CUR_TASK=taskId;if(!Array.isArray(t.blocks))t.blocks=[];
  const asOpts=`<option value="">— لا مسؤول —</option>`+(S.freelancers||[]).map(f=>`<option value="${f.id}" ${t.assignee===f.id?'selected':''}>${esc(f.name)}</option>`).join('');
  const stOpts=(p.taskStages||DEFAULT_TASK_STAGES).map(s=>`<option value="${s.key}" ${t.stageKey===s.key?'selected':''}>${esc(s.label)}</option>`).join('');
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeTask()"><div class="modal task-modal">
    <div class="modal-head"><input id="t_title" value="${esc(t.title)}" style="font-size:18px;font-weight:800;border:none;background:transparent;padding:4px;width:auto;flex:1" oninput="taskTitle(this.value)"><button class="x" onclick="closeTask()">×</button></div>
    <div class="modal-body">
      <div class="row2" style="margin-bottom:14px">
        <div class="field"><label>المرحلة</label><select id="t_stage" onchange="taskStage(this.value)">${stOpts}</select></div>
        <div class="field"><label>المسؤول</label><select id="t_as" onchange="taskAssignee(this.value)">${asOpts}</select></div>
      </div>
      <div class="ed-toolbar">
        <button class="btn btn-ghost btn-sm" onclick="addBlock('text')"><i data-lucide="pilcrow"></i> نص</button>
        <button class="btn btn-ghost btn-sm" onclick="addBlock('heading')"><i data-lucide="heading"></i> عنوان</button>
        <button class="btn btn-ghost btn-sm" onclick="addBlock('script')"><i data-lucide="film"></i> سكربت</button>
        <button class="btn btn-ghost btn-sm" onclick="addBlock('todo')"><i data-lucide="square-check"></i> مهمة فرعية</button>
        <button class="btn btn-ghost btn-sm" onclick="pickImage()"><i data-lucide="image"></i> صورة</button>
        <button class="btn btn-ghost btn-sm" onclick="addBlock('divider')"><i data-lucide="minus"></i> فاصل</button>
        <span style="align-self:center;color:var(--muted);font-size:12px">أو اكتب «/» داخل أي سطر · للعريض Ctrl/⌘+B</span>
        <span id="upStatus" class="upbar"></span>
      </div>
      <div id="blocks">${t.blocks.map(b=>blockHTML(b)).join('')}</div>
      <button class="addtask" style="margin-top:10px" onclick="addBlock('text')">+ أضف سطراً</button>
      <input type="file" id="imgFile" accept="image/*" class="hidden" onchange="onImagePicked(event)">
      <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:12px"><button class="link-btn del" onclick="deleteTask()"><i class="inl" data-lucide="trash-2"></i> حذف المهمة</button></div>
    </div></div></div>`;
  refreshIcons();
}
function blockHTML(b){
  if(b.type==='heading')return blkWrap(b,`<div class="ce h" contenteditable data-bid="${b.id}" data-ph="عنوان" onkeydown="blockKey(event,'${b.id}')" oninput="onCe('${b.id}')">${b.html||''}</div>`);
  if(b.type==='script')return blkWrap(b,`<div class="lbl"><i class="inl" data-lucide="film"></i> سكربت الفيديو</div><div class="ce" contenteditable data-bid="${b.id}" data-ph="اكتب نص الفيديو…" onkeydown="blockKey(event,'${b.id}')" oninput="onCe('${b.id}')">${b.html||''}</div>`,'script');
  if(b.type==='todo')return blkWrap(b,`<input type="checkbox" ${b.done?'checked':''} onchange="todoToggle('${b.id}',this.checked)"><div class="ce txt ${b.done?'dn':''}" contenteditable data-bid="${b.id}" data-ph="مهمة فرعية…" onkeydown="blockKey(event,'${b.id}')" oninput="onCe('${b.id}')">${b.html||''}</div>`,'todo');
  if(b.type==='image')return blkWrap(b,`<img src="${esc(b.url)}" alt="">`,'img');
  if(b.type==='divider')return blkWrap(b,`<hr>`,'divider');
  return blkWrap(b,`<div class="ce txt" contenteditable data-bid="${b.id}" data-ph="اكتب… (أو «/» لأمر)" onkeydown="blockKey(event,'${b.id}')" oninput="onCe('${b.id}')">${b.html||''}</div>`);
}
function blkWrap(b,inner,cls){return `<div class="nb ${cls||''}" data-id="${b.id}"><button class="handle" onclick="blockMenu(event,'${b.id}')" title="خيارات">⋮</button><div class="bc">${inner}</div></div>`}
function onCe(id){const el=document.querySelector(`[data-bid="${id}"]`);const b=findBlock(id);if(el&&b){b.html=el.innerHTML;scheduleTaskSave()}}
function scheduleTaskSave(){clearTimeout(window.__tsv);window.__tsv=setTimeout(()=>{save();syncTasks()},700)}
function taskTitle(v){const t=curTask();if(t){t.title=v;scheduleTaskSave()}}
function taskStage(v){const t=curTask();if(t){t.stageKey=v;t.done=(v==='done');scheduleTaskSave()}}
function taskAssignee(v){const t=curTask();if(t){t.assignee=v;scheduleTaskSave()}}
function todoToggle(id,c){const b=findBlock(id);if(b){b.done=c;const el=document.querySelector(`[data-bid="${id}"]`);if(el)el.classList.toggle('dn',c);scheduleTaskSave()}}
function addBlock(type,afterId){const t=curTask();if(!t)return;const b={id:uid(),type};if(type==='todo')b.done=false;if(type!=='divider'&&type!=='image')b.html='';let idx=t.blocks.length;if(afterId){const i=t.blocks.findIndex(x=>x.id===afterId);if(i>=0)idx=i+1}t.blocks.splice(idx,0,b);scheduleTaskSave();rerenderBlocks((type==='divider'||type==='image')?null:b.id)}
function removeBlock(id){const t=curTask();if(!t)return;const i=t.blocks.findIndex(b=>b.id===id);if(i<0)return;t.blocks.splice(i,1);scheduleTaskSave();const prev=t.blocks[i-1];rerenderBlocks(prev&&prev.type!=='divider'&&prev.type!=='image'?prev.id:null)}
function rerenderBlocks(focusId){const t=curTask();const c=document.getElementById('blocks');if(!t||!c)return;c.innerHTML=t.blocks.map(b=>blockHTML(b)).join('');refreshIcons();if(focusId){const el=document.querySelector(`[data-bid="${focusId}"]`);if(el)placeCaretEnd(el)}}
function blockKey(e,id){
  if(e.key==='Enter'&&!e.shiftKey){const b=findBlock(id);if(b&&b.type!=='script'){e.preventDefault();closeSlash();addBlock('text',id)}}
  else if(e.key==='Backspace'){if(e.target&&e.target.textContent===''){e.preventDefault();removeBlock(id)}}
  else if(e.key==='Escape'){closeSlash()}
  else if(e.key==='/'){setTimeout(()=>{const el=document.querySelector(`[data-bid="${id}"]`);if(el&&el.textContent==='/')openSlash(id,el,false)},0)}
}
function placeCaretEnd(el){try{el.focus();const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
const SLASH=[{t:'text',i:'pilcrow',n:'نص',d:'فقرة عادية'},{t:'heading',i:'heading',n:'عنوان',d:'عنوان عريض'},{t:'script',i:'film',n:'سكربت',d:'نص الفيديو'},{t:'todo',i:'square-check',n:'مهمة فرعية',d:'بوكس تحقق'},{t:'image',i:'image',n:'صورة',d:'رفع صورة'},{t:'divider',i:'minus',n:'فاصل',d:'خط فاصل'}];
function openSlash(id,el,withDel){closeSlash();const r=el.getBoundingClientRect();const m=document.createElement('div');m.className='slash';m.id='slashMenu';m.style.top=(r.bottom+window.scrollY+4)+'px';m.style.right=Math.max(8,window.innerWidth-r.right)+'px';
  m.innerHTML=SLASH.map(s=>`<button onclick="applySlash('${id}','${s.t}')"><span class="si"><i data-lucide="${s.i}"></i></span><span>${s.n}<div class="sd">${esc(s.d)}</div></span></button>`).join('')+(withDel?`<button onclick="removeBlock('${id}');closeSlash()"><span class="si"><i data-lucide="trash-2"></i></span><span style="color:var(--bad)">حذف البلوك</span></button>`:'');
  document.body.appendChild(m);refreshIcons();setTimeout(()=>document.addEventListener('click',slashOutside),0)}
function slashOutside(e){if(!e.target.closest('#slashMenu')){closeSlash()}}
function closeSlash(){const m=document.getElementById('slashMenu');if(m)m.remove();document.removeEventListener('click',slashOutside)}
function blockMenu(e,id){e.stopPropagation();const el=e.currentTarget;openSlash(id,el,true)}
function applySlash(id,type){closeSlash();const t=curTask();const b=findBlock(id);if(!b||!t)return;
  if(type==='image'){b.type='text';b.html='';pickImageFor(id);return}
  if(type==='divider'){b.type='divider';delete b.html;scheduleTaskSave();rerenderBlocks(null);return}
  if(type==='todo'){b.type='todo';b.html='';b.done=false}else{b.type=type;b.html=''}
  scheduleTaskSave();rerenderBlocks(id);
}
function pickImage(){window.__imgTarget=null;document.getElementById('imgFile').click()}
function pickImageFor(id){window.__imgTarget=id;document.getElementById('imgFile').click()}
async function onImagePicked(e){const f=e.target.files[0];e.target.value='';if(!f)return;const t=curTask();if(!t)return;const st=document.getElementById('upStatus');if(st)st.textContent='جارٍ رفع الصورة…';
  try{const ext=(f.name.split('.').pop()||'png').toLowerCase();const path=`${USER.id}/${uid()}.${ext}`;
    const {error}=await sb.storage.from('task-images').upload(path,f,{upsert:false,contentType:f.type||'image/png'});if(error)throw error;
    const {data}=sb.storage.from('task-images').getPublicUrl(path);const url=data.publicUrl;
    const tgt=window.__imgTarget;if(tgt){const b=findBlock(tgt);if(b){b.type='image';b.url=url;delete b.html}}else{t.blocks.push({id:uid(),type:'image',url})}
    window.__imgTarget=null;if(st)st.textContent='تم';setTimeout(()=>{if(st)st.textContent=''},1500);save();rerenderBlocks(null);
  }catch(err){if(st)st.textContent='';alert('تعذّر رفع الصورة: '+(err.message||err)+'\n\nتأكد من إنشاء bucket عام باسم «task-images» في Supabase → Storage.')}
}
function deleteTask(){const p=proj();const t=curTask();if(!p||!t)return;if(!confirm('حذف هذه المهمة؟'))return;p.tasks=p.tasks.filter(x=>x.id!==t.id);save();syncTasks();document.getElementById('modalRoot').innerHTML='';CUR_TASK=null;renderProjectDetail(p.id)}
function closeTask(){closeSlash();const t=curTask();if(t){document.querySelectorAll('#blocks [data-bid]').forEach(el=>{const b=(t.blocks||[]).find(x=>x.id===el.dataset.bid);if(b)b.html=el.innerHTML});const tt=document.getElementById('t_title');if(tt)t.title=tt.value}save();syncTasks();document.getElementById('modalRoot').innerHTML='';CUR_TASK=null;if(CUR_PROJ)renderProjectDetail(CUR_PROJ)}

/* ===== CONTACTS ===== */
function clientAvatar(c,size){size=size||44;const fs=Math.round(size*0.42);
  if(c.logo)return `<img src="${esc(c.logo)}" style="width:${size}px;height:${size}px;border-radius:12px;object-fit:contain;background:transparent;border:1px solid var(--line)" onerror="this.style.display='none'">`;
  const initial=esc((c.name||'؟').trim().charAt(0));
  return `<div style="width:${size}px;height:${size}px;border-radius:12px;background:var(--goldsoft);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${fs}px;border:1px solid var(--line)">${initial}</div>`;}
function clientCredits(contactId){return (S.credits||[]).filter(c=>c.contactId===contactId)}
function clientBalance(contactId){const it=clientItems(contactId);const invoiced=it.invoices.reduce((a,i)=>a+invTotal(i),0);const paid=it.invoices.reduce((a,i)=>a+invPaid(i),0);const credited=clientCredits(contactId).reduce((a,c)=>a+invTotal(c),0);const due=Math.max(0,invoiced-paid-credited);return {invoiced,paid,credited,due,count:it.invoices.length,it};}
function renderContacts(){
  const cs=S.contacts.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));
  const view=uiPref('contactsView','cards');
  const sw=viewSwitch('contactsView',[{v:'cards',t:'بطاقات'},{v:'list',t:'قائمة'}],view);
  const typePill=c=>`<span class="pill ${c.type==='عميل محتمل'?'lead':(c.type==='مورد'?'contacted':'won')}">${esc(c.type||'عميل')}</span>`;
  let body;
  if(!cs.length){body=emptyBox('user','لا يوجد عملاء بعد. أضف أول عميل ببياناته وشعاره.');}
  else if(view==='list'){
    body=`<table><thead><tr><th>العميل</th><th>الجهة</th><th>النوع</th><th>الفواتير</th><th>الرصيد</th></tr></thead><tbody>
    ${cs.map(c=>{const b=clientBalance(c.id);return `<tr style="cursor:pointer" onclick="openClient('${c.id}')">
      <td><span style="display:inline-flex;align-items:center;gap:10px">${clientAvatar(c,34)}<b>${esc(c.name)}</b></span></td>
      <td style="color:var(--muted)">${esc(c.company||'—')}</td><td>${typePill(c)}</td><td style="color:var(--muted)">${b.count}</td>
      <td>${b.due>0?`<span style="color:var(--warn);font-weight:700">مستحق ${money(b.due)}</span>`:`<span style="color:var(--good);font-weight:700">مسدّد بالكامل</span>`}</td></tr>`}).join('')}
    </tbody></table>`;
  } else {
    body=`<div class="grid">
    ${cs.map(c=>{const b=clientBalance(c.id);return `<div class="card" style="cursor:pointer;display:flex;flex-direction:column;gap:12px" onclick="openClient('${c.id}')">
      <div style="display:flex;align-items:center;gap:12px">${clientAvatar(c,48)}
        <div style="min-width:0;flex:1"><div style="font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div>
        <div style="color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.company||c.type||'عميل')}</div></div>
        ${typePill(c)}</div>
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-size:13px">
        <span style="color:var(--muted)">${b.count} فاتورة</span>
        ${b.due>0?`<span style="color:var(--warn);font-weight:700">مستحق ${money(b.due)}</span>`:`<span style="color:var(--good);font-weight:700">مسدّد بالكامل</span>`}</div>
    </div>`}).join('')}
    </div>`;
  }
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>العملاء وجهات الاتصال</h1><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${sw}<button class="btn btn-gold" onclick="contactModal(null,renderContacts)">+ عميل جديد</button></div></div>
    ${body}`;
  refreshIcons();
}
function openClient(id){
  const c=S.contacts.find(x=>x.id===id);if(!c){renderContacts();return}
  const b=clientBalance(id);const it=b.it;const apptUp=it.appts.slice().sort((a,b)=>(a.datetime||'').localeCompare(b.datetime||''));
  const info=(lbl,val,href)=>val?`<div style="padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px"><span style="color:var(--muted)">${lbl}</span>${href?`<a href="${href}" target="_blank" style="color:var(--gold2);font-weight:600">${esc(val)}</a>`:`<span style="font-weight:600">${esc(val)}</span>`}</div>`:'';
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1><button class="link-btn" onclick="renderContacts()">← العملاء</button></h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="contactModal('${id}',()=>openClient('${id}'))"><i data-lucide="pencil"></i> تعديل البيانات</button>
        <button class="btn btn-ghost btn-sm" onclick="docModal('sale',null,'${esc(c.name).replace(/'/g,"\\'")}',()=>openClient('${id}'))">+ عرض سعر</button>
        <button class="btn btn-gold" onclick="docModal('invoice',null,'${esc(c.name).replace(/'/g,"\\'")}',()=>openClient('${id}'))">+ فاتورة</button></div></div>
    <div class="card" style="display:flex;align-items:center;gap:16px;margin-bottom:18px">
      ${clientAvatar(c,72)}
      <div style="flex:1;min-width:0"><div style="font-size:22px;font-weight:900">${esc(c.name)}</div>
      <div style="color:var(--muted)">${esc(c.company||'')} ${c.company&&c.type?'·':''} ${esc(c.type||'عميل')}</div></div></div>
    <div class="stats">
      <div class="stat"><span class="ic"><i data-lucide="receipt-text"></i></span><div class="v">${b.count}</div><div class="l">عدد الفواتير</div></div>
      <div class="stat"><span class="ic"><i data-lucide="layers"></i></span><div class="v">${money(b.invoiced)}</div><div class="l">إجمالي مفوتر</div></div>
      <div class="stat"><span class="ic"><i data-lucide="wallet"></i></span><div class="v">${money(b.paid)}</div><div class="l">المحصّل</div></div>
      <div class="stat"><span class="ic"><i data-lucide="hourglass"></i></span><div class="v" style="color:${b.due>0?'var(--warn)':'var(--good)'}">${money(b.due)}</div><div class="l">المستحق (Receivable)</div></div>
    </div>
    <div class="grid">
      <div class="card"><h3><i data-lucide="id-card"></i> بيانات العميل</h3>
        ${info('الجوال',c.phone,c.phone?'tel:'+esc(c.phone):'')}
        ${info('البريد',c.email,c.email?'mailto:'+esc(c.email):'')}
        ${info('الرقم الضريبي',c.vat)}
        ${info('الشركة/الجهة',c.company)}
        ${info('المدينة',c.city)}
        ${info('العنوان',c.address)}
        ${info('الموقع',c.website,c.website?(c.website.startsWith('http')?esc(c.website):'https://'+esc(c.website)):'')}
        ${c.notes?`<div style="padding-top:10px;color:var(--muted);font-size:13px"><i class="inl" data-lucide="sticky-note"></i> ${esc(c.notes)}</div>`:''}
        ${(!c.phone&&!c.email&&!c.vat&&!c.company&&!c.address)?'<p style="color:var(--muted)">لا توجد بيانات بعد — اضغط «تعديل البيانات».</p>':''}
      </div>
      <div class="card"><h3><i data-lucide="receipt-text"></i> الفواتير</h3>
        ${it.invoices.length?it.invoices.slice().reverse().map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">
          <span><button class="link-btn" onclick="printDoc('invoice','${d.id}')">طباعة</button> <button class="link-btn" onclick="docModal('invoice','${d.id}',null,()=>openClient('${id}'))">#${d.number}</button></span>
          <span>${money(invTotal(d))} ${pill(d.status)}</span></div>`).join(''):'<p style="color:var(--muted)">لا فواتير لهذا العميل بعد.</p>'}
      </div>
      <div class="card"><h3><i data-lucide="file-text"></i> عروض الأسعار</h3>
        ${it.invoices&&S.sales.filter(x=>x.contactId===id).length?S.sales.filter(x=>x.contactId===id).slice().reverse().map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">
          <span><button class="link-btn" onclick="toInvoice('${d.id}')">→ فاتورة</button> <button class="link-btn" onclick="docModal('sale','${d.id}',null,()=>openClient('${id}'))">#${d.number}</button></span>
          <span>${money(docTotal(d))} ${pill(d.status)}</span></div>`).join(''):'<p style="color:var(--muted)">لا عروض أسعار.</p>'}
      </div>
      <div class="card"><h3><i data-lucide="clapperboard"></i> المشاريع والمواعيد</h3>
        ${it.projects.length?it.projects.map(p=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><i class="inl" data-lucide="clapperboard"></i> ${esc(p.title)}</div>`).join(''):''}
        ${apptUp.length?apptUp.map(a=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><i class="inl" data-lucide="calendar-days"></i> ${esc(a.title)} — ${esc((a.datetime||'').replace('T',' '))}</div>`).join(''):''}
        ${(!it.projects.length&&!apptUp.length)?'<p style="color:var(--muted)">لا مشاريع أو مواعيد مرتبطة.</p>':''}
      </div>
    </div>`;
  refreshIcons();
}

  let c=id?{...S.contacts.find(x=>x.id===id)}:{id:'',name:'',type:'عميل',phone:'',email:'',company:'',vat:'',address:'',city:'',website:'',logo:'',notes:''};
  window.cPickLogo=(e)=>{const f=e.target.files[0];if(!f)return;if(f.size>1500000){alert('حجم الصورة كبير (أقل من 1.5MB)');return}const r=new FileReader();r.onload=()=>{c.logo=r.result;const p=document.getElementById('c_logoPrev');if(p){p.src=r.result;p.style.display='block'}};r.readAsDataURL(f)};
  openModal(id?'تعديل بطاقة العميل':'عميل جديد',`

  ()=>{const g=i=>document.getElementById(i).value;c.name=g('c_name');c.type=g('c_type');c.phone=g('c_phone');c.email=g('c_email');c.company=g('c_company');c.vat=g('c_vat');c.city=g('c_city');c.website=g('c_website');c.address=g('c_address');c.notes=g('c_notes');if(!c.name.trim()){alert('أدخل الاسم');return}if(id){const i=S.contacts.findIndex(x=>x.id===id);S.contacts[i]=c}else{c.id=uid();S.contacts.push(c)}save();closeModal();cb()},id?()=>delItem('contacts',id,renderContacts):null);

// ضغط الصورة في المتصفّح قبل الرفع (يصغّر الأبعاد ويحوّلها WebP) — يوفّر مساحة التخزين
function compressImage(file,maxDim,quality,cb){
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    let w=img.width,h=img.height;const s=Math.min(1,maxDim/Math.max(w,h));w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    c.toBlob(b=>{if(b)cb(b,'webp');else c.toBlob(b2=>cb(b2,'jpeg'),'image/jpeg',quality)},'image/webp',quality);
  };img.onerror=()=>cb(null);img.src=rd.result};
  rd.onerror=()=>cb(null);rd.readAsDataURL(file);
}
function prodRemoveImg(){const h=document.getElementById('p_image');if(h)h.value='';const pv=document.getElementById('pimgPrev');if(pv){pv.src='';pv.style.display='none'}const rm=document.getElementById('pimgRemove');if(rm)rm.style.display='none';const st=document.getElementById('pimgStatus');if(st)st.textContent='حُذفت الصورة — احفظ لتأكيد.'}
function prodUpload(ev){const f=ev.target.files[0];ev.target.value='';if(!f)return;const st=document.getElementById('pimgStatus');
  if(f.size>12*1024*1024){alert('الصورة كبيرة جداً (الحد ١٢MB). اختر صورة أصغر.');return}
  if(st)st.textContent='جارٍ الضغط…';
  compressImage(f,1000,0.82,(blob)=>{
    if(!blob){if(st)st.textContent='';alert('تعذّر معالجة الصورة');return}
    if(st)st.textContent='جارٍ الرفع…';
    const fmt=blob.type==='image/webp'?'webp':'jpg';const path=`${USER.id}/products/${uid()}.${fmt}`;
    sb.storage.from('product-images').upload(path,blob,{upsert:false,contentType:blob.type||'image/webp'}).then(({error})=>{
      if(error){if(st)st.textContent='';alert('تعذّر رفع الصورة: '+(error.message||error)+'\n\nأنشئ bucket عام باسم «product-images» في Supabase → Storage.');return}
      const {data}=sb.storage.from('product-images').getPublicUrl(path);const h=document.getElementById('p_image');if(h)h.value=data.publicUrl;const pv=document.getElementById('pimgPrev');if(pv){pv.src=data.publicUrl;pv.style.display='block'}const rm=document.getElementById('pimgRemove');if(rm)rm.style.display='inline-flex';if(st)st.textContent='تم ✓ ('+Math.round(blob.size/1024)+'KB)';});
  });
}

/* ===== ZATCA QR ===== */
function tlv(tag,val){const b=new TextEncoder().encode(val);return [tag,b.length,...b]}
function zatcaBase64(seller,vatNo,iso,total,vat){const bytes=[...tlv(1,seller),...tlv(2,vatNo),...tlv(3,iso),...tlv(4,total),...tlv(5,vat)];let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function qrImg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createImgTag(4,8)}catch(e){return '<div style="font-size:9px;word-break:break-all;max-width:130px">'+esc(text)+'</div>'}}

      ${(isInv||isCredit)&&s.vat.cr?`<div style="color:#475569;font-size:13px">السجل التجاري: ${esc(s.vat.cr)}</div>`:''}</div>
      <div style="text-align:left">${qrBlock}<div style="margin-top:6px"><div style="font-size:22px;font-weight:800">${isInv?(d.vat?'فاتورة ضريبية':'فاتورة'):isCredit?'إشعار دائن':'عرض سعر'}</div><div>رقم: ${esc(isInv?(s.invPrefix||'INV-'):isCredit?'CN-':(s.salePrefix||'S'))}${String(d.number).padStart(5,'0')}</div><div>التاريخ: ${d.date}</div></div></div>
    </div>
    ${(()=>{const ct=S.contacts.find(c=>c.id===d.contactId)||{};const cname=esc(resolveClientName(d));const cvat=d.clientVat||ct.vat||'';const caddr=[ct.company,ct.address,ct.city].filter(Boolean).join('، ');return `<div style="margin-bottom:14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div><div style="font-size:12px;color:#64748b">فاتورة إلى</div><div style="font-weight:800;font-size:15px">${cname}</div>
      ${caddr?`<div style="color:#475569;font-size:13px">${esc(caddr)}</div>`:''}
      ${ct.email?`<div style="color:#475569;font-size:13px">${esc(ct.email)}${ct.phone?' | '+esc(ct.phone):''}</div>`:(ct.phone?`<div style="color:#475569;font-size:13px">${esc(ct.phone)}</div>`:'')}
      ${cvat?`<div style="color:#475569;font-size:13px"><b>الرقم الضريبي:</b> ${esc(cvat)}</div>`:''}</div>
      ${ct.logo?`<img src="${esc(ct.logo)}" style="height:46px;max-width:130px;object-fit:contain">`:''}</div>`})()}
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="background:#1d1d20;color:#fff"><th style="border:1px solid #cbd5e1;padding:9px;text-align:right">الوصف</th><th style="border:1px solid #cbd5e1;padding:9px">الكمية</th><th style="border:1px solid #cbd5e1;padding:9px">السعر</th>${disc>0.001?'<th style="border:1px solid #cbd5e1;padding:9px">خصم</th>':''}<th style="border:1px solid #cbd5e1;padding:9px">المجموع</th></tr></thead>

      <div style="display:flex;justify-content:space-between;padding:4px 0"><span>المجموع الفرعي</span><span>${sub.toFixed(2)} ${s.currency}</span></div>

      ${isInv&&due>0.001?`<div style="display:flex;justify-content:space-between;padding:4px 0;font-weight:800"><span>المتبقي</span><span>${due.toFixed(2)} ${s.currency}</span></div>`:''}

   </div>`;
  const html=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">

  const f=document.createElement('iframe');f.style.position='fixed';f.style.right='-10000px';f.style.bottom='0';f.style.width='800px';f.style.height='1120px';f.style.border='0';
  document.body.appendChild(f);
  const doc=f.contentWindow.document;doc.open();doc.write(html);doc.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){alert('تعذّرت الطباعة: '+e.message)}setTimeout(()=>f.remove(),1500)},500);
}

/* ===== SEND (WhatsApp / Email / Copy) ===== */
function _docFind(type,id){return (type==='invoice'?S.invoices:type==='credit'?S.credits:S.sales).find(x=>x.id===id)}
function docText(type,id){const isInv=type==='invoice';const d=_docFind(type,id);if(!d)return'';const s=S.settings;const pfx=isInv?(s.invPrefix||'INV-'):(s.salePrefix||'S');const lines=(d.items||[]).map(it=>`• ${it.desc} ×${it.qty} = ${money(lineTotal(it))} ${s.currency}`).join('\n');const title=isInv?'فاتورة':'عرض سعر';return `${title} ${pfx}${String(d.number).padStart(5,'0')} — ${s.brand}\nالعميل: ${resolveClientName(d)}\nالتاريخ: ${d.date}\n${lines}\nالإجمالي: ${money(invTotal(d))} ${s.currency}${isInv&&invDue(d)>0?`\nالمتبقي: ${money(invDue(d))} ${s.currency}`:''}\n\n${isInv?(s.terms||''):'بانتظار موافقتكم على العرض، وشاكرين لكم.'}`;}
function sendWhatsApp(type,id){const d=_docFind(type,id);const ct=S.contacts.find(c=>c.id===(d&&d.contactId));const phone=((ct&&ct.phone)||'').replace(/[^0-9]/g,'');window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(docText(type,id)),'_blank');}
function sendEmail(type,id){const d=_docFind(type,id);const ct=S.contacts.find(c=>c.id===(d&&d.contactId));const subj=encodeURIComponent((type==='invoice'?'فاتورة':'عرض سعر')+' من '+S.settings.brand);window.location.href='mailto:'+((ct&&ct.email)||'')+'?subject='+subj+'&body='+encodeURIComponent(docText(type,id));}
function copyDocText(type,id){const t=docText(type,id);if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>alert('تم نسخ نص المستند — الصقه أينما تريد'),()=>alert(t))}else alert(t);}

/* ===== CREDIT NOTES (إشعارات دائنة / مرتجعات) ===== */
function creditFromInvoice(invId){const inv=S.invoices.find(x=>x.id===invId);if(!inv)return;const reason=prompt('سبب إشعار الدائن / المرتجع:','مرتجع كامل للفاتورة');if(reason===null)return;
  const cn={id:uid(),number:++S.counters.credit,invoiceId:invId,invNumber:inv.number,client:inv.client,contactId:inv.contactId||'',clientVat:inv.clientVat||'',date:today(),items:JSON.parse(JSON.stringify(inv.items)),notes:reason,vat:inv.vat,vatRate:inv.vatRate};
  if(!S.credits)S.credits=[];S.credits.push(cn);save();openCredit(cn.id);}
function openCredit(id){const cn=(S.credits||[]).find(x=>x.id===id);if(!cn){go('invoicing');return}const s=S.settings;const ct=S.contacts.find(c=>c.id===cn.contactId)||{};const total=invTotal(cn);
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1><button class="link-btn" onclick="go('invoicing')">← الفوترة</button> إشعار دائن CN-${String(cn.number).padStart(5,'0')}</h1></div>
    <div class="doc-acts">
      <button class="btn btn-ghost" onclick="printDoc('credit','${id}')"><i data-lucide="printer"></i> طباعة / PDF</button>
      <button class="btn btn-ghost" style="color:var(--bad)" onclick="delItem('credits','${id}',()=>go('invoicing'))">حذف</button></div>
    <div class="card">
      <div style="margin-bottom:10px;color:var(--muted)">مرتجع للفاتورة رقم <b>${esc(s.invPrefix||'INV-')}${String(cn.invNumber).padStart(5,'0')}</b> · العميل: <b>${esc(resolveClientName(cn))}</b>${ct.vat?` · الرقم الضريبي: ${esc(ct.vat)}`:''}</div>
      <table><thead><tr><th>الوصف</th><th>كمية</th><th>السعر</th><th>المجموع</th></tr></thead><tbody>
      ${(cn.items||[]).map(it=>`<tr><td>${esc(it.desc)}</td><td>${it.qty}</td><td>${money(it.price)}</td><td>${money(lineTotal(it))}</td></tr>`).join('')}
      </tbody></table>
      <div class="totals" style="margin-top:14px"><div class="line grand"><span>إجمالي الإشعار الدائن</span><span>${money(total)} ${esc(s.currency)}</span></div></div>
      ${cn.notes?`<div style="margin-top:12px;color:var(--muted)"><i class="inl" data-lucide="sticky-note"></i> ${esc(cn.notes)}</div>`:''}
    </div>`;
  refreshIcons();
}

/* ===== DOCUMENT FORM (Odoo-style status flow) ===== */
function docStages(type){return type==='invoice'?[{k:'unpaid',l:'غير مدفوعة'},{k:'partial',l:'مدفوعة جزئياً'},{k:'paid',l:'مدفوعة'}]:[{k:'draft',l:'عرض سعر'},{k:'sent',l:'مُرسل'},{k:'sale',l:'أمر بيع'}];}
function setDocStatus(type,id,status){const k=type==='invoice'?'invoices':'sales';const d=S[k].find(x=>x.id===id);if(!d)return;d.status=status;save();openDoc(type,id);}
function openDoc(type,id){
  const isInv=type==='invoice';const k=isInv?'invoices':'sales';const d=S[k].find(x=>x.id===id);if(!d){renderDocs(type);return}
  const s=S.settings;const ct=S.contacts.find(c=>c.id===d.contactId)||{};
  const gross=docGross(d);const lineSub=docLineSubtotal(d);const sub=lineSub;const discTotal=gross-lineSub;const ovr=docOverallDisc(d);const tax=invVat(d);const total=invTotal(d);
  const paid=invPaid(d);const due=invDue(d);
  const stages=docStages(type);const curIdx=stages.findIndex(x=>x.k===d.status);const cancelled=d.status==='cancel';
  const prefix=isInv?(s.invPrefix||'INV-'):(s.salePrefix||'S');
  const bar=cancelled?`<div class="statusbar"><div class="st active" style="background:var(--bad);color:#fff">ملغى</div></div>`:
    `<div class="statusbar">${stages.map((st,i)=>`<div class="st ${i===curIdx?'active':(i<curIdx?'done':'')}">${st.l}</div>`).join('')}</div>`;
  let acts=[];
  if(!isInv){
    if(!cancelled){
      if(d.status==='draft')acts.push(`<button class="btn btn-gold" onclick="setDocStatus('sale','${id}','sent')"><i data-lucide="send"></i> إرسال للعميل</button>`);
      if(d.status==='draft'||d.status==='sent')acts.push(`<button class="btn btn-gold" onclick="setDocStatus('sale','${id}','sale')"><i data-lucide="check-check"></i> تأكيد أمر البيع</button>`);
      if(d.status==='sale')acts.push(`<button class="btn btn-gold" onclick="toInvoice('${id}')"><i data-lucide="receipt-text"></i> إنشاء فاتورة</button>`);
    }
  }else{ if(due>0)acts.push(`<button class="btn btn-gold" onclick="paymentModal('${id}')"><i data-lucide="wallet"></i> تسجيل دفعة</button>`); }
  acts.push(`<button class="btn btn-ghost" onclick="printDoc('${type}','${id}')"><i data-lucide="printer"></i> طباعة / PDF</button>`);
  acts.push(`<button class="btn btn-ghost" onclick="docModal('${type}','${id}',null,()=>openDoc('${type}','${id}'))"><i data-lucide="pencil"></i> تعديل</button>`);
  acts.push(`<button class="btn btn-ghost" onclick="sendWhatsApp('${type}','${id}')"><i data-lucide="message-circle"></i> واتساب</button>`);
  acts.push(`<button class="btn btn-ghost" onclick="sendEmail('${type}','${id}')"><i data-lucide="mail"></i> إيميل</button>`);
  acts.push(`<button class="btn btn-ghost" onclick="copyDocText('${type}','${id}')"><i data-lucide="copy"></i> نسخ النص</button>`);
  if(isInv)acts.push(`<button class="btn btn-ghost" onclick="creditFromInvoice('${id}')"><i data-lucide="rotate-ccw"></i> إشعار دائن</button>`);
  if(!isInv&&!cancelled)acts.push(`<button class="btn btn-ghost" style="color:var(--bad)" onclick="setDocStatus('${type}','${id}','cancel')">إلغاء</button>`);
  if(!isInv&&cancelled)acts.push(`<button class="btn btn-ghost" onclick="setDocStatus('${type}','${id}','draft')">↺ إرجاع لعرض سعر</button>`);
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1><button class="link-btn" onclick="renderDocs('${type}')">← ${isInv?'الفواتير':'المبيعات'}</button> ${esc(prefix)}${String(d.number).padStart(5,'0')}</h1></div>
    ${bar}
    <div class="doc-acts">${acts.join('')}</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:14px">
        <div><div style="color:var(--muted);font-size:13px">${isInv?'فاتورة إلى':'عرض سعر إلى'}</div>
          <div style="font-weight:800;font-size:17px">${d.contactId?`<button class="link-btn" style="font-size:17px;padding:0" onclick="openClient('${d.contactId}')">${esc(resolveClientName(d))}</button>`:esc(resolveClientName(d))}</div>
          ${ct.vat?`<div style="color:var(--muted);font-size:13px">الرقم الضريبي: ${esc(ct.vat)}</div>`:''}</div>
        <div style="text-align:left;font-size:13px;color:var(--muted)">
          <div>التاريخ: ${d.date||'—'}</div>
          ${!isInv&&d.expiry?`<div>صالح حتى: ${esc(d.expiry)}</div>`:''}
          ${d.salesperson?`<div>مندوب المبيعات: ${esc(d.salesperson)}</div>`:''}</div>
      </div>
      <table><thead><tr><th>الوصف</th><th>كمية</th><th>السعر</th><th>خصم</th><th>المجموع</th></tr></thead><tbody>
      ${(d.items||[]).map(it=>`<tr><td><b>${esc(it.desc)}</b>${it.details?`<div style="font-size:12px;color:var(--muted)">${esc(it.details)}</div>`:''}</td><td>${it.qty}</td><td>${money(it.price)}</td><td>${it.discount?it.discount+'%':'—'}</td><td>${money(lineTotal(it))}</td></tr>`).join('')}
      </tbody></table>
      <div class="totals" style="margin-top:14px">
        <div class="line"><span>المجموع الفرعي</span><span>${money(sub)} ${esc(s.currency)}</span></div>
        ${discTotal>0.001?`<div class="line" style="color:var(--good)"><span>خصم البنود</span><span>- ${money(discTotal)} ${esc(s.currency)}</span></div>`:''}
        ${ovr>0.001?`<div class="line" style="color:var(--good)"><span>خصم إجمالي${d.discType==='percent'?' ('+Number(d.discVal||0)+'%)':''}</span><span>- ${money(ovr)} ${esc(s.currency)}</span></div>`:''}
        <div class="line"><span>ضريبة القيمة المضافة (${d.vat?d.vatRate:0}%)</span><span>${money(tax)} ${esc(s.currency)}</span></div>
        <div class="line grand"><span>الإجمالي</span><span>${money(total)} ${esc(s.currency)}</span></div>
        ${isInv&&paid>0?`<div class="line"><span>المدفوع</span><span style="color:var(--good)">${money(paid)} ${esc(s.currency)}</span></div>`:''}
        ${isInv&&due>0?`<div class="line"><span>المتبقي</span><span style="color:var(--warn);font-weight:800">${money(due)} ${esc(s.currency)}</span></div>`:''}
      </div>
      ${d.notes?`<div style="margin-top:14px;color:var(--muted)"><i class="inl" data-lucide="sticky-note"></i> ${esc(d.notes)}</div>`:''}
    </div>
    ${isInv&&d.payments&&d.payments.length?`<div class="card" style="margin-top:16px"><h3><i data-lucide="wallet"></i> سجل الدفعات</h3>
      ${d.payments.map((p,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(p.date)} · ${esc(p.method||'')}</span><span>${money(p.amount)} ${esc(s.currency)} <button class="link-btn del" onclick="rmPayment('${id}',${i})">×</button></span></div>`).join('')}</div>`:''}
    ${isInv?(()=>{const cns=(S.credits||[]).filter(c=>c.invoiceId===id);return cns.length?`<div class="card" style="margin-top:16px"><h3><i data-lucide="rotate-ccw"></i> إشعارات دائنة مرتبطة</h3>${cns.map(c=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><button class="link-btn" onclick="openCredit('${c.id}')">CN-${String(c.number).padStart(5,'0')}</button><span>${money(invTotal(c))} ${esc(s.currency)}</span></div>`).join('')}</div>`:''})():''}`;
  refreshIcons();
}
function paymentModal(invId){
  const inv=S.invoices.find(x=>x.id===invId);if(!inv)return;const due=invDue(inv);
  openModal('تسجيل دفعة',`
    <div class="badge-note"><i data-lucide="wallet"></i> <div>المتبقي على الفاتورة: <b>${money(due)} ${esc(S.settings.currency)}</b></div></div>
    <div class="row2"><div class="field"><label>المبلغ</label><input id="pa_amt" type="number" inputmode="decimal" value="${Number(due.toFixed(2))}">${amtChipsHTML('pa_amt',[500,1000,2500])}</div>

function setApptStatus(id,val){const a=(S.appointments||[]).find(x=>x.id===id);if(a){a.status=val;save();renderAppointments()}}
const APPT_FILTER_DEFAULT={scheduled:true,done:true,cancelled:false};
function apptFilter(){return Object.assign({},APPT_FILTER_DEFAULT,uiPref('apptFilter',{}))}
function toggleApptFilter(k){const f=apptFilter();f[k]=!f[k];setUiPref('apptFilter',f);renderAppointments()}
function renderAppointments(){

  const list=all.filter(a=>f[a.status||'scheduled']!==false);
  const chips=[['scheduled','مجدول'],['done','تم'],['cancelled','ملغى']].map(([k,t])=>
    `<button class="fchip ${f[k]?'on':''}" onclick="toggleApptFilter('${k}')"><i class="inl" data-lucide="${f[k]?'eye':'eye-off'}"></i> ${t} <span class="cnt">${counts[k]||0}</span></button>`).join('');
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>المواعيد</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="exportICS()"><i data-lucide="download"></i> تصدير الكل .ics</button><button class="btn btn-gold" onclick="apptModal()">+ موعد</button></div></div>
    <div class="badge-note"><i data-lucide="smartphone"></i> <div>اضغط «.ics» أو «Google» لكل موعد لإضافته إلى تقويم جوالك. استخدم الفلاتر لإظهار/إخفاء الحالات — يبقى اختيارك محفوظاً.</div></div>
    <div class="filterbar"><span class="flabel"><i class="inl" data-lucide="filter"></i> الفلاتر:</span>${chips}</div>
    ${!all.length?emptyBox('calendar-x','لا توجد مواعيد بعد.'):(!list.length?emptyBox('eye-off','كل المواعيد مخفية بالفلاتر الحالية.'):
    `<table><thead><tr><th>الموعد</th><th>العنوان</th><th>مع</th><th>المدة</th><th>الحالة</th><th>التقويم</th><th></th></tr></thead><tbody>
    ${list.map(a=>`<tr><td>${(a.datetime||'').replace('T',' ')}</td><td>${esc(a.title)}</td><td>${esc(resolveClientName(a))}</td><td>${esc(a.duration||'')} د</td><td>${apptStatusSelect(a)}</td>
    <td style="white-space:nowrap"><a class="link-btn" href="${gcal(a)}" target="_blank">Google</a><button class="link-btn" onclick="exportICS('${a.id}')">.ics</button></td>
    <td style="white-space:nowrap"><button class="link-btn" onclick="apptModal('${a.id}')">تعديل</button><button class="link-btn del" onclick="delItem('appointments','${a.id}',renderAppointments)">حذف</button></td></tr>`).join('')}

function apptModal(id,presetDate){
  let a=id?{...S.appointments.find(x=>x.id===id)}:{id:'',title:'',contact:'',datetime:(presetDate?presetDate+'T10:00':new Date().toISOString().slice(0,16)),duration:60,status:'scheduled',notes:''};
  openModal(id?'تعديل موعد':'موعد جديد',`
    <div class="field"><label>العنوان</label><input id="a_title" value="${esc(a.title)}" placeholder="مثال: تصوير في موقع العميل"></div>
    <div class="row2"><div class="field"><label>التاريخ والوقت</label><input type="datetime-local" id="a_dt" value="${a.datetime}"></div>
    <div class="field"><label>المدة (دقائق)</label><input type="number" id="a_dur" value="${a.duration}"></div></div>
    <div class="row2"><div class="field"><label>مع (العميل)</label>${clientFieldHTML('a_contact',resolveClientName(a))}</div>
    <div class="field"><label>الحالة</label><select id="a_status">${['scheduled','done','cancelled'].map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${ST[s]}</option>`).join('')}</select></div></div>
    <div class="field"><label>ملاحظات</label><textarea id="a_notes" rows="2">${esc(a.notes)}</textarea></div>`,
  ()=>{const g=i=>document.getElementById(i).value;a.title=g('a_title');a.datetime=g('a_dt');a.duration=g('a_dur');const cn=g('a_contact').trim();a.contactId=findOrCreateContact(cn);a.contact=cn;a.status=g('a_status');a.notes=g('a_notes');if(!a.title.trim()){alert('أدخل العنوان');return}if(id){const i=S.appointments.findIndex(x=>x.id===id);S.appointments[i]=a}else{a.id=uid();S.appointments.push(a)}save();closeModal();rerender()},id?()=>delItem('appointments',id,rerender):null);
}
function gcal(a){const st=new Date(a.datetime);const en=new Date(st.getTime()+(Number(a.duration)||60)*60000);const f=d=>d.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(a.title)}&dates=${f(st)}/${f(en)}&details=${encodeURIComponent(a.notes||'')}`}
function icsLocal(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00'}
function exportICS(id){
  const arr=id?S.appointments.filter(a=>a.id===id):S.appointments;
  if(!arr.length){alert('لا توجد مواعيد للتصدير');return}
  let L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//IbrahimSaud//Cowork//AR','CALSCALE:GREGORIAN'];
  arr.forEach(a=>{const st=new Date(a.datetime);const en=new Date(st.getTime()+(Number(a.duration)||60)*60000);
    L.push('BEGIN:VEVENT','UID:'+a.id+'@ibrahimsaud','DTSTAMP:'+icsLocal(new Date()),'DTSTART:'+icsLocal(st),'DTEND:'+icsLocal(en),'SUMMARY:'+(a.title||'موعد'));
    if(a.notes)L.push('DESCRIPTION:'+a.notes.replace(/\n/g,'\\n'));if(a.contact)L.push('LOCATION:'+a.contact);L.push('END:VEVENT')});
  L.push('END:VCALENDAR');
  const b=new Blob([L.join('\r\n')],{type:'text/calendar'});const aa=document.createElement('a');aa.href=URL.createObjectURL(b);aa.download=(id?'موعد':'مواعيد')+'-'+today()+'.ics';aa.click();
}

/* ===== CALENDAR (interactive) ===== */
let calRef=new Date();
function fcFmt(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
let FC=null;
function renderCalendar(){
  if(!window.FullCalendar){return renderCalendarGrid();}
  if(FC){try{FC.destroy()}catch(e){}FC=null;}
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>التقويم</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="exportICS()"><i data-lucide="download"></i> تصدير .ics</button><button class="btn btn-gold" onclick="apptModal()">+ موعد</button></div></div>
    <div class="badge-note"><i data-lucide="calendar-days"></i> <div>اسحب أي موعد لتغيير وقته، اسحب حافته لتمديد المدة، وبدّل بين العرض الشهري/الأسبوعي/اليومي/السنوي من الأعلى. اضغط على أي يوم/وقت لإضافة موعد.</div></div>
    <div class="card" id="fcal" style="padding:14px"></div>`;
  const events=[];
  (S.appointments||[]).forEach(a=>{const st=new Date(a.datetime);if(isNaN(st))return;const en=new Date(st.getTime()+(Number(a.duration)||60)*60000);
    events.push({id:a.id,title:a.title||'موعد',start:fcFmt(st),end:fcFmt(en),backgroundColor:a.status==='done'?'#22c55e':(a.status==='cancelled'?'#6b6b73':'#f5a623'),borderColor:'transparent',textColor:'#1a1205'})});
  (S.invoices||[]).forEach(i=>{if(invDue(i)>0&&i.date){events.push({id:'inv_'+i.id,title:'فاتورة #'+i.number,start:i.date,allDay:true,editable:false,backgroundColor:'rgba(239,68,68,.18)',borderColor:'#ef4444',textColor:'#fca5a5',extendedProps:{inv:i.id}})}});
  FC=new FullCalendar.Calendar(document.getElementById('fcal'),{
    initialView:'dayGridMonth',direction:'rtl',locale:'ar',height:'auto',firstDay:6,nowIndicator:true,
    headerToolbar:{start:'prev,next today',center:'title',end:'multiMonthYear,dayGridMonth,timeGridWeek,timeGridDay'},
    buttonText:{today:'اليوم',month:'شهر',week:'أسبوع',day:'يوم',year:'سنة'},
    editable:true,eventDurationEditable:true,eventResizableFromStart:true,eventDisplay:'block',selectable:true,slotMinTime:'06:00:00',slotMaxTime:'24:00:00',
    events,
    dateClick:info=>apptModal(null,info.dateStr.slice(0,10)),
    eventClick:info=>{const pr=info.event.extendedProps;if(pr&&pr.inv){docModal('invoice',pr.inv,null,()=>go('calendar'))}else{apptModal(info.event.id)}},
    eventDrop:info=>updateApptTime(info.event),
    eventResize:info=>updateApptTime(info.event)
  });
  FC.render();
}
function updateApptTime(ev){const a=(S.appointments||[]).find(x=>x.id===ev.id);if(!a||!ev.start)return;a.datetime=fcFmt(ev.start);if(ev.end)a.duration=Math.max(15,Math.round((ev.end-ev.start)/60000));save();}
function renderCalendarGrid(){
  const y=calRef.getFullYear(),m=calRef.getMonth();
  const first=new Date(y,m,1);const start=new Date(first);start.setDate(1-first.getDay());
  const dows=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  const evs={};
  S.appointments.forEach(a=>{const k=(a.datetime||'').slice(0,10);(evs[k]=evs[k]||[]).push({t:a.title,c:'',click:`apptModal('${a.id}')`})});
  S.invoices.forEach(i=>{if(i.status==='unpaid'){(evs[i.date]=evs[i.date]||[]).push({t:'فاتورة #'+i.number,c:'inv',click:`docModal('invoice','${i.id}')`})}});
  let cells='';const tk=today();
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const other=d.getMonth()!==m;
    const ev=(evs[k]||[]).slice(0,3).map(e=>`<div class="cal-ev ${e.c}" onclick="event.stopPropagation();${e.click}">${esc(e.t)}</div>`).join('');
    const more=(evs[k]||[]).length>3?`<div style="font-size:10px;color:var(--muted)">+${(evs[k]||[]).length-3}</div>`:'';
    cells+=`<div class="cal-cell ${other?'other':''} ${k===tk?'today':''}" onclick="apptModal(null,'${k}')"><div class="d">${d.getDate()}</div>${ev}${more}</div>`;}
  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>التقويم</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="exportICS()"><i data-lucide="download"></i> تصدير .ics</button><button class="btn btn-gold" onclick="apptModal()">+ موعد</button></div></div>
    <div class="badge-note"><i data-lucide="calendar-days"></i> <div>اضغط على أي يوم لإضافة موعد، واضغط على أي حدث لتعديله. صدّر .ics لاستيراد المواعيد في تقويم Apple/Google على جوالك.</div></div>
    <div class="cal-head"><button class="btn btn-ghost btn-sm" onclick="calMove(-1)">‹ السابق</button>
    <h3 style="margin:0">${calRef.toLocaleDateString('ar',{month:'long',year:'numeric'})}</h3>
    <button class="btn btn-ghost btn-sm" onclick="calMove(1)">التالي ›</button></div>
    <div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
}
function calMove(n){calRef.setMonth(calRef.getMonth()+n);renderCalendarGrid()}

  const months=[];const now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:d.toISOString().slice(0,7),lbl:d.toLocaleDateString('ar',{month:'short'}),v:0})}

    </div>
    <div class="grid">
      <div class="card" style="grid-column:span 2;min-width:300px"><h3><i data-lucide="trending-up"></i> الإيرادات المحصّلة — آخر 6 أشهر</h3>
        <div style="display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px">
        ${months.map(m=>`<div style="flex:1;text-align:center"><div style="height:${Math.round(m.v/maxM*130)}px;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:7px 7px 0 0;min-height:3px"></div><div style="font-size:11px;color:var(--muted);margin-top:6px">${m.lbl}</div><div style="font-size:11px">${m.v?Math.round(m.v):''}</div></div>`).join('')}</div></div>

async function loadVisits(){const box=document.getElementById('visitsBox');if(!box)return;try{

  const m=await sb.from('pageviews').select('*',{count:'exact',head:true}).gte('created_at',since30);
  const day=await sb.from('pageviews').select('*',{count:'exact',head:true}).gte('created_at',since1);

  box.innerHTML=`<div style="display:flex;gap:22px;flex-wrap:wrap">
    <div><div style="font-size:26px;font-weight:800">${fmt(t.count)}</div><div style="color:var(--muted);font-size:13px">إجمالي الزيارات</div></div>
    <div><div style="font-size:26px;font-weight:800">${fmt(m.count)}</div><div style="color:var(--muted);font-size:13px">آخر ٣٠ يوم</div></div>
    <div><div style="font-size:26px;font-weight:800">${fmt(day.count)}</div><div style="color:var(--muted);font-size:13px">آخر ٢٤ ساعة</div></div></div>`;
}catch(e){box.innerHTML='<p style="color:var(--muted);font-size:13px">لتفعيل العدّاد: شغّل ملف <b>supabase/analytics.sql</b> في Supabase (جدول ziyarat/pageviews). يبدأ العدّ بعدها تلقائياً.</p>'}}

async function blogUploadCover(e){const f=e.target.files[0];if(!f)return;const st=document.getElementById('b_coverStatus');if(st)st.textContent='جارٍ الرفع…';try{const url=await blogUpload(f,'covers');BLOG.cover=url;const im=document.getElementById('b_coverPrev');if(im){im.src=url;im.classList.remove('hidden')}if(st)st.textContent='تم رفع الغلاف';blogPreview()}catch(err){if(st)st.textContent='تعذّر الرفع: '+(err.message||err)+' — تأكد من وجود bucket عام «blog-images» في Supabase.'}}
async function blogFormat(){
  const text=(document.getElementById('b_body')||{}).value.trim();const msg=document.getElementById('b_fmtMsg');
  if(text.length<10){if(msg){msg.className='msg err';msg.textContent='اكتب نص المقال أولاً.'}return}
  const btn=document.getElementById('b_fmt');if(btn)btn.disabled=true;if(msg){msg.className='msg';msg.innerHTML='جارٍ الترتيب بالذكاء…'}
  let res=null,serverErr='';
  try{const r=await fetch(SUPA_URL+'/functions/v1/blog-format',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({text})});const dd=await r.json().catch(()=>({}));if(r.ok&&dd&&dd.html)res=dd;else serverErr=(dd&&dd.error)||('HTTP '+r.status);}catch(e){serverErr=(e&&e.message)||'تعذّر الاتصال بدالة الذكاء';}
  if(res){if(msg){msg.className='msg ok';msg.textContent='تم الترتيب بالذكاء الاصطناعي (DeepSeek)'}}
  else{res=blogLocalFormat(text);if(msg){msg.className='msg err';msg.innerHTML='تعذّر الترتيب بالذكاء ('+esc(serverErr)+') — استُخدم تنسيق محلّي بديل. تأكد من نشر دالة <b>blog-format</b> وضبط <b>DEEPSEEK_API_KEY</b>.'}}
  BLOG.formatted=res;const ti=document.getElementById('b_title');if(ti&&!ti.value.trim()&&res.title)ti.value=res.title;
  if(btn)btn.disabled=false;blogPreview();
}
function blogResetEditor(){BLOG.form={id:null,title:'',body:'',status:''};BLOG.cover='';BLOG.formatted=null;blogRender();}
function blogEditPost(id){const p=BLOG.posts.find(x=>x.id===id);if(!p)return;
  BLOG.form={id:p.id,title:p.title||'',body:blogStripHtml(p.body_html||''),status:p.status||'published'};
  BLOG.cover=p.cover_url||'';BLOG.formatted={html:p.body_html||'',title:p.title||'',excerpt:p.excerpt||''};
  blogRender();document.getElementById('main').scrollIntoView({behavior:'smooth',block:'start'});}
function blogStripHtml(html){const t=document.createElement('div');t.innerHTML=html||'';t.querySelectorAll('h2,h3,p,li,blockquote,br').forEach(el=>{if(el.tagName==='BR')el.replaceWith('\n');else el.append('\n')});return (t.textContent||'').replace(/\n{3,}/g,'\n\n').trim();}
async function blogSave(status){
  const title=(document.getElementById('b_title')||{}).value.trim();const body=(document.getElementById('b_body')||{}).value.trim();const msg=document.getElementById('b_pubMsg');
  if(!body){if(msg){msg.className='msg err';msg.textContent='اكتب نص المقال أولاً.'}return}
  const fm=BLOG.formatted||blogLocalFormat(body);const finalTitle=title||fm.title||'بدون عنوان';
  const isPub=status==='published';const wasNew=!BLOG.form.id;const wasDraft=BLOG.form.status==='draft';
  const btns=['b_publish','b_draft'].map(i=>document.getElementById(i));btns.forEach(b=>b&&(b.disabled=true));
  if(msg){msg.className='msg';msg.innerHTML=isPub?'جارٍ النشر…':'جارٍ حفظ المسودة…'}
  const row={title:finalTitle,excerpt:fm.excerpt||'',body_html:fm.html,cover_url:BLOG.cover||'',reading_min:blogReadingMin(fm.html),status};
  if(isPub){const d=blogDates();row.greg_date=d.greg;row.hijri_date=d.hijri;row.published_at=new Date().toISOString();}
  let res;
  if(BLOG.form.id){res=await sb.from('posts').update(row).eq('id',BLOG.form.id).select().single();}
  else{res=await sb.from('posts').insert(row).select().single();}
  const{data:saved,error}=res;
  if(error){btns.forEach(b=>b&&(b.disabled=false));if(msg){msg.className='msg err';msg.textContent='تعذّر الحفظ: '+error.message}return}
  if(msg){msg.className='msg ok';msg.textContent=isPub?'تم نشر المقال':'تم حفظ المسودة — تقدر ترجع تعدّلها لاحقاً'}
  BLOG.form={id:null,title:'',body:'',status:''};BLOG.cover='';BLOG.formatted=null;
  try{const{data}=await sb.from('posts').select('*').order('published_at',{ascending:false});BLOG.posts=data||[]}catch(_){}
  if(isPub&&saved&&(wasNew||wasDraft)&&confirm('تم نشر المقال. هل ترسله الآن لكل المشتركين في القائمة البريدية؟')){nlSendPostRow(saved);}
  setTimeout(()=>blogRender(),700);
}
async function blogDeletePost(id){if(!confirm('حذف المقال نهائياً؟'))return;await sb.from('posts').delete().eq('id',id);BLOG.posts=BLOG.posts.filter(p=>p.id!==id);blogRender();}

function waLink(phone,text){return 'https://wa.me/'+String(phone||'').replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(text||'')}
function daysSince(dateStr){if(!dateStr)return null;const d=new Date(dateStr+'T12:00:00');if(isNaN(d))return null;return Math.floor((Date.now()-d.getTime())/86400000)}
function ageLabel(dateStr){const n=daysSince(dateStr);if(n==null)return '—';if(n<=0)return 'اليوم';if(n===1)return 'أمس';if(n<30)return 'منذ '+n+' يوم';const m=Math.floor(n/30);if(m<12)return 'منذ '+m+' شهر';return 'منذ '+Math.floor(m/12)+' سنة'}
function ageColor(dateStr){const n=daysSince(dateStr);if(n==null)return 'var(--muted)';if(n>=90)return 'var(--bad)';if(n>=45)return 'var(--warn)';return 'var(--good)'}

    <div class="row2"><div class="field"><label>النوع</label><select id="sf_type"><option value="pdf">PDF</option><option value="excel">Excel</option><option value="other">آخر</option></select></div>
    <div class="field"><label>تاريخ الاستلام</label><input type="date" id="sf_date" value="${today()}"></div></div>
    <div class="field"><label>رفع الملف (اختياري)</label><input type="file" id="sf_file" accept=".pdf,.xls,.xlsx,.csv,application/pdf"> <span id="sf_status" style="color:var(--muted);font-size:12px"></span></div>
    <div class="field"><label>أو رابط Google Drive</label><input id="sf_url" placeholder="https://drive.google.com/..." dir="ltr"></div>
    <div class="field"><label>ملاحظة (اختياري)</label><input id="sf_note"></div>`,
  async ()=>{const s=(S.suppliers||[]).find(x=>x.id===supId);if(!s)return;const g=i=>document.getElementById(i);
    const name=g('sf_name').value.trim();const type=g('sf_type').value;const date=g('sf_date').value||today();const url0=g('sf_url').value.trim();const note=g('sf_note').value.trim();const file=g('sf_file').files[0];
    if(!name){alert('أدخل اسم الملف');return}
    let url=url0,source=url0?'drive':'';
    if(file){const st=g('sf_status');if(st)st.textContent='جارٍ الرفع…';try{const ext=(file.name.split('.').pop()||'pdf').toLowerCase();const path=`${USER.id}/suppliers/${uid()}.${ext}`;const {error}=await sb.storage.from('supplier-files').upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(error)throw error;url=sb.storage.from('supplier-files').getPublicUrl(path).data.publicUrl;source='upload';}catch(err){if(st)st.textContent='';alert('تعذّر رفع الملف: '+(err.message||err)+'\n\nأنشئ bucket عام باسم «supplier-files» في Supabase → Storage.');return}}

    if(!s.files)s.files=[];s.files.push({id:uid(),name,type,url,source,received:date,note});save();closeModal();openSupplier(supId);
  });

let POS_CART=[];let POS_FILTER='';let POS_STREAM=null;let POS_PAY='نقداً';
function posProducts(){return (S.products||[]).filter(p=>{if(!POS_FILTER)return true;const q=POS_FILTER.toLowerCase();return (p.name||'').toLowerCase().includes(q)||(p.barcode||'').includes(POS_FILTER)||(p.category||'').toLowerCase().includes(q)})}

  document.getElementById('main').innerHTML=`
    <div class="page-head"><h1>الكاشير</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost" onclick="posCameraScan()"><i data-lucide="camera"></i> مسح بالكاميرا</button><button class="btn btn-ghost" onclick="productModal()"><i data-lucide="plus"></i> منتج</button></div></div>
    <div class="pos-wrap">
      <div>
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">

function posRenderGrid(){const g=document.getElementById('posGrid');if(!g)return;const ps=posProducts();
  g.innerHTML=ps.length?ps.map(p=>`<div class="pos-tile" onclick="posAdd('${p.id}')">

  </div>`).join(''):emptyBox('package','لا منتجات مطابقة. أضف منتجاً بزر «منتج».');
