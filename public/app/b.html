  :root{--bg:#0A0A0A;--panel:#171717;--panel2:#1F1F1F;--line:#262626;--ink:#FAFAFA;--muted:#A1A1AA;--gold:#E8C766;--gold2:#F0D488;--goldsoft:rgba(232,199,102,.14);--good:#22c55e;--bad:#ef4444}

  .btn-sm{padding:7px 13px;font-size:13px;border-radius:8px}
  .btn svg{width:16px;height:16px}
  .inl{display:inline-flex;align-items:center;vertical-align:-3px}.inl svg{width:14px;height:14px}
