<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" class="has-wp wp-dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5F5F7">
<title>لوحة إدارة المسابقة — مسابقة الماجد لحفظ السنة النبوية</title>
<link rel="icon" href="assets/logo.png">
<!-- تصميم «نظام الجمعيات الشبابية» كما هو (يُولَّد بـ tools/sync_charity_ui.py) -->
<link rel="stylesheet" href="ui/charity.css?v=1795866868">
<script src="https://unpkg.com/lucide@1.59.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<!-- ADMIN-ROOT -->
<div id="orgWall" aria-hidden="true" style="background-image:url('ui/wall.jpg')"></div>

<div id="loginView" class="login-wrap">
  <div class="login-box">
    <img class="brand-logo" src="assets/logo.png" alt="الشعار" style="max-width:210px;width:72%;display:block;margin:0 auto 12px;border-radius:12px">
    <p>لوحة إدارة المسابقة — دخول فريق المسابقة</p>
    <div class="field"><label for="em">البريد الإلكتروني</label><input type="email" id="em" placeholder="you@email.com" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label for="pw">كلمة المرور</label><input type="password" id="pw" placeholder="••••••••" autocomplete="current-password"></div>
    <button id="btnLogin" class="btn btn-gold" style="width:100%">دخول</button>
    <button id="btnDemo" class="btn btn-ghost" style="width:100%;margin-top:8px">دخول تجريبيّ بلا حساب</button>
    <div id="loginErr" class="lock-note" style="color:var(--bad)"></div>
  </div>
</div>

<div id="appShell" class="hidden">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="logo-area" style="text-align:center"><img class="brand-logo" src="assets/logo.png" alt="الشعار" style="max-width:155px;width:86%;display:block;margin:0 auto 6px;border-radius:10px"><div class="tagline">لوحة إدارة المسابقة</div></div>
      <div id="rMe" class="nv-acct"></div>
      <nav class="nav" id="nav"></nav>
      <div class="nav-foot">
        <a id="toSite" href="index.html" target="_blank" rel="noopener"><span class="nic"><i data-lucide="external-link"></i></span> صفحة التسجيل العامّة</a>
        <a id="navSetup" data-v="setup"><span class="nic"><i data-lucide="settings"></i></span> الإعدادات</a>
        <a id="logout"><span class="nic"><i data-lucide="log-out"></i></span> تسجيل الخروج</a>
      </div>
    </aside>
    <div class="content">
      <header class="content-top">
        <div class="ct-left"><button class="menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button><button class="sb-btn" id="sbToggle" title="طي/فتح القائمة"><i data-lucide="panel-right-close"></i></button><div class="ct-title" id="ctTitle">الرئيسية</div></div>
        <div style="display:flex;align-items:center;gap:10px"><span id="syncDot" title="محفوظ" style="color:var(--good);font-size:10px">●</span><div class="ct-date" id="ctDate"></div></div>
      </header>
      <div class="main" id="main"></div>
      <nav id="dkBar" class="dk-bar" aria-label="الشريط السفليّ"></nav>
    </div>
  </div>
</div>
<div id="modalRoot"></div>
<!-- /ADMIN-ROOT -->

<script src="assets/core.js?v=1795866868"></script>
<script src="assets/admin.js?v=1795866868"></script>
<script>adminMain()</script>
</body>
</html>
