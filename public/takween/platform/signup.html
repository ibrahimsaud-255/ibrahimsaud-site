<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>إنشاء حساب — منصّة التوافق الأسريّ | تكوين الأسرة</title>
<meta name="theme-color" content="#3D5A80" />
<link rel="icon" type="image/webp" href="../assets/logo.webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="assets/platform.css?v=1.0.2" />
<style>
  .signup-page {
    min-height: 100vh; display: flex; flex-direction: column;
    background:
      radial-gradient(circle at 20% 20%, var(--navy-ghost) 0%, transparent 45%),
      radial-gradient(circle at 80% 80%, var(--gold-soft) 0%, transparent 40%),
      var(--cream);
  }
  .signup-head { padding: 18px 30px; display: flex; justify-content: space-between; align-items: center; }
  .signup-head .brand { display: inline-flex; align-items: center; gap: 10px; }
  .signup-head .brand img { height: 42px; }
  .signup-head .home { color: var(--muted); font-size: 13px; font-weight: 600; }
  .signup-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 20px 60px; }
  .signup-card {
    background: var(--paper); border-radius: 24px; padding: 40px 44px;
    max-width: 500px; width: 100%; box-shadow: 0 30px 60px rgba(28,34,55,.08), 0 4px 16px rgba(28,34,55,.04);
    border: 1px solid var(--line);
  }
  .signup-card h1 { text-align: center; font-size: 26px; font-weight: 800; margin: 0 0 6px; color: var(--ink); }
  .signup-card .sub { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 30px; }

  .field {
    background: var(--paper); border: 1.5px solid var(--line-3); border-radius: 14px;
    padding: 4px 14px 4px 4px; display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; transition: border-color .12s;
  }
  .field:focus-within { border-color: var(--navy); }
  .field select, .field input {
    flex: 1; padding: 14px 6px; background: transparent; border: 0; outline: none;
    text-align: right; font-family: var(--font); font-size: 14.5px; color: var(--ink);
  }
  .field .ic { color: var(--muted); display: inline-flex; padding: 0 4px; }
  .field .ic svg { width: 18px; height: 18px; }

  .oath {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 4px;
    font-size: 13px; color: var(--ink-2); cursor: pointer;
  }
  .oath input {
    margin-top: 3px; width: 18px; height: 18px; accent-color: var(--navy);
    flex-shrink: 0;
  }
  .oath a { color: var(--navy); font-weight: 700; }

  .primary-btn {
    width: 100%; padding: 15px; border-radius: 14px; background: var(--navy);
    color: #fff; font-weight: 800; font-size: 15px; margin-top: 18px;
    box-shadow: 0 8px 24px rgba(61,90,128,.28); transition: background .12s;
    border: 0; cursor: pointer;
  }
  .primary-btn:hover { background: var(--navy-dark); }

  .signup-card .footer-note {
    text-align: center; margin-top: 22px; color: var(--muted); font-size: 13.5px;
  }
  .signup-card .footer-note a { color: var(--navy); font-weight: 700; }

  .support-line {
    text-align: center; margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed var(--line); color: var(--muted); font-size: 12.5px;
  }
  .support-line a {
    color: var(--success); font-weight: 700; display: inline-flex; align-items: center; gap: 4px;
    margin-inline-start: 4px;
  }
  .support-line svg { width: 14px; height: 14px; color: #25D366; }

  .terms-line {
    text-align: center; margin-top: 18px; font-size: 11.5px; color: var(--muted);
  }
  .terms-line a { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; }
  .terms-line .sep { margin: 0 8px; opacity: .5; }

  @media (max-width: 520px) {
    .signup-card { padding: 30px 24px; border-radius: 20px; }
    .signup-card h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="proto-ribbon"><div class="msg"><span class="dot"></span> نموذج تفاعليّ — إنشاء حساب جديد</div><a href="login.html">← عودة</a> <span style="margin-inline-start:14px;padding-inline-start:14px;border-inline-start:1px solid rgba(232,206,138,0.3);color:#fff;opacity:.9">تصميم <b style="color:#E8CE8A">إبراهيم سعود</b></span></div>

<div class="signup-page">
  <header class="signup-head">
    <a href="../index.html" class="brand"><img src="../assets/logo.webp" alt="تكوين الأسرة" /></a>
    <a href="login.html" class="home">لديك حساب؟ تسجيل الدخول</a>
  </header>

  <div class="signup-body">
    <div class="signup-card">
      <h1>إنشاء حساب</h1>
      <p class="sub">أنشئ حسابك للبدء في رحلة البحث</p>

      <div class="field">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span>
        <select id="role">
          <option value="">نوع العضويّة</option>
          <option value="man">شابّ</option>
          <option value="woman">فتاة</option>
          <option value="broker">وسيط</option>
        </select>
      </div>

      <div class="field">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
        <input type="password" placeholder="كلمة المرور" />
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
      </div>

      <div class="field">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
        <input type="password" placeholder="تأكيد كلمة المرور" />
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
      </div>

      <label class="oath">
        <input type="checkbox" />
        <span>أُقسم بالله العظيم بأنّي جادٌّ وأنّ هدفي الزواج الشرعيّ.</span>
      </label>

      <label class="oath">
        <input type="checkbox" />
        <span>أتعهّد بأنّ عمري أكبر من ١٨ عاماً، وأنّي قرأتُ <a href="#">الشروط والأحكام</a> ووافقتُ عليها.</span>
      </label>

      <button class="primary-btn" onclick="location.href='wizard-profile.html'">إنشاء حساب</button>

      <div class="footer-note">
        لديك حساب؟ <a href="login.html">تسجيل الدخول ←</a>
      </div>

      <div class="support-line">
        واجهتَ مشكلةً في التسجيل؟
        <a href="https://wa.me/966555824155" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.2-1.8-.9-2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.4.5-.6.2-.2.2-.3.3-.5.1-.2.1-.4 0-.5-.1-.2-.7-1.7-1-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1.1 1-1.1 2.5s1.1 2.9 1.3 3.1c.2.2 2.3 3.4 5.5 4.8.8.3 1.4.5 1.9.7.8.3 1.5.2 2.1.1.6-.1 1.8-.7 2-1.5.3-.7.3-1.4.2-1.5-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 00-8.4 15.4L2 22l4.7-1.5A10 10 0 1012 2z"/></svg>
          تواصل مع الدعم
        </a>
      </div>

      <div class="terms-line">
        <a href="#">سياسة الخصوصيّة</a>
        <span class="sep">·</span>
        <a href="#">الشروط والأحكام</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
