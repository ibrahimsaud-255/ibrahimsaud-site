<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>دليل وليّ الأمر</title>
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<style>
:root{--bg:#F2F2F7;--card:#fff;--l1:#1C1C1E;--l2:#6E6E73;--line:rgba(60,60,67,.14);--acc:#0A84FF}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--l1:#F5F5F7;--l2:#A1A1A6;--line:rgba(235,235,245,.16)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--l1);font:17px/1.6 -apple-system,"SF Arabic","Geeza Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:28px 16px 60px}
.k{color:var(--l2);font-weight:700;font-size:14px;margin:0}h1{font-size:30px;line-height:1.2;margin:4px 0 6px}.sub{color:var(--l2);margin:0 0 20px}
.card{background:var(--card);border-radius:20px;padding:18px;margin:0 0 14px;border:1px solid var(--line)}
.card h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}.card h2 svg{width:20px;height:20px;color:var(--acc)}
.per{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.per:first-of-type{border-top:0}.per b{font-weight:700}.per span{color:var(--l2);font-variant-numeric:tabular-nums;unicode-bidi:isolate;white-space:nowrap}
.txt{white-space:pre-line;margin:0}
.news{padding:12px 0;border-top:1px solid var(--line)}.news:first-of-type{border-top:0}.news b{display:block}.news p{margin:4px 0 0;color:var(--l2)}.news img{width:100%;border-radius:14px;margin-top:8px}.news small{color:var(--l2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:99px;background:var(--acc);color:#fff;font-weight:700;text-decoration:none;margin:0 0 14px}
.btn.wa{background:#25D366}.btn svg{width:22px;height:22px}
.msg{text-align:center;color:var(--l2);padding:40px 0}
</style>
</head>
<body>
<main id="app"><p class="msg">جارٍ التحميل…</p></main>
<script>
/* دليل وليّ الأمر: يفتح بنفس رمز رابط التسجيل (?t=) — المواعيد والفترات، الضوابط، التواصل، والأخبار (قناة أولياء الأمور).
 * توصية «مدينة القيم»: «دليل مختصر لأولياء الأمور قبل البرنامج» و«قناة مباشرة أثناء التنفيذ». ?demo=1 للعرض. */
(function () {
  'use strict';
  const Q = new URLSearchParams(location.search), T = Q.get('t') || '', DEMO = Q.get('demo') === '1';
  const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'https://br-red-smoke-baq7yp0d-api.compute.c-8.eu-central-1.aws.neon.tech' : 'https://br-dark-band-bajth6rv-api.compute.c-8.eu-central-1.aws.neon.tech';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IC = { clock: svg('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'), shield: svg('<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>'),
    bus: svg('<path d="M8 6v6M16 6v6M2 12h20M7 18h10M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>'), news: svg('<path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2M18 14h-8M15 18h-5M10 6h8v4h-8z"/>'),
    chat: svg('<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/>'), shirt: svg('<path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>') };
  const t12 = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return ((h % 12) || 12) + ':' + String(m || 0).padStart(2, '0') + (h < 12 ? ' ص' : ' م'); };
  const fd = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('ar-SA-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
  async function go() {
    let G;
    try { G = DEMO ? { season: 'النادي الصيفيّ ١٤٤٨', org: 'جمعيّة الشباب التجريبيّة', start: '2027-06-27', end: '2027-07-08', reg: true,
        periods: [{ n: 'فترة التحفيز', f: '19:50', e: '20:50' }, { n: 'الفترة الأولى', f: '21:00', e: '21:45' }, { n: 'الفترة الثانية', f: '22:00', e: '22:45' }, { n: 'التموين', f: '22:50', e: '23:15' }, { n: 'الفترة الثالثة', f: '23:25', e: '00:10' }],
        guide: { rules: 'الحضور قبل صلاة العشاء.\nالخروج قبل نهاية البرنامج بإذن مكتوب من وليّ الأمر.\nالجوال مسموح، والنقاط تُكسب بالبطاقة.', dress: 'لباس رياضيّ ساتر، وحذاء رياضيّ.', bus: 'حافلات بسعر رمزيّ من الأحياء — سجّل عند الإدارة.', phone: '966500000000', contact: 'مشرف أولياء الأمور: أ. فهد' },
        news: [{ t: 'انطلاق الموسم يوم الأحد', b: 'نستقبل أبناءكم الساعة ٧:٣٠ مساءً عند البوّابة.', at: new Date().toISOString() }] }
      : await (await fetch(API + '/guide?t=' + encodeURIComponent(T))).json(); } catch (e) { G = { error: 'تعذّر الاتّصال' }; }
    const $ = document.getElementById('app');
    if (!G || G.error) { $.innerHTML = `<div class="msg"><h1>الرابط غير صالح</h1><p>${esc((G || {}).error || '')}</p></div>`; return; }
    const g = G.guide || {}, wa = String(g.phone || '').replace(/\D/g, '');
    document.title = 'دليل وليّ الأمر — ' + G.season;
    $.innerHTML = `<p class="k">${esc(G.org)}</p><h1>دليل وليّ الأمر</h1><p class="sub">${esc(G.season)}${G.start ? ' · من ' + esc(fd(G.start)) + ' إلى ' + esc(fd(G.end || G.start)) : ''}</p>
      ${G.reg ? `<a class="btn" href="../register/?t=${encodeURIComponent(T)}${DEMO ? '&demo=1' : ''}">سجّل ابنك</a>` : ''}
      ${(G.periods || []).length ? `<div class="card"><h2>${IC.clock} يوم البرنامج</h2>${G.periods.map(p => `<div class="per"><b>${esc(p.n)}</b><span><bdi>${t12(p.f)}</bdi> إلى <bdi>${t12(p.e)}</bdi></span></div>`).join('')}</div>` : ''}
      ${g.rules ? `<div class="card"><h2>${IC.shield} الضوابط والدخول والخروج</h2><p class="txt">${esc(g.rules)}</p></div>` : ''}
      ${g.dress ? `<div class="card"><h2>${IC.shirt} اللباس</h2><p class="txt">${esc(g.dress)}</p></div>` : ''}
      ${g.bus ? `<div class="card"><h2>${IC.bus} النقل</h2><p class="txt">${esc(g.bus)}</p></div>` : ''}
      ${(G.news || []).length ? `<div class="card"><h2>${IC.news} آخر الأخبار</h2>${G.news.map(n => `<div class="news"><b>${esc(n.t)}</b>${n.b ? `<p>${esc(n.b)}</p>` : ''}<small>${esc(new Date(n.at).toLocaleDateString('ar-SA-u-nu-latn', { day: 'numeric', month: 'long' }))}</small></div>`).join('')}</div>` : ''}
      ${wa ? `<a class="btn wa" href="https://wa.me/${wa}" target="_blank" rel="noopener">${IC.chat} تواصل مع البرنامج${g.contact ? ' — ' + esc(g.contact) : ''}</a>` : g.contact ? `<div class="card"><h2>${IC.chat} التواصل</h2><p class="txt">${esc(g.contact)}</p></div>` : ''}`;
  }
  go();
})();
</script>
</body>
</html>
