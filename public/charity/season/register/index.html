<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>التسجيل في الموسم</title>
<link rel="icon" href="../icons/icon-192.png" type="image/png">
<style>
:root{--bg:#F2F2F7;--card:#fff;--l1:#1C1C1E;--l2:#6E6E73;--line:rgba(60,60,67,.14);--acc:#0A84FF;--fld:#F2F2F7}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--l1:#F5F5F7;--l2:#A1A1A6;--line:rgba(235,235,245,.16);--fld:#2C2C2E}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--l1);font:17px/1.5 -apple-system,"SF Arabic","Geeza Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:28px 16px 60px}
.k{color:var(--l2);font-weight:700;font-size:14px}h1{font-size:30px;line-height:1.2;margin:4px 0 6px}.sub{color:var(--l2);margin:0 0 20px}
.card{background:var(--card);border-radius:20px;padding:18px;margin:0 0 16px;border:1px solid var(--line)}
.card h2{font-size:17px;margin:0 0 12px}
label{display:block;font-size:14px;font-weight:700;color:var(--l2);margin:12px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--l1);background:var(--fld);border:0;border-radius:12px;padding:12px 14px;min-height:48px}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fee{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.fee b{font-size:28px}
.iban{display:flex;gap:8px;align-items:center;margin-top:10px}.iban code{flex:1;direction:ltr;text-align:left;background:var(--fld);border-radius:12px;padding:12px 14px;font:600 15px ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:99px;background:var(--acc);color:#fff;font-family:inherit;font-weight:700;font-size:17px;line-height:1;cursor:pointer}
.btn.sec{background:var(--fld);color:var(--l1);width:auto;padding:0 18px;min-height:44px;font-size:15px}
.btn:disabled{opacity:.5}
.up{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px dashed var(--line);border-radius:14px;cursor:pointer}.up img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.up svg,.btn svg{width:22px;height:22px;flex:none}
.note{color:var(--l2);font-size:14px;margin:8px 0 0}
.err{color:#FF453A;font-weight:700;margin:12px 0 0}
.done{text-align:center;padding:30px 10px}.done svg{width:84px;height:84px;color:#30D158}.done .ref{font:800 34px ui-monospace,Menlo,monospace;letter-spacing:2px;direction:ltr}
.closed{text-align:center;padding:40px 10px;color:var(--l2)}
</style>
</head>
<body>
<main id="app"><p class="k">جارٍ التحميل…</p></main>
<script>
/* التسجيل العامّ في موسم جمعيّة شبابيّة: وليّ الأمر يسجّل ابنه، ويحوّل الرسوم ويرفع الإيصال (بدل صور الحوالات في واتساب).
 * GET /reg?t= · POST /reg/upload?t= · POST /reg/submit — الإدارة تؤكّد الدفع وتعتمد من «التسجيل» في النظام. ?demo=1 للعرض. */
(function () {
  'use strict';
  const Q = new URLSearchParams(location.search), T = Q.get('t') || '', DEMO = Q.get('demo') === '1';
  const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'https://br-red-smoke-baq7yp0d-api.compute.c-8.eu-central-1.aws.neon.tech' : 'https://br-dark-band-bajth6rv-api.compute.c-8.eu-central-1.aws.neon.tech';
  const $ = document.getElementById('app'), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IC = { up: svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>'), copy: svg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'), ok: svg('<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>') };
  let INFO = null, RECEIPT = '';
  async function load() {
    try {
      INFO = DEMO ? { season: 'النادي الصيفيّ ١٤٤٨', org: 'جمعيّة الشباب التجريبيّة', open: true, fee: 300, bank: 'مصرف الراجحي', iban: 'SA00 8000 0000 0000 0000 0000', note: 'البرنامج من ٨ إلى ١٢ مساءً لمدّة أسبوعين.', stages: ['ابتدائي', 'متوسط', 'ثانوي'] }
        : await (await fetch(API + '/reg?t=' + encodeURIComponent(T))).json();
    } catch (e) { INFO = { error: 'تعذّر الاتّصال — أعد المحاولة' }; }
    if (!INFO || INFO.error) { $.innerHTML = `<div class="closed"><h1>الرابط غير صالح</h1><p>${esc((INFO || {}).error || '')}</p></div>`; return; }
    document.title = 'التسجيل — ' + INFO.season;
    if (!INFO.open) { $.innerHTML = `<p class="k">${esc(INFO.org)}</p><h1>${esc(INFO.season)}</h1><div class="closed card"><b>التسجيل مغلق حالياً</b><p>تابع الجمعيّة لمعرفة موعد فتحه.</p></div>`; return; }
    form();
  }
  function form() {
    const fee = +INFO.fee || 0;
    $.innerHTML = `<p class="k">${esc(INFO.org)}</p><h1>التسجيل في ${esc(INFO.season)}</h1><p class="sub">${esc(INFO.note || 'سجّل ابنك في دقيقة.')}</p>
      <div class="card"><h2>بيانات المشارك</h2>
        <label for="nm">الاسم الثلاثيّ</label><input id="nm" autocomplete="name" maxlength="80">
        <div class="row"><div><label for="st">المرحلة</label><select id="st">${(INFO.stages || []).map(s => `<option>${esc(s)}</option>`).join('')}</select></div><div><label for="gr">الصفّ</label><input id="gr" maxlength="40" placeholder="الثاني المتوسّط"></div></div>
        <div class="row"><div><label for="sc">المدرسة</label><input id="sc" maxlength="80"></div><div><label for="ag">العمر</label><input id="ag" inputmode="numeric" maxlength="2"></div></div>
        <label for="sb">أخوه المشارك معه (اختياريّ)</label><input id="sb" maxlength="80"></div>
      <div class="card"><h2>وليّ الأمر</h2>
        <label for="gn">الاسم</label><input id="gn" maxlength="80">
        <label for="gp">الجوال</label><input id="gp" inputmode="tel" dir="ltr" placeholder="05xxxxxxxx" maxlength="15">
        <label for="nt">ملاحظات صحّيّة أو أخرى (اختياريّ)</label><textarea id="nt" maxlength="300"></textarea></div>
      ${fee ? `<div class="card"><div class="fee"><h2>الرسوم</h2><b>${fee.toLocaleString('en-US')} ر.س</b></div>
        ${INFO.iban ? `<p class="note">حوّل على حساب الجمعيّة${INFO.bank ? ' في ' + esc(INFO.bank) : ''}:</p><div class="iban"><code id="ib">${esc(INFO.iban)}</code><button class="btn sec" id="cp" type="button">${IC.copy} نسخ</button></div>` : ''}
        <label>إيصال التحويل</label><label class="up" for="rf"><span id="rv">${IC.up}</span><span id="rt">ارفع صورة الإيصال أو ملفّ PDF</span></label><input id="rf" type="file" accept="image/*,application/pdf" hidden></div>` : ''}
      <button class="btn" id="go" type="button">أرسل التسجيل</button><p class="err" id="er" role="alert"></p>
      <p class="note">تراجع الجمعيّة الطلب${fee ? ' والإيصال' : ''}، ثمّ يصلك رقم المشارك وبطاقته.</p>`;
    const cp = document.getElementById('cp'); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(INFO.iban.replace(/\s/g, '')); cp.innerHTML = IC.ok + ' نُسخ'; } catch (e) {} };
    const rf = document.getElementById('rf'); if (rf) rf.onchange = upload;
    document.getElementById('go').onclick = submit;
  }
  async function upload(e) {
    const f = e.target.files[0]; if (!f) return; const rt = document.getElementById('rt'), rv = document.getElementById('rv');
    if (f.size > 4 * 1024 * 1024) { rt.textContent = 'الملفّ أكبر من ٤ ميجا'; return; }
    rt.textContent = 'جارٍ الرفع…';
    try {
      if (DEMO) RECEIPT = 'demo'; else {
        const r = await (await fetch(API + '/reg/upload?t=' + encodeURIComponent(T), { method: 'POST', headers: { 'Content-Type': f.type || 'image/jpeg' }, body: f })).json();
        if (r.error) throw new Error(r.error); RECEIPT = r.path;
      }
      rt.textContent = 'رُفع الإيصال'; rv.innerHTML = /^image\//.test(f.type) ? `<img src="${URL.createObjectURL(f)}" alt="">` : IC.ok;
    } catch (er) { rt.textContent = er.message || 'تعذّر الرفع'; RECEIPT = ''; }
  }
  async function submit() {
    const v = id => (document.getElementById(id) || {}).value || '', er = document.getElementById('er'), b = document.getElementById('go'); er.textContent = '';
    const body = { t: T, name: v('nm').trim(), stage: v('st'), grade: v('gr').trim(), school: v('sc').trim(), age: v('ag'), sibling: v('sb').trim(), guardian_name: v('gn').trim(), guardian_phone: v('gp').trim(), notes: v('nt').trim(), receipt: RECEIPT };
    if (body.name.split(/\s+/).length < 3) { er.textContent = 'اكتب اسم المشارك الثلاثيّ'; return; }
    if (body.guardian_phone.replace(/\D/g, '').length < 9) { er.textContent = 'اكتب جوال وليّ الأمر'; return; }
    if (+INFO.fee && !RECEIPT) { er.textContent = 'ارفع إيصال التحويل'; return; }
    b.disabled = true; b.textContent = 'جارٍ الإرسال…';
    try {
      const r = DEMO ? { ok: true, ref: 'DEMO42' } : await (await fetch(API + '/reg/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
      if (r.error) throw new Error(r.error);
      $.innerHTML = `<div class="done">${IC.ok}<h1>وصل تسجيل ${esc(body.name.split(' ')[0])}</h1><p class="sub">رقم الطلب</p><div class="ref">${esc(r.ref)}</div><p class="sub">تراجع ${esc(INFO.org)} الطلب، ثمّ يصلك رقم المشارك وبطاقته على ${esc(body.guardian_phone)}.</p><button class="btn sec" style="margin:18px auto 0" onclick="location.reload()">تسجيل ابن آخر</button></div>`;
    } catch (e) { er.textContent = e.message || 'تعذّر الإرسال'; b.disabled = false; b.textContent = 'أرسل التسجيل'; }
  }
  load();
})();
</script>
</body>
</html>
