name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # المدونة صفحات ثابتة تُبنى من Supabase: كل نصف ساعة نفحص هل تغيّرت المقالات
  # (نشر/تعديل/حذف من لوحة النظام)، ونعيد النشر فقط لو تغيّرت.
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# نشرة واحدة في كل مرة — ولا نلغي نشرة جارية.
#
# مهم: كانت هنا `cancel-in-progress: true`، وهي سبب فشل النشر المتكرّر
# برسالة «Timeout reached, aborting!». عند دفع عدّة كوميتات متقاربة كان
# الإلغاء يقطع نشرة GitHub Pages في منتصفها، فيبقى طلب النشر عالقاً عندهم
# وتنتهي مهلة كل نشرة تالية بعد عشر دقائق. التوصية الرسمية لصفحات Pages
# هي تخطّي الطلبات المنتظرة دون إلغاء الجارية.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # يقارن بصمة المقالات في Supabase بالبصمة المنشورة (/blog/version.txt).
  # الصيغة لازم تطابق blogVersion() في src/lib/blog.ts.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - id: cmp
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          KEY="sb_publishable_T-ka4hy2LVRjUuf0wUH9yA_g4Emxm13"
          NOW=$(curl -fsS "https://rrerwhhxrjyzmnnjsfev.supabase.co/rest/v1/posts?select=*&status=eq.published&order=published_at.desc" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | jq -r 'map(.id + "@" + .published_at + "@" + (.slug // "")) | join(",")') || { echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          LIVE=$(curl -fsS "https://ibrahimsaud.com/blog/version.txt?t=$(date +%s)" || true)
          if [ "$NOW" != "$LIVE" ]; then echo "المقالات تغيّرت — إعادة نشر"; echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          # الإصدار الخامس يستبعد الملفات المخفيّة افتراضياً، وهذا يُسقط
          # ملف .nojekyll الذي أنشأناه للتوّ — وبدونه يتجاهل Pages مجلد
          # ‏_next‏ (لأنه يبدأ بشرطة سفلية) فتنكسر كل ملفات الموقع.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # الموقع كبير نسبياً (‏٥٣م.ب‏ و‏٧٠٠+‏ ملف) فنمنح النشر مهلة أوسع
          # من الافتراضية (عشر دقائق) بدل أن يُجهَض وهو على وشك الاكتمال.
          timeout: 900000

      # IndexNow: نبلّغ بينق (ومنه ChatGPT وCopilot) وياندكس بكلّ روابط خريطة الموقع فور النشر،
      # بدل ما ننتظر الزحف. المفتاح ملفّ علنيّ في public/8091959edd5bfbb4511640246ed90be8.txt. فشله لا يُفشل النشر.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          URLS=$(curl -fsS https://ibrahimsaud.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -s .)
          jq -n --argjson urls "$URLS" '{host:"ibrahimsaud.com",key:"8091959edd5bfbb4511640246ed90be8",keyLocation:"https://ibrahimsaud.com/8091959edd5bfbb4511640246ed90be8.txt",urlList:$urls}' \
            | curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data-binary @-
